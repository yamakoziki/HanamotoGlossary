<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hanamoto Construction Civil Engineering Glossary</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #1a56db;
      --bg: #f3f4f6;
      --card: #fff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --radius: 10px;
    }
    body { font-family: 'Hiragino Kaku Gothic ProN','Noto Sans JP','Meiryo',sans-serif; font-size: 16px; line-height: 1.6; color: var(--text); background: var(--bg); }

    /* Sticky header wrapper */
    .site-header { position: sticky; top: 0; z-index: 100; }

    /* Header */
    header { background: var(--primary); color: white; padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .header-inner { max-width: 720px; margin: 0 auto; }
    header h1 { font-size: 1.25rem; font-weight: 700; }
    .lang-bar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .lang-btn { padding: 6px 18px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.5); background: transparent; color: white; font-size: 0.9rem; font-weight: 600; cursor: pointer; min-height: 44px; transition: background 0.2s; }
    .lang-btn.active { background: white; color: var(--primary); border-color: white; }
    .lang-btn:hover:not(.active) { background: rgba(255,255,255,0.15); }

    /* Controls bar */
    .controls-bar { background: white; border-bottom: 1px solid var(--border); padding: 8px 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .controls-inner { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
    .filter-group { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .filter-all-btn { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border); background: white; font-size: 0.9rem; cursor: pointer; min-height: 44px; white-space: nowrap; font-weight: 600; transition: all 0.15s; }
    .filter-all-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .filter-all-btn:hover:not(.active) { border-color: var(--primary); color: var(--primary); }
    #categorySelect { display: inline-block; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: white; font-size: 0.9rem; cursor: pointer; min-height: 44px; min-width: 120px; color: var(--text); }
    #categorySelect:focus { outline: 2px solid var(--primary); outline-offset: 0; }
    .search-box { position: relative; flex: 1; min-width: 0; }
    .search-box input { width: 100%; padding: 10px 16px 10px 40px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; min-height: 44px; background: white; }
    .search-box input:focus { border-color: var(--primary); }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 1rem; pointer-events: none; }

    /* Main */
    main { max-width: 720px; margin: 0 auto; padding: 20px 16px 80px; }

    /* Result count */
    .result-count { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; }

    /* Term list */
    .term-list { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: white; }

    /* Term item */
    .term-item { border-bottom: 1px solid var(--border); }
    .term-item:last-child { border-bottom: none; }

    /* Term name button */
    .term-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 14px 16px;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      min-height: 44px;
      gap: 12px;
      transition: background 0.15s;
    }
    .term-toggle:hover { background: #f9fafb; }
    .term-toggle.open { background: #eff6ff; color: var(--primary); }
    .term-toggle-text { flex: 1; display: flex; flex-direction: column; align-items: flex-start; }
    .term-reading { font-size: 0.8rem; font-weight: 400; color: var(--muted); margin-left: 6px; }
    .term-romaji { font-size: 12px; color: #888; font-weight: 400; }
    .term-arrow { font-size: 0.75rem; color: var(--muted); flex-shrink: 0; transition: transform 0.2s; }
    .term-toggle.open .term-arrow { transform: rotate(180deg); color: var(--primary); }

    /* Summary panel */
    .term-summary-panel { display: none; padding: 0 16px 16px; border-top: 1px solid #dbeafe; background: #f8faff; }
    .term-summary-panel.open { display: block; }
    .term-summary-text { font-size: 0.97rem; line-height: 1.75; color: #374151; padding-top: 14px; }

    /* Detail toggle button */
    .detail-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      padding: 10px 18px;
      border: 2px solid var(--primary);
      border-radius: 999px;
      background: white;
      color: var(--primary);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
      transition: background 0.15s;
    }
    .detail-toggle:hover { background: #eff6ff; }
    .detail-arrow { font-size: 0.7rem; transition: transform 0.2s; }
    .detail-toggle.open .detail-arrow { transform: rotate(180deg); }

    /* Detail panel */
    .term-detail-panel { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .term-detail-panel.open { display: block; }
    .term-detail-text { font-size: 0.95rem; line-height: 1.8; color: #374151; white-space: pre-wrap; }
    .term-detail-image { width: 100%; border-radius: 8px; margin-top: 16px; display: block; }
    .term-detail-caption { font-size: 0.82rem; color: var(--muted); text-align: center; margin-top: 6px; }

    /* Empty state */
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); background: white; border: 1px solid var(--border); border-radius: var(--radius); }
    .empty .icon { font-size: 2.5rem; margin-bottom: 12px; }

    /* Images in detail panel */
    .term-images-section { margin-top: 16px; }
    .term-images-title { font-size: 0.78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
    .term-image-item { margin-bottom: 16px; }
    .term-image-item:last-child { margin-bottom: 0; }
    .term-detail-caption { font-size: 14px; color: var(--muted); text-align: center; margin-top: 6px; }

    @media (max-width: 600px) {
      header h1 { font-size: 1.1rem; }
      main { padding: 16px 12px 60px; }
      .term-toggle { padding: 13px 14px; }
      .term-summary-panel { padding: 0 14px 14px; }
    }
  </style>
</head>
<body>

<div class="site-header">
  <header>
    <div class="header-inner">
      <h1>Hanamoto Construction Civil Engineering Glossary</h1>
      <div class="lang-bar">
        <button class="lang-btn active" onclick="setLang('ja', this)">JPN</button>
        <button class="lang-btn" onclick="setLang('en', this)">ENG</button>
        <button class="lang-btn" onclick="setLang('lang3', this)">VIE</button>
      </div>
    </div>
  </header>
  <div class="controls-bar">
    <div class="controls-inner">
      <div class="filter-group">
        <button class="filter-all-btn active" id="btn-all" onclick="setCat('all')">All</button>
        <select id="categorySelect" onchange="setCatFromSelect(this)">
          <option value="">分野を選ぶ</option>
        </select>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="search" id="search-input" placeholder="キーワードで検索..." oninput="renderTerms()" autocomplete="off">
      </div>
    </div>
  </div>
</div>

<main>
  <div class="result-count" id="result-count"></div>
  <div id="term-list-wrap"></div>
</main>

<script>
const TERMS = [{"rowNum":2,"id":"001","catCode":"CAT01","nameJa":"測量","readingJa":"そくりょう","summaryJa":"距離・角度・高さを測る全般作業","detailJa":"建設工事の基礎となる作業。トランシットやレベルを使い、現場の位置・形状・高低差を正確に計測する。測量の精度が工事全体の品質を左右する。","nameFr":"Surveying","summaryFr":"The process of measuring distances, angles, and elevations at a construction site.","detailFr":"Surveying is the foundation of all construction work. Using instruments like transits and levels, workers accurately measure the position, shape, and elevation differences at the site. The accuracy of surveying determines the quality of the entire construction project.","nameEn":"Khảo sát","summaryEn":"Công việc đo đạc khoảng cách, góc độ và độ cao tại công trường.","detailEn":"Khảo sát là nền tảng của mọi công trình xây dựng. Sử dụng các thiết bị như máy kinh vĩ và máy thủy bình, công nhân đo chính xác vị trí, hình dạng và chênh lệch độ cao tại công trường. Độ chính xác của khảo sát quyết định chất lượng toàn bộ công trình.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Trình độ","summary3":"Công việc đo đạc toàn diện về khoảng cách, góc độ và độ cao","detail3":"Công việc cơ sở của công trình xây dựng. Sử dụng máy kinh vĩ và máy thủy chuẩn để đo đạc chính xác vị trí, hình dạng và độ chênh lệch cao độ của hiện trường. Độ chính xác của việc tr측量 quyết định chất lượng toàn bộ công trình.","caption3":"","images":[]},{"rowNum":3,"id":"002","catCode":"CAT01","nameJa":"基準点","readingJa":"きじゅんてん","summaryJa":"測量の基準となる固定点","detailJa":"国や自治体が設置した測量の起点となる固定標識。三角点・水準点などがある。工事測量はこの点を基準に行われるため、位置を変えてはならない。","nameFr":"Reference Point","summaryFr":"A fixed point established as the starting reference for surveying.","detailFr":"A fixed marker established by the government or local authorities as the origin for surveying. Types include triangulation points and benchmark points. All construction surveying is based on these points, so they must never be moved.","nameEn":"Điểm chuẩn","summaryEn":"Điểm cố định được thiết lập làm cơ sở tham chiếu cho công tác khảo sát.","detailEn":"Mốc cố định do chính phủ hoặc chính quyền địa phương lập ra làm điểm xuất phát cho công tác khảo sát. Bao gồm điểm tam giác và điểm mốc cao độ. Mọi khảo sát xây dựng đều dựa trên các điểm này nên tuyệt đối không được di chuyển.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Điểm chuẩn","summary3":"Điểm cố định làm chuẩn cho đo đạc","detail3":"Điểm chuẩn cố định được thiết lập bởi quốc gia hoặc chính quyền địa phương làm điểm khởi đầu cho việc đo đạc. Bao gồm điểm tam giác, điểm thủy chuẩn và các điểm khác. Vì việc đo đạc công trình được thực hiện dựa trên điểm này nên không được thay đổi vị trí của nó.","caption3":"","images":[]},{"rowNum":4,"id":"003","catCode":"CAT01","nameJa":"水準測量","readingJa":"すいじゅんそくりょう","summaryJa":"高さの差を測る作業","detailJa":"レベル（水準儀）と標尺を使い、2点間の高低差を測定する作業。道路・水路の勾配設計や排水計画に欠かせない基本測量。","nameFr":"Leveling Survey","summaryFr":"The process of measuring elevation differences between two points.","detailFr":"Using a level and a leveling rod, workers measure the difference in elevation between two points. This is an essential basic survey for designing road and drainage channel gradients and planning drainage systems.","nameEn":"Đo thủy chuẩn","summaryEn":"Quá trình đo chênh lệch độ cao giữa hai điểm.","detailEn":"Sử dụng máy thủy bình và mia, công nhân đo chênh lệch độ cao giữa hai điểm. Đây là phép đo cơ bản thiết yếu để thiết kế độ dốc đường và kênh thoát nước.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Đo cao độ thủy chuẩn","summary3":"Công việc đo chênh lệch độ cao","detail3":"Công việc đo chênh lệch độ cao giữa hai điểm sử dụng máy thủy bình (thủy chuẩn) và thước đo. Đây là phép đo cơ bản không thể thiếu trong thiết kế độ dốc đường bộ, đường thủy và kế hoạch thoát nước.","caption3":"","images":[]},{"rowNum":5,"id":"004","catCode":"CAT01","nameJa":"トランシット","readingJa":"とらんしっと","summaryJa":"角度を測る測量機械","detailJa":"水平角・鉛直角を高精度で測定できる光学機器。杭の位置出しや構造物の方向確認に使用する。現在はトータルステーションが主流。","nameFr":"Transit (Theodolite)","summaryFr":"An optical surveying instrument for measuring horizontal and vertical angles.","detailFr":"An optical instrument capable of measuring horizontal and vertical angles with high precision. Used for staking out pile positions and confirming the direction of structures. The total station is now the mainstream replacement.","nameEn":"Máy kinh vĩ","summaryEn":"Thiết bị khảo sát quang học để đo góc ngang và góc đứng.","detailEn":"Thiết bị quang học có thể đo góc ngang và góc đứng với độ chính xác cao. Dùng để xác định vị trí cọc và kiểm tra hướng của kết cấu. Hiện nay máy toàn đạc là thiết bị chủ đạo.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Thiết bị chuyển tiếp","summary3":"Máy đo đạc để đo góc độ","detail3":"Thiết bị quang học có thể đo góc ngang và góc thẳng đứng với độ chính xác cao. Được sử dụng để định vị cọc và xác định hướng của công trình. Hiện tại máy toàn đạc điện tử là loại chủ yếu được sử dụng.","caption3":"","images":[]},{"rowNum":6,"id":"005","catCode":"CAT01","nameJa":"レベル","readingJa":"れべる","summaryJa":"高さを測る機械（水準儀）","detailJa":"望遠鏡と気泡管を組み合わせた測量機器で、水平視準線を使って高低差を測定する。道路・堤防・水路の高さ管理に広く使われる。","nameFr":"Level (Leveling Instrument)","summaryFr":"A surveying instrument combining a telescope and bubble tube to measure elevation differences.","detailFr":"A surveying instrument combining a telescope and bubble tube that measures elevation differences using a horizontal line of sight. Widely used for managing the height of roads, embankments, and water channels.","nameEn":"Máy thủy bình","summaryEn":"Thiết bị khảo sát kết hợp kính thiên văn và ống bọt nước để đo chênh lệch độ cao.","detailEn":"Thiết bị khảo sát kết hợp kính thiên văn và ống bọt nước, đo chênh lệch độ cao bằng đường ngắm nằm ngang. Được sử dụng rộng rãi để quản lý độ cao của đường, đê và kênh nước.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Mức độ","summary3":"Máy đo độ cao (máy thủy chuẩn)","detail3":"Thiết bị đo đạc kết hợp kính viễn vọng và ống thủy chuẩn, sử dụng đường ngắm ngang để đo chênh lệch độ cao. Được sử dụng rộng rãi trong quản lý độ cao của đường bộ, đê điều và kênh mương.","caption3":"","images":[]},{"rowNum":7,"id":"006","catCode":"CAT01","nameJa":"丁張り","readingJa":"ちょうはり","summaryJa":"工事の位置・高さを示す木の枠組み","detailJa":"掘削や型枠設置の前に、設計通りの位置と高さを現地に示すために設ける仮設の木製枠組み。水糸を張って基準線とする。","nameFr":"Batter Boards","summaryFr":"Temporary wooden frames set up to mark the position and elevation of construction work.","detailFr":"Temporary wooden frames erected before excavation or formwork installation to indicate the designed position and height on site. String lines are stretched between them to serve as reference lines.","nameEn":"Khung định vị","summaryEn":"Khung gỗ tạm thời dựng lên để đánh dấu vị trí và độ cao của công trình.","detailEn":"Khung gỗ tạm thời dựng lên trước khi đào đất hoặc lắp ván khuôn để chỉ rõ vị trí và độ cao thiết kế tại công trường. Dây căng được kéo giữa các khung để làm đường chuẩn.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Định vị và đánh dấu (đinh trương)","summary3":"Khung gỗ chỉ vị trí và độ cao của công trình","detail3":"Khung gỗ tạm thời được thiết lập để chỉ ra vị trí và độ cao theo thiết kế tại hiện trường trước khi thực hiện đào đất và lắp đặt ván khuôn. Căng dây thép để làm đường chuẩn.","caption3":"","images":[]},{"rowNum":8,"id":"007","catCode":"CAT01","nameJa":"杭打ち","readingJa":"くいうち","summaryJa":"測量の基点となる杭を地面に打つこと","detailJa":"測量した位置を現地に記録するため、木杭や鋼杭を地面に打ち込む作業。工事の基準点・境界点・中心線などを表示する。","nameFr":"Staking","summaryFr":"Driving stakes into the ground to mark surveyed positions.","detailFr":"The work of driving wooden or steel stakes into the ground to record surveyed positions on site. Used to mark reference points, boundary points, and centerlines of construction work.","nameEn":"Đóng cọc tiêu","summaryEn":"Đóng cọc xuống đất để đánh dấu các vị trí đã khảo sát.","detailEn":"Công việc đóng cọc gỗ hoặc cọc thép xuống đất để ghi lại các vị trí đã khảo sát tại công trường. Dùng để đánh dấu điểm chuẩn, điểm ranh giới và đường tim công trình.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Đóng cọc","summary3":"Đóng cọc định vị làm điểm chuẩn cho việc đo đạc xuống mặt đất","detail3":"Công việc đóng cọc gỗ hoặc cọc thép vào mặt đất để ghi lại vị trí đã đo đạc tại hiện trường. Dùng để chỉ thị điểm chuẩn thi công, điểm ranh giới, đường trung tâm, v.v.","caption3":"","images":[]},{"rowNum":9,"id":"008","catCode":"CAT01","nameJa":"縦断測量","readingJa":"じゅうだんそくりょう","summaryJa":"道路・水路に沿った高さの変化を測る","detailJa":"道路や水路の中心線に沿って一定間隔で高さを測定し、縦断面図を作成する作業。勾配の計算や土量算出に使用する。","nameFr":"Profile Survey","summaryFr":"Measuring elevation changes along the centerline of a road or channel.","detailFr":"Measuring elevations at regular intervals along the centerline of a road or water channel to create a longitudinal profile drawing. Used for calculating gradients and earthwork volumes.","nameEn":"Đo trắc dọc","summaryEn":"Đo sự thay đổi độ cao dọc theo đường tim của đường hoặc kênh.","detailEn":"Đo độ cao tại các khoảng cách đều nhau dọc theo đường tim của đường hoặc kênh nước để tạo bản vẽ mặt cắt dọc. Dùng để tính độ dốc và khối lượng đất.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Tr測lượng dọc","summary3":"Đo sự thay đổi độ cao dọc theo đường bộ và đường thủy","detail3":"Công việc đo đạc độ cao theo khoảng cách nhất định dọc theo đường trung tâm của đường bộ và đường thủy, tạo ra bản vẽ mặt cắt dọc. Được sử dụng để tính toán độ dốc và khối lượng đất.","caption3":"","images":[]},{"rowNum":10,"id":"009","catCode":"CAT01","nameJa":"横断測量","readingJa":"おうだんそくりょう","summaryJa":"道路・水路に直角方向の断面を測る","detailJa":"道路や水路の中心線に直角な方向の断面形状を測定する作業。横断面図を基に土工数量を計算する。","nameFr":"Cross-Section Survey","summaryFr":"Measuring the cross-sectional shape perpendicular to a road or channel centerline.","detailFr":"Measuring the cross-sectional shape in a direction perpendicular to the centerline of a road or water channel. Cross-section drawings are used as the basis for calculating earthwork quantities.","nameEn":"Đo trắc ngang","summaryEn":"Đo hình dạng mặt cắt ngang vuông góc với đường tim của đường hoặc kênh.","detailEn":"Đo hình dạng mặt cắt theo hướng vuông góc với đường tim của đường hoặc kênh nước. Bản vẽ mặt cắt ngang được dùng làm cơ sở tính toán khối lượng đất.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Khảo sát cắt ngang","summary3":"Đo mặt cắt ngang vuông góc với đường và kênh","detail3":"Công việc đo đạc hình dạng mặt cắt ngang theo hướng vuông góc với đường trung tâm của đường bộ hoặc đường thủy. Tính toán khối lượng đào đắp đất dựa trên bản vẽ mặt cắt ngang.","caption3":"","images":[]},{"rowNum":11,"id":"010","catCode":"CAT01","nameJa":"座標","readingJa":"ざひょう","summaryJa":"位置を数値で表すX・Y・Z値","detailJa":"平面上の位置をX（東西）・Y（南北）の数値で、高さをZ値で表したもの。CADや測量データの基本単位。","nameFr":"Coordinates","summaryFr":"Numerical values (X, Y, Z) representing a position in space.","detailFr":"A position on a plane expressed numerically as X (east-west) and Y (north-south), with height expressed as a Z value. The basic unit of CAD and survey data.","nameEn":"Tọa độ","summaryEn":"Các giá trị số (X, Y, Z) biểu thị vị trí trong không gian.","detailEn":"Vị trí trên mặt phẳng được biểu thị bằng số X (đông-tây) và Y (nam-bắc), với độ cao được biểu thị bằng giá trị Z. Đơn vị cơ bản của CAD và dữ liệu khảo sát.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Tọa độ","summary3":"Giá trị X・Y・Z biểu thị vị trí bằng số","detail3":"Biểu thị vị trí trên mặt phẳng bằng các giá trị số X (đông-tây) và Y (nam-bắc), độ cao bằng giá trị Z. Đây là đơn vị cơ bản của dữ liệu CAD và tr측량.","caption3":"","images":[]},{"rowNum":12,"id":"011","catCode":"CAT01","nameJa":"標高","readingJa":"ひょうこう","summaryJa":"海面からの高さ（TP）","detailJa":"東京湾平均海面（T.P.=Tokyo Peil）を基準（0m）とした高さ。日本全国の高さはこの値で統一されている。","nameFr":"Elevation","summaryFr":"Height measured from mean sea level (T.P. = Tokyo Peil).","detailFr":"Height referenced from the mean sea level of Tokyo Bay (T.P. = Tokyo Peil), set at 0 m. Heights across Japan are unified using this value.","nameEn":"Cao độ","summaryEn":"Độ cao tính từ mực nước biển trung bình (T.P. = Tokyo Peil).","detailEn":"Độ cao tính từ mực nước biển trung bình của vịnh Tokyo (T.P. = Tokyo Peil), lấy làm 0 m. Độ cao trên khắp Nhật Bản được thống nhất theo giá trị này.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Độ cao (so với mực nước biển)","summary3":"Độ cao so với mực nước biển (TP)","detail3":"Độ cao lấy mực nước biển trung bình Vịnh Tokyo (T.P.=Tokyo Peil) làm chuẩn (0m). Độ cao trên toàn quốc Nhật Bản được thống nhất theo giá trị này.","caption3":"","images":[]},{"rowNum":13,"id":"012","catCode":"CAT01","nameJa":"視準","readingJa":"しじゅん","summaryJa":"測量機器で目標点を正確に狙うこと","detailJa":"トランシットやレベルの望遠鏡を使い、ターゲット（標尺・プリズム等）に正確に照準を合わせる操作。測量精度の根本となる基本動作。","nameFr":"Sighting","summaryFr":"The act of accurately aiming a surveying instrument at a target point.","detailFr":"The operation of accurately aligning the telescope of a transit or level with a target (leveling rod, prism, etc.). This is the fundamental action that determines surveying accuracy.","nameEn":"Ngắm chuẩn","summaryEn":"Hành động nhắm chính xác thiết bị khảo sát vào điểm mục tiêu.","detailEn":"Thao tác căn chỉnh chính xác kính thiên văn của máy kinh vĩ hoặc máy thủy bình vào mục tiêu (mia, lăng kính, v.v.). Đây là thao tác cơ bản quyết định độ chính xác của khảo sát.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Định hướng","summary3":"Việc ngắm chính xác điểm mục tiêu bằng thiết bị đo đạc","detail3":"Thao tác ngắm chính xác vào mục tiêu (thước chuẩn, lăng kính, v.v.) bằng kính thiên văn của máy kinh vĩ hoặc máy thủy chuẩn. Đây là thao tác cơ bản làm nền tảng cho độ chính xác của phép đo đạc.","caption3":"","images":[]},{"rowNum":14,"id":"013","catCode":"CAT01","nameJa":"平板測量","readingJa":"へいばんそくりょう","summaryJa":"現地で直接図面を描く測量法","detailJa":"測量板・アリダード・巻尺を使い、現地で直接図面を描く測量方法。小規模現場の平面図作成に用いられる。","nameFr":"Plane Table Survey","summaryFr":"A surveying method where drawings are made directly on-site.","detailFr":"A surveying method using a plane table, alidade, and tape measure to draw maps directly in the field. Used for creating plan drawings of small-scale sites.","nameEn":"Đo bàn phẳng","summaryEn":"Phương pháp khảo sát vẽ bản đồ trực tiếp tại công trường.","detailEn":"Phương pháp khảo sát sử dụng bàn phẳng, thước ngắm và thước dây để vẽ bản đồ trực tiếp tại hiện trường. Dùng để tạo bản vẽ mặt bằng cho các công trường quy mô nhỏ.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Trước kia, trước khi có máy toàn đạc điện tử, khảo sát bản đồ địa hình được thực hiện bằng cách kết hợp sử dụng máy kinh vĩ và máy thủy chuẩn. Tuy nhiên, phương pháp này đòi hỏi nhiều thao tác phức tạp và tốn thời gian.\n\nĐo đạc bảng phẳng là một phương pháp đo vẽ trực tiếp bản đồ địa hình ngay tại hiện trường bằng cách sử dụng thiết bị gọi là bảng đo (plane table). Đây là phương pháp cho phép vừa đo đạc vừa vẽ bản đồ đồng thời, giúp tiết kiệm thời gian và công sức so với các phương pháp truyền thống.","summary3":"Phương pháp đo đạc vẽ bản đồ trực tiếp tại hiện trường","detail3":"Phương pháp đo đạc vẽ trực tiếp bản vẽ tại hiện trường sử dụng bàn đo, thước ngắm và thước cuộn. Được sử dụng để tạo bản vẽ mặt bằng cho các công trường quy mô nhỏ.","caption3":"","images":[]},{"rowNum":15,"id":"014","catCode":"CAT02","nameJa":"施工計画書","readingJa":"せこうけいかくしょ","summaryJa":"工事の手順・方法をまとめた文書","detailJa":"工事の施工方法・工程・安全対策・品質管理などを体系的にまとめた計画書。着工前に発注者へ提出・承認を得る重要書類。","nameFr":"Construction Plan","summaryFr":"A document systematically summarizing construction methods, schedules, and safety measures.","detailFr":"A planning document that systematically summarizes construction methods, schedules, safety measures, and quality control. An important document that must be submitted to the client and approved before work begins.","nameEn":"Kế hoạch thi công","summaryEn":"Tài liệu tóm tắt có hệ thống về phương pháp, tiến độ và biện pháp an toàn xây dựng.","detailEn":"Tài liệu kế hoạch tóm tắt có hệ thống về phương pháp thi công, tiến độ, biện pháp an toàn và kiểm soát chất lượng. Tài liệu quan trọng phải nộp cho chủ đầu tư và được phê duyệt trước khi bắt đầu công việc.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Kế hoạch thi công","summary3":"Tài liệu tổng hợp quy trình và phương pháp thi công","detail3":"Bản kế hoạch tổng hợp có hệ thống về phương pháp thi công, quy trình, các biện pháp an toàn và quản lý chất lượng của công trình. Đây là tài liệu quan trọng cần được nộp cho chủ đầu tư và xin phê duyệt trước khi khởi công.","caption3":"","images":[]},{"rowNum":16,"id":"015","catCode":"CAT02","nameJa":"工程表","readingJa":"こうていひょう","summaryJa":"工事のスケジュール一覧表","detailJa":"工事の各作業をいつ・どの順序で行うかを示した工程管理ツール。バーチャートやネットワーク工程表が一般的。","nameFr":"Construction Schedule","summaryFr":"A schedule chart showing when and in what order each construction task will be performed.","detailFr":"A construction management tool showing when and in what order each construction task will be performed. Bar charts and network diagrams are commonly used formats.","nameEn":"Biểu đồ tiến độ","summaryEn":"Biểu đồ lịch trình cho thấy thứ tự và thời điểm thực hiện từng công việc xây dựng.","detailEn":"Công cụ quản lý tiến độ xây dựng cho thấy thứ tự và thời điểm thực hiện từng công việc xây dựng. Biểu đồ thanh và sơ đồ mạng lưới là các định dạng thường dùng.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Biểu đồ tiến độ","summary3":"Bảng danh sách tiến độ công trình","detail3":"Công cụ quản lý tiến độ thể hiện thời điểm và trình tự thực hiện các công việc trong thi công. Phổ biến là biểu đồ thanh (bar chart) và biểu đồ tiến độ mạng lưới (network schedule).","caption3":"","images":[]},{"rowNum":17,"id":"016","catCode":"CAT02","nameJa":"安全計画","readingJa":"あんぜんけいかく","summaryJa":"事故防止のための取り組み計画","detailJa":"工事中の労働災害・第三者災害を防止するための具体的な安全対策をまとめた計画書。KY活動・保護具使用・危険箇所の管理方法などを含む。","nameFr":"Safety Plan","summaryFr":"A plan outlining specific safety measures to prevent accidents during construction.","detailFr":"A planning document summarizing specific safety measures to prevent occupational accidents and third-party incidents during construction. Includes KY activities, protective equipment use, and methods for managing hazardous areas.","nameEn":"Kế hoạch an toàn","summaryEn":"Kế hoạch phác thảo các biện pháp an toàn cụ thể để phòng ngừa tai nạn trong quá trình xây dựng.","detailEn":"Tài liệu kế hoạch tóm tắt các biện pháp an toàn cụ thể để phòng ngừa tai nạn lao động và tai nạn bên thứ ba trong quá trình xây dựng. Bao gồm hoạt động KY, sử dụng thiết bị bảo hộ và phương pháp quản lý khu vực nguy hiểm.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Kế hoạch an toàn","summary3":"Kế hoạch thực hiện các biện pháp phòng ngừa tai nạn","detail3":"Kế hoạch tổng hợp các biện pháp an toàn cụ thể nhằm phòng ngừa tai nạn lao động và tai nạn đối với bên thứ ba trong quá trình thi công. Bao gồm hoạt động KY (Kiken Yochi - dự báo nguy hiểm), việc sử dụng đồ bảo hộ, phương pháp quản lý các điểm nguy hiểm.","caption3":"","images":[]},{"rowNum":18,"id":"017","catCode":"CAT02","nameJa":"仮設","readingJa":"かせつ","summaryJa":"工事中だけ一時的に設ける設備・建物","detailJa":"工事の期間中だけ使用する一時的な施設の総称。仮設事務所・仮設トイレ・仮設電力・仮設水道などがある。工事完了後は撤去する。","nameFr":"Temporary Facilities","summaryFr":"Facilities and structures set up temporarily only during construction.","detailFr":"A general term for temporary facilities used only during the construction period. Includes temporary offices, portable toilets, temporary power supply, and temporary water supply. All are removed after construction is complete.","nameEn":"Công trình tạm","summaryEn":"Cơ sở hạ tầng và công trình được dựng lên tạm thời chỉ trong thời gian thi công.","detailEn":"Thuật ngữ chung cho các cơ sở tạm thời chỉ sử dụng trong thời gian xây dựng. Bao gồm văn phòng tạm, nhà vệ sinh di động, nguồn điện tạm và cấp nước tạm. Tất cả được tháo dỡ sau khi hoàn thành công trình.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"tạm thời","summary3":"Thiết bị và công trình tạm thời chỉ được thiết lập trong thời gian thi công","detail3":"Tên gọi chung cho các công trình tạm thời chỉ sử dụng trong thời gian thi công. Bao gồm văn phòng tạm, nhà vệ sinh tạm, hệ thống điện tạm, hệ thống cấp nước tạm, v.v. Các công trình này sẽ được tháo dỡ sau khi hoàn thành thi công.","caption3":"","images":[]},{"rowNum":19,"id":"018","catCode":"CAT02","nameJa":"仮囲い","readingJa":"かりがこい","summaryJa":"工事現場を囲む仮の柵やパネル","detailJa":"工事現場の周囲を囲んで第三者の立入りを防ぎ、安全を確保する仮設の囲い。鋼板パネル・フェンス・ネットなどが使われる。","nameFr":"Temporary Fence","summaryFr":"A temporary enclosure surrounding a construction site to prevent unauthorized entry.","detailFr":"A temporary enclosure surrounding a construction site to prevent third parties from entering and to ensure safety. Steel panels, fences, and nets are commonly used materials.","nameEn":"Hàng rào tạm","summaryEn":"Rào chắn tạm thời bao quanh công trường để ngăn người không có phận sự vào.","detailEn":"Rào chắn tạm thời bao quanh công trường để ngăn bên thứ ba xâm nhập và đảm bảo an toàn. Tấm thép, hàng rào và lưới là vật liệu thường dùng.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Hàng rào tạm thời","summary3":"Hàng rào tạm thời và tấm panel bao quanh công trường xây dựng","detail3":"Hàng rào tạm thời bao quanh công trường xây dựng để ngăn chặn người thứ ba xâm nhập và đảm bảo an toàn. Sử dụng các tấm thép, hàng rào, lưới, v.v.","caption3":"","images":[]},{"rowNum":20,"id":"019","catCode":"CAT02","nameJa":"資材搬入","readingJa":"しざいはんにゅう","summaryJa":"工事に使う材料を現場に運び込むこと","detailJa":"コンクリート・鋼材・砕石・パイプ等の工事資材をトラックで運搬し、現場に搬入する作業。搬入計画を立て、安全に行う必要がある。","nameFr":"Material Delivery","summaryFr":"Transporting construction materials to the site by truck.","detailFr":"The work of transporting construction materials such as concrete, steel, crushed stone, and pipes by truck to the construction site. A delivery plan must be prepared and carried out safely.","nameEn":"Vận chuyển vật liệu","summaryEn":"Vận chuyển vật liệu xây dựng đến công trường bằng xe tải.","detailEn":"Công việc vận chuyển vật liệu xây dựng như bê tông, thép, đá dăm và ống bằng xe tải đến công trường. Cần lập kế hoạch vận chuyển và thực hiện an toàn.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Vận chuyển nguyên vật liệu vào","summary3":"Việc vận chuyển vật liệu xây dựng đến công trường","detail3":"Công việc vận chuyển bằng xe tải và đưa vào công trường các vật liệu xây dựng như bê tông, thép, đá dăm, ống và các vật liệu khác. Cần lập kế hoạch vận chuyển và thực hiện một cách an toàn.","caption3":"","images":[]},{"rowNum":21,"id":"020","catCode":"CAT02","nameJa":"重機手配","readingJa":"じゅうきてはい","summaryJa":"ショベルカーなど大型機械の手配","detailJa":"掘削・積込・締固め・吊上げ等の作業に必要なバックホウ・ダンプ・ローラー・クレーン等の建設機械を調達・配置すること。","nameFr":"Heavy Equipment Arrangement","summaryFr":"Procuring and positioning heavy construction machinery for site work.","detailFr":"Procuring and positioning construction machinery such as backhoes, dump trucks, rollers, and cranes needed for excavation, loading, compaction, and lifting operations.","nameEn":"Bố trí thiết bị hạng nặng","summaryEn":"Thu xếp và bố trí máy móc xây dựng hạng nặng cho công trường.","detailEn":"Thu xếp và bố trí máy móc xây dựng như máy đào, xe ben, máy lu và cần cẩu cần thiết cho các hoạt động đào đất, bốc dỡ, đầm chặt và nâng hạ.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Điều phối máy móc hạng nặng","summary3":"Sắp xếp máy móc lớn như máy đào","detail3":"Thu mua và bố trí các máy móc xây dựng như máy xúc bối, xe ben, lu lèn, cần cẩu, v.v. cần thiết cho các công việc đào, xúc lên, đầm nén, nâng hàng, v.v.","caption3":"","images":[]},{"rowNum":22,"id":"021","catCode":"CAT02","nameJa":"試掘","readingJa":"しくつ","summaryJa":"地下埋設物を確認するための事前掘削","detailJa":"本掘削の前に、地下に埋設されている水道管・ガス管・電線管などの位置を確認するために行う小規模な試験的掘削。","nameFr":"Test Pit","summaryFr":"A small preliminary excavation to confirm the location of underground utilities.","detailFr":"A small-scale test excavation performed before main excavation to confirm the location of underground utilities such as water pipes, gas pipes, and conduits.","nameEn":"Hố thử","summaryEn":"Đào thử quy mô nhỏ để xác nhận vị trí của các công trình ngầm.","detailEn":"Đào thử quy mô nhỏ trước khi đào chính để xác nhận vị trí của các công trình ngầm như ống nước, ống gas và ống điện.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Khoan thăm dò","summary3":"Đào thăm dò trước để xác nhận các công trình ngầm dưới lòng đất","detail3":"Việc đào thử nghiệm quy mô nhỏ được thực hiện trước khi đào chính thức nhằm xác định vị trí của các đường ống nước, đường ống gas, đường ống dây điện và các công trình khác được chôn ngầm dưới lòng đất.","caption3":"","images":[]},{"rowNum":23,"id":"022","catCode":"CAT02","nameJa":"埋設物確認","readingJa":"まいせつぶつかくにん","summaryJa":"地中の水道管・ガス管などの位置確認","detailJa":"掘削工事前に、地中に埋まっている各種管路・ケーブルの位置・深さを図面・試掘・探査機器等で確認する作業。破損事故防止の重要作業。","nameFr":"Underground Utility Check","summaryFr":"Confirming the position of buried pipes and cables before excavation.","detailFr":"The work of confirming the position and depth of various buried pipes and cables before excavation work, using drawings, test pits, and detection equipment. An important task for preventing damage accidents.","nameEn":"Kiểm tra công trình ngầm","summaryEn":"Xác nhận vị trí của ống và cáp ngầm trước khi đào.","detailEn":"Công việc xác nhận vị trí và độ sâu của các loại ống và cáp chôn ngầm trước khi đào, sử dụng bản vẽ, hố thử và thiết bị dò. Công việc quan trọng để phòng ngừa tai nạn hư hỏng.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Xác nhận vật chôn ngầm","summary3":"Xác nhận vị trí đường ống cấp nước, ống dẫn gas và các ống khác dưới lòng đất","detail3":"Công việc xác nhận vị trí và độ sâu của các loại đường ống, cáp chôn trong lòng đất bằng bản vẽ, đào thử và thiết bị thăm dò trước khi tiến hành công trình khoan. Đây là công việc quan trọng để ngăn ngừa tai nạn hư hỏng.","caption3":"","images":[]},{"rowNum":24,"id":"023","catCode":"CAT02","nameJa":"作業員名簿","readingJa":"さぎょういんめいぼ","summaryJa":"現場で働く人の一覧リスト","detailJa":"現場で作業するすべての作業員の氏名・所属・資格・緊急連絡先などを記載したリスト。安全管理・労務管理の基本書類。","nameFr":"Worker List","summaryFr":"A list of all workers at the site including name, affiliation, qualifications, and emergency contacts.","detailFr":"A list recording the name, affiliation, qualifications, and emergency contact of all workers at the construction site. A basic document for safety management and labor management.","nameEn":"Danh sách công nhân","summaryEn":"Danh sách tất cả công nhân tại công trường bao gồm tên, đơn vị, bằng cấp và liên hệ khẩn cấp.","detailEn":"Danh sách ghi lại tên, đơn vị, bằng cấp và liên hệ khẩn cấp của tất cả công nhân tại công trường. Tài liệu cơ bản cho quản lý an toàn và quản lý lao động.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Danh sách công nhân","summary3":"Danh sách các nhân viên làm việc tại hiện trường","detail3":"Danh sách ghi rõ họ tên, đơn vị trực thuộc, trình độ chuyên môn, thông tin liên lạc khẩn cấp của tất cả công nhân làm việc tại hiện trường. Tài liệu cơ bản cho quản lý an toàn và quản lý lao động.","caption3":"","images":[]},{"rowNum":25,"id":"024","catCode":"CAT02","nameJa":"KY活動","readingJa":"けーわいかつどう","summaryJa":"危険予知活動（毎朝の安全確認）","detailJa":"KYとは「危険予知」の略。作業開始前に作業員全員でその日の作業の危険ポイントを話し合い、対策を確認する安全活動。","nameFr":"KY Activity (Hazard Prediction)","summaryFr":"A safety activity where workers discuss potential hazards before starting work.","detailFr":"KY stands for 'Kiken Yochi' (hazard prediction). A safety activity conducted before work begins where all workers discuss the danger points of that day's work and confirm countermeasures.","nameEn":"Hoạt động KY (Dự đoán nguy hiểm)","summaryEn":"Hoạt động an toàn trong đó công nhân thảo luận về các mối nguy hiểm tiềm ẩn trước khi bắt đầu công việc.","detailEn":"KY là viết tắt của 'Kiken Yochi' (dự đoán nguy hiểm). Hoạt động an toàn được thực hiện trước khi bắt đầu công việc, trong đó tất cả công nhân thảo luận về các điểm nguy hiểm của công việc trong ngày và xác nhận các biện pháp đối phó.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Hoạt động KY","summary3":"Hoạt động dự báo nguy hiểm (xác nhận an toàn hàng sáng)","detail3":"KY là viết tắt của \"dự báo nguy hiểm\". Đây là hoạt động an toàn trong đó tất cả công nhân thảo luận về các điểm nguy hiểm trong công việc của ngày hôm đó và xác nhận các biện pháp đối phó trước khi bắt đầu làm việc.","caption3":"","images":[]},{"rowNum":26,"id":"025","catCode":"CAT02","nameJa":"朝礼","readingJa":"ちょうれい","summaryJa":"作業開始前の全員集合・安全確認","detailJa":"毎朝作業開始前に全作業員が集まり、当日の作業内容・安全注意事項・連絡事項を確認する場。KY活動もここで行う。","nameFr":"Morning Assembly","summaryFr":"A daily gathering of all workers before work to confirm the day's tasks and safety precautions.","detailFr":"A gathering of all workers every morning before work begins to confirm the day's work content, safety precautions, and announcements. KY activities are also conducted here.","nameEn":"Họp đầu ca","summaryEn":"Cuộc tập hợp hàng ngày của tất cả công nhân trước khi làm việc để xác nhận nhiệm vụ và lưu ý an toàn trong ngày.","detailEn":"Cuộc tập hợp của tất cả công nhân mỗi sáng trước khi bắt đầu công việc để xác nhận nội dung công việc trong ngày, lưu ý an toàn và thông báo. Hoạt động KY cũng được thực hiện tại đây.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Chào cờ đầu giờ","summary3":"Tập hợp toàn bộ nhân viên và xác nhận an toàn trước khi bắt đầu công việc","detail3":"Mỗi sáng trước khi bắt đầu công việc, toàn bộ công nhân tập trung lại để xác nhận nội dung công việc trong ngày, các vấn đề cần chú ý về an toàn và các thông báo liên lạc. Hoạt động KY cũng được thực hiện tại đây.","caption3":"","images":[]},{"rowNum":27,"id":"026","catCode":"CAT02","nameJa":"墨出し","readingJa":"すみだし","summaryJa":"施工位置を現地に線で示すこと","detailJa":"設計図の寸法・位置を現地の床・壁・地面に墨（墨汁）やチョークで線を引いて示す作業。型枠設置・配筋・仕上げの基準となる。","nameFr":"Layout Marking","summaryFr":"Drawing lines on the ground or structure to indicate the position and dimensions from design drawings.","detailFr":"The work of drawing lines on floors, walls, and the ground using ink or chalk to show the dimensions and positions from design drawings. Serves as the reference for formwork installation, reinforcement placement, and finishing.","nameEn":"Vạch mực","summaryEn":"Vẽ đường trên mặt đất hoặc công trình để chỉ vị trí và kích thước từ bản vẽ thiết kế.","detailEn":"Công việc vẽ đường trên sàn, tường và mặt đất bằng mực hoặc phấn để thể hiện kích thước và vị trí từ bản vẽ thiết kế. Đóng vai trò tham chiếu cho việc lắp ván khuôn, đặt cốt thép và hoàn thiện.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Đánh dấu mực (thi công định vị)","summary3":"Chỉ ra vị trí thi công bằng đường kẻ trên thực địa","detail3":"Công việc đánh dấu kích thước và vị trí từ bản thiết kế bằng cách kẻ các đường bằng mực (nước mực) hoặc phấn trên sàn, tường và mặt đất tại hiện trường. Đây là cơ sở để lắp đặt cốp pha, bố trí cốt thép và hoàn thiện.","caption3":"","images":[]},{"rowNum":28,"id":"027","catCode":"CAT03","nameJa":"掘削","readingJa":"くっさく","summaryJa":"地面を掘ること","detailJa":"バックホウ等の重機で地面・地盤を掘り下げる作業。構造物の基礎・管路・水路などを設けるための基本作業。","nameFr":"Excavation","summaryFr":"The work of digging into the ground using heavy machinery.","detailFr":"The work of digging into the ground and subgrade using backhoes and other heavy machinery. A fundamental operation for creating foundations for structures, pipe trenches, and water channels.","nameEn":"Đào đất","summaryEn":"Công việc đào đất bằng máy móc hạng nặng.","detailEn":"Công việc đào sâu vào lòng đất và nền đất bằng máy đào và các máy móc hạng nặng khác. Thao tác cơ bản để tạo móng cho công trình, rãnh ống và kênh nước.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Khoan khảo","summary3":"Việc đào đất","detail3":"Công việc đào sâu mặt đất, nền đất bằng máy móc hạng nặng như máy xúc đào. Đây là công việc cơ bản để thiết lập móng công trình, đường ống, kênh dẫn nước.","caption3":"","images":[]},{"rowNum":29,"id":"028","catCode":"CAT03","nameJa":"床掘り","readingJa":"とこぼり","summaryJa":"構造物の基礎を作るための掘削","detailJa":"構造物（橋梁・水路・建物等）の基礎部分を設置するために地盤を所定の深さまで掘削する作業。正確な位置・深さで掘ることが重要。","nameFr":"Foundation Excavation","summaryFr":"Excavation to the required depth for installing structural foundations.","detailFr":"Excavation of the ground to a specified depth for installing the foundations of structures such as bridges, water channels, and buildings. It is important to excavate at the correct position and depth.","nameEn":"Đào móng","summaryEn":"Đào đến độ sâu cần thiết để lắp đặt móng kết cấu.","detailEn":"Đào nền đất đến độ sâu quy định để lắp đặt móng của các kết cấu như cầu, kênh nước và công trình. Quan trọng là phải đào đúng vị trí và độ sâu.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Đào móng","summary3":"Đào đất để tạo móng cho công trình","detail3":"Công việc đào đất đến độ sâu quy định để lắp đặt phần móng của các công trình (cầu, kênh mương, tòa nhà, v.v.). Việc đào ở vị trí và độ sâu chính xác là quan trọng.","caption3":"","images":[]},{"rowNum":30,"id":"029","catCode":"CAT03","nameJa":"残土","readingJa":"ざんど","summaryJa":"掘削して出た余った土","detailJa":"掘削工事で発生した余剰土砂。盛土に利用できる場合もあるが、多くは産業廃棄物として適切に処分（残土処分場への搬出）が必要。","nameFr":"Surplus Soil","summaryFr":"Excess soil generated from excavation work.","detailFr":"Excess soil generated from excavation work. Sometimes it can be reused for embankment, but in many cases it must be properly disposed of as industrial waste (transported to a soil disposal site).","nameEn":"Đất thừa","summaryEn":"Đất thừa phát sinh từ công tác đào đất.","detailEn":"Đất thừa phát sinh từ công tác đào đất. Đôi khi có thể tái sử dụng để đắp nền, nhưng trong nhiều trường hợp phải xử lý đúng cách như chất thải công nghiệp (vận chuyển đến bãi chứa đất).","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Đất thừa","summary3":"Đất thừa từ việc đào đất","detail3":"Đất thừa phát sinh từ công việc đào đất. Có thể được sử dụng cho việc đắp đất trong một số trường hợp, nhưng phần lớn cần được xử lý thích hợp như chất thải công nghiệp (vận chuyển đến bãi xử lý đất thải).","caption3":"","images":[]},{"rowNum":31,"id":"030","catCode":"CAT03","nameJa":"盛土","readingJa":"もりど","summaryJa":"土を積み上げて地面を高くすること","detailJa":"道路・堤防・宅地造成などで、土砂を運搬・積み上げて地盤を高くする工事。転圧・締固めを繰り返して安定した地盤を作る。","nameFr":"Embankment","summaryFr":"Raising the ground level by transporting and piling up soil.","detailFr":"Construction that raises the ground level by transporting and piling up soil for roads, embankments, and land development. Stable ground is created by repeating rolling and compaction.","nameEn":"Đắp nền","summaryEn":"Nâng cao mặt đất bằng cách vận chuyển và đổ đất.","detailEn":"Xây dựng nâng cao mặt đất bằng cách vận chuyển và đổ đất cho đường, đê và phát triển đất. Nền đất ổn định được tạo ra bằng cách lặp lại việc lu lèn và đầm chặt.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Đất đắp","summary3":"Việc đắp đất để nâng cao mặt đất","detail3":"Công trình nâng cao mặt đất bằng cách vận chuyển và đắp đất đá cho các công trình đường bộ, đê điều, tạo lập khu dân cư. Tạo nền móng ổn định bằng cách lặp đi lặp lại việc đầm nén và đầm chặt.","caption3":"","images":[]},{"rowNum":32,"id":"031","catCode":"CAT03","nameJa":"切土","readingJa":"きりど","summaryJa":"地面・斜面を削ること","detailJa":"道路や宅地造成で、山や丘陵の斜面を機械で削り取って平坦にする工事。切取り面（法面）の安定処理が重要。","nameFr":"Cut","summaryFr":"Cutting into slopes or hillsides to create a flat surface.","detailFr":"Construction that uses machinery to cut into mountain or hillside slopes to create flat surfaces for roads and land development. Stabilization treatment of the cut face (slope) is important.","nameEn":"Đào cắt","summaryEn":"Cắt vào sườn dốc hoặc đồi để tạo mặt phẳng.","detailEn":"Xây dựng sử dụng máy móc để cắt vào sườn núi hoặc đồi để tạo mặt phẳng cho đường và phát triển đất. Xử lý ổn định mặt cắt (mái dốc) là quan trọng.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Đào đất","summary3":"Việc đào bới mặt đất và sườn dốc","detail3":"Công trình sử dụng máy móc để cắt gọt và san phẳng sườn núi hoặc đồi nhằm xây dựng đường bộ và khu dân cư. Việc xử lý ổn định mặt cắt (mặt taluy) là rất quan trọng.","caption3":"","images":[]},{"rowNum":33,"id":"032","catCode":"CAT03","nameJa":"転圧","readingJa":"てんあつ","summaryJa":"ローラーで土・砕石を締め固めること","detailJa":"振動ローラーやタイヤローラーで盛土・路盤材料を繰り返し転がして締め固める作業。十分な締固め度を確保することが品質の要。","nameFr":"Rolling Compaction","summaryFr":"Compacting soil or crushed stone by repeatedly rolling with a compactor.","detailFr":"The work of compacting embankment and road base materials by repeatedly rolling with a vibratory roller or tire roller. Ensuring sufficient compaction density is the key to quality.","nameEn":"Lu lèn","summaryEn":"Đầm chặt đất hoặc đá dăm bằng cách lăn đi lăn lại với máy lu.","detailEn":"Công việc đầm chặt vật liệu đắp nền và nền đường bằng cách lăn đi lăn lại với máy lu rung hoặc máy lu bánh lốp. Đảm bảo độ đầm chặt đủ là chìa khóa chất lượng.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Đầm nén","summary3":"Đầm nén đất và đá dăm bằng con lăn","detail3":"Công việc đầm nén lặp đi lặp lại vật liệu đắp đất và lớp nền đường bằng con lăn rung động và con lăn bánh lốp. Yêu cầu chất lượng là đảm bảo độ đầm nén đầy đủ.","caption3":"","images":[]},{"rowNum":34,"id":"033","catCode":"CAT03","nameJa":"締固め","readingJa":"しめかため","summaryJa":"土や砕石をよく叩いて密にすること","detailJa":"土・砕石・アスファルト等を機械で圧縮し、空隙を減らして強固な地盤・路盤を作ること。転圧と同義で使われることも多い。","nameFr":"Compaction","summaryFr":"Compressing soil and materials to reduce voids and create a solid base.","detailFr":"Compressing soil, crushed stone, asphalt, and other materials with machinery to reduce voids and create a strong foundation or road base. Often used synonymously with rolling compaction.","nameEn":"Đầm chặt","summaryEn":"Nén đất và vật liệu để giảm lỗ rỗng và tạo nền vững chắc.","detailEn":"Nén đất, đá dăm, nhựa đường và các vật liệu khác bằng máy móc để giảm lỗ rỗng và tạo nền hoặc móng đường vững chắc. Thường được dùng đồng nghĩa với lu lèn.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Đầm nén","summary3":"Đầm nén đất và đá dăm thật chặt để tăng độ đặc chắc","detail3":"Việc sử dụng máy móc để nén đất, đá dăm, nhựa đường, v.v., giảm khoảng trống để tạo ra nền đất và nền đường vững chắc. Thường được sử dụng đồng nghĩa với lu lèn.","caption3":"","images":[]},{"rowNum":35,"id":"034","catCode":"CAT03","nameJa":"路盤","readingJa":"ろばん","summaryJa":"舗装の下の砕石などの基盤層","detailJa":"アスファルト舗装やコンクリート舗装の直下にある砕石・砂利の層。交通荷重を分散させる重要な構造層。上層路盤・下層路盤に分けられる。","nameFr":"Road Base","summaryFr":"The layer of crushed stone or gravel directly below the pavement surface.","detailFr":"The layer of crushed stone or gravel directly beneath asphalt or concrete pavement. An important structural layer that distributes traffic loads. Divided into upper road base and lower road base.","nameEn":"Lớp móng đường","summaryEn":"Lớp đá dăm hoặc sỏi nằm ngay bên dưới mặt đường.","detailEn":"Lớp đá dăm hoặc sỏi nằm ngay dưới mặt đường nhựa hoặc bê tông. Lớp kết cấu quan trọng phân phối tải trọng giao thông. Chia thành lớp móng trên và lớp móng dưới.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Lớp nền đường","summary3":"Lớp nền đá dăm và các vật liệu khác dưới lớp mặt đường","detail3":"Lớp đá dăm và sỏi nằm ngay dưới lớp mặt đường asphalt hoặc bê tông. Đây là lớp kết cấu quan trọng có chức năng phân tán tải trọng giao thông. Được chia thành lớp nền đường trên và lớp nền đường dưới.","caption3":"","images":[]},{"rowNum":36,"id":"035","catCode":"CAT03","nameJa":"舗装","readingJa":"ほそう","summaryJa":"アスファルトやコンクリートで表面を覆うこと","detailJa":"アスファルト混合物やコンクリートで道路・駐車場・広場の表面を覆う工事。平坦性・耐久性・排水性が要求される。","nameFr":"Pavement","summaryFr":"Covering road or ground surfaces with asphalt or concrete.","detailFr":"Construction that covers road, parking lot, and plaza surfaces with asphalt mixture or concrete. Flatness, durability, and drainage are required qualities.","nameEn":"Mặt đường","summaryEn":"Phủ bề mặt đường hoặc mặt đất bằng nhựa đường hoặc bê tông.","detailEn":"Xây dựng phủ bề mặt đường, bãi đỗ xe và quảng trường bằng hỗn hợp nhựa đường hoặc bê tông. Độ phẳng, độ bền và khả năng thoát nước là các yêu cầu chất lượng.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Lát đường","summary3":"Che phủ bề mặt bằng nhựa đường hoặc bê tông","detail3":"Công trình phủ bề mặt đường bộ, bãi đậu xe, quảng trường bằng hỗn hợp asphalt hoặc bê tông. Yêu cầu tính phẳng, độ bền và khả năng thoát nước.","caption3":"","images":[]},{"rowNum":37,"id":"036","catCode":"CAT03","nameJa":"アスファルト","readingJa":"あすふぁると","summaryJa":"黒い舗装材料（加熱して敷く）","detailJa":"石油を精製して得られる黒色粘性物質に砂利・砂を混合した舗装材料。加熱（160℃前後）して施工し、冷却後に固まる。","nameFr":"Asphalt","summaryFr":"A black paving material made by mixing bitumen with aggregates, applied hot.","detailFr":"A paving material made by mixing a black viscous substance obtained from petroleum refining with gravel and sand. It is applied hot (around 160°C) and hardens after cooling.","nameEn":"Nhựa đường","summaryEn":"Vật liệu lát đường màu đen làm bằng cách trộn bitumen với cốt liệu, thi công nóng.","detailEn":"Vật liệu lát đường làm bằng cách trộn chất nhớt đen thu được từ việc lọc dầu mỏ với sỏi và cát. Thi công nóng (khoảng 160°C) và cứng lại sau khi nguội.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Nhựa đường","summary3":"Vật liệu lát đường màu đen (trải nóng)","detail3":"Vật liệu lát đường được tạo ra bằng cách trộn chất nhựa đen có tính nhớt thu được từ quá trình tinh chế dầu mỏ với sỏi và cát. Thi công bằng cách gia nhiệt (khoảng 160°C) và đông cứng sau khi làm lạnh.","caption3":"","images":[]},{"rowNum":38,"id":"037","catCode":"CAT03","nameJa":"コンクリート打設","readingJa":"こんくりーとだせつ","summaryJa":"型枠にコンクリートを流し込むこと","detailJa":"練り混ぜたコンクリート（生コン）を型枠内に流し込み、バイブレーターで締め固める作業。打設後の養生が品質を左右する。","nameFr":"Concrete Placement","summaryFr":"Pouring mixed concrete into formwork and compacting it with a vibrator.","detailFr":"The work of pouring mixed concrete (ready-mix) into formwork and compacting it with a vibrator. Curing after placement greatly affects quality.","nameEn":"Đổ bê tông","summaryEn":"Đổ bê tông đã trộn vào ván khuôn và đầm chặt bằng máy đầm dùi.","detailEn":"Công việc đổ bê tông trộn (bê tông tươi) vào ván khuôn và đầm chặt bằng máy đầm dùi. Bảo dưỡng sau khi đổ ảnh hưởng lớn đến chất lượng.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Đổ bê tông","summary3":"Đổ bê tông vào ván khuôn","detail3":"Công việc đổ beton tươi (bê tông tươi) đã được trộn vào trong опалубка và đầm chặt bằng máy đầm rung. Việc bảo dưỡng sau khi đổ sẽ quyết định chất lượng.","caption3":"","images":[]},{"rowNum":39,"id":"038","catCode":"CAT03","nameJa":"型枠","readingJa":"かたわく","summaryJa":"コンクリートを流す木・鉄製の枠","detailJa":"コンクリートを所定の形状に成形するための木製または鋼製の枠。打設後、コンクリートが固まったら脱型（取り外し）する。","nameFr":"Formwork","summaryFr":"Wooden or steel molds used to shape concrete into the desired form.","detailFr":"Wooden or steel molds used to form concrete into the specified shape. After placement, the formwork is removed (stripped) once the concrete has hardened.","nameEn":"Ván khuôn","summaryEn":"Khuôn gỗ hoặc thép dùng để tạo hình bê tông theo hình dạng mong muốn.","detailEn":"Khuôn gỗ hoặc thép dùng để tạo hình bê tông theo hình dạng quy định. Sau khi đổ, ván khuôn được tháo dỡ khi bê tông đã đóng rắn.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Ván khuôn","summary3":"Khung gỗ và thép để đổ bê tông","detail3":"Khung gỗ hoặc thép dùng để tạo hình bê tông theo hình dạng quy định. Sau khi đổ bê tông và bê tông đã đông cứng thì tiến hành tháo ván khuôn (tháo bỏ).","caption3":"","images":[]},{"rowNum":40,"id":"039","catCode":"CAT03","nameJa":"鉄筋","readingJa":"てっきん","summaryJa":"コンクリートの中に入れる鉄の棒","detailJa":"コンクリートの引張強度を補うために埋め込む鉄製の棒（異形棒鋼）。コンクリートと鉄筋の複合体を鉄筋コンクリート（RC）という。","nameFr":"Reinforcing Bar (Rebar)","summaryFr":"Steel bars embedded in concrete to improve its tensile strength.","detailFr":"Steel bars (deformed bars) embedded in concrete to supplement its tensile strength. The composite of concrete and steel bars is called reinforced concrete (RC).","nameEn":"Cốt thép","summaryEn":"Thanh thép chôn trong bê tông để cải thiện sức chịu kéo.","detailEn":"Thanh thép (thép gân) chôn trong bê tông để bổ sung sức chịu kéo. Tổ hợp bê tông và thanh thép được gọi là bê tông cốt thép (BTCT).","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Thép cốt thép","summary3":"Thanh sắt đặt trong bê tông","detail3":"Thanh thép (thép gân) được chôn vào để bù đắp cho cường độ kéo của bê tông. Vật liệu composite gồm bê tông và cốt thép được gọi là bê tông cốt thép (RC).","caption3":"","images":[]},{"rowNum":41,"id":"040","catCode":"CAT03","nameJa":"配筋","readingJa":"はいきん","summaryJa":"鉄筋を設計通りに配置・組み立てること","detailJa":"設計図に基づき鉄筋を切断・曲げ加工し、所定の間隔・位置に結束線で固定する作業。コンクリート打設前の重要工程。","nameFr":"Rebar Placement","summaryFr":"Cutting, bending, and fixing reinforcing bars in position according to design drawings.","detailFr":"Cutting, bending, and fixing reinforcing bars in position at specified intervals using binding wire, based on design drawings. An important process before concrete placement.","nameEn":"Bố trí cốt thép","summaryEn":"Cắt, uốn và cố định thanh thép vào vị trí theo bản vẽ thiết kế.","detailEn":"Cắt, uốn và cố định thanh thép vào vị trí theo khoảng cách quy định bằng dây buộc, dựa trên bản vẽ thiết kế. Công đoạn quan trọng trước khi đổ bê tông.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Cốt thép","summary3":"Bố trí và lắp ráp cốt thép theo đúng thiết kế","detail3":"Công việc cắt, uốn cốt thép theo bản thiết kế và cố định bằng dây buộc tại các khoảng cách và vị trí quy định. Đây là công đoạn quan trọng trước khi đổ bê tông.","caption3":"","images":[]},{"rowNum":42,"id":"041","catCode":"CAT03","nameJa":"養生","readingJa":"ようじょう","summaryJa":"コンクリートが固まるまで保護すること","detailJa":"打設直後のコンクリートを乾燥・急激な温度変化・衝撃から守り、十分に硬化させるための保護管理。シートで覆ったり散水したりする。","nameFr":"Curing","summaryFr":"Protecting freshly placed concrete to allow it to harden properly.","detailFr":"Protective management of freshly placed concrete to protect it from drying, sudden temperature changes, and impact, allowing it to harden sufficiently. Methods include covering with sheets and water sprinkling.","nameEn":"Bảo dưỡng bê tông","summaryEn":"Bảo vệ bê tông mới đổ để cho phép nó đóng rắn đúng cách.","detailEn":"Quản lý bảo vệ bê tông mới đổ để tránh khô, thay đổi nhiệt độ đột ngột và va đập, cho phép nó đóng rắn đầy đủ. Các phương pháp bao gồm phủ tấm và tưới nước.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Bảo dưỡng","summary3":"Bảo vệ cho đến khi bê tông đông cứng","detail3":"Quản lý bảo vệ nhằm bảo vệ bê tông ngay sau khi đổ khỏi sự khô hạn, biến đổi nhiệt độ đột ngột và va đập, đồng thời để bê tông đông cứng đầy đủ. Thực hiện bằng cách phủ tấm che hoặc phun nước.","caption3":"","images":[]},{"rowNum":43,"id":"042","catCode":"CAT03","nameJa":"排水工","readingJa":"はいすいこう","summaryJa":"水を流すための側溝・暗渠などの工事","detailJa":"雨水・地下水・湧水を適切に排除するための側溝・暗渠・排水管などの施設を設ける工事の総称。","nameFr":"Drainage Work","summaryFr":"Construction of drainage facilities such as ditches and culverts to remove water.","detailFr":"A general term for construction that installs facilities such as side ditches, culverts, and drainage pipes to properly remove rainwater, groundwater, and spring water.","nameEn":"Công tác thoát nước","summaryEn":"Xây dựng các công trình thoát nước như rãnh và cống để thoát nước.","detailEn":"Thuật ngữ chung cho việc xây dựng lắp đặt các công trình như rãnh thoát nước bên, cống ngầm và ống thoát nước để thoát nước mưa, nước ngầm và nước ngầm một cách thích hợp.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Công trình thoát nước","summary3":"Công trình xây dựng rãnh thoát nước, cống ngầm để dẫn nước","detail3":"Tổng gọi các công trình thiết lập các cơ sở hạ tầng như rãnh thoát nước bên, cống ngầm, ống thoát nước để loại bỏ một cách thích hợp nước mưa, nước ngầm và nước suối.","caption3":"","images":[]},{"rowNum":44,"id":"043","catCode":"CAT03","nameJa":"側溝","readingJa":"そっこう","summaryJa":"道路脇の水を流す溝（U字溝など）","detailJa":"道路の両端に設けるU字型や矩形の排水溝。路面の雨水を集めて排水する。コンクリート製プレキャスト製品が多く使われる。","nameFr":"Side Ditch","summaryFr":"A drainage channel along the side of a road to collect and drain rainwater.","detailFr":"A U-shaped or rectangular drainage channel installed along both sides of a road to collect and drain rainwater from the road surface. Precast concrete products are commonly used.","nameEn":"Rãnh thoát nước","summaryEn":"Kênh thoát nước dọc theo lề đường để thu gom và thoát nước mưa.","detailEn":"Kênh thoát nước hình chữ U hoặc hình chữ nhật lắp đặt dọc cả hai bên đường để thu gom và thoát nước mưa từ mặt đường. Sản phẩm bê tông đúc sẵn thường được sử dụng.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Rãnh thoát nước","summary3":"Rãnh thoát nước ven đường (rãnh chữ U, v.v.)","detail3":"Rãnh thoát nước hình chữ U hoặc hình chữ nhật được bố trí ở hai bên đường. Thu gom nước mưa trên mặt đường và tiến hành thoát nước. Chủ yếu sử dụng các sản phẩm đúc sẵn bằng bê tông.","caption3":"","images":[]},{"rowNum":45,"id":"044","catCode":"CAT03","nameJa":"暗渠","readingJa":"あんきょ","summaryJa":"地中に埋設された排水管・水路","detailJa":"地表に露出せず地中に埋設された排水管・水路のこと。農地の排水改良や市街地の雨水排水に広く使われる。","nameFr":"Culvert / Underground Drain","summaryFr":"A drainage pipe or channel buried underground, not visible at the surface.","detailFr":"A drainage pipe or channel buried underground, not exposed at the surface. Widely used for agricultural land drainage improvement and urban stormwater drainage.","nameEn":"Cống ngầm","summaryEn":"Ống hoặc kênh thoát nước chôn ngầm dưới đất, không thấy được ở bề mặt.","detailEn":"Ống hoặc kênh thoát nước chôn ngầm, không lộ ra ở bề mặt. Được sử dụng rộng rãi để cải thiện thoát nước đất nông nghiệp và thoát nước mưa đô thị.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Cống ngầm","summary3":"Đường ống thoát nước và kênh dẫn nước được chôn dưới lòng đất","detail3":"Đường ống thoát nước hoặc kênh thoát nước được chôn ngầm dưới lòng đất, không lộ ra mặt đất. Được sử dụng rộng rãi để cải thiện thoát nước cho đất nông nghiệp và thoát nước mưa ở khu vực đô thị.","caption3":"","images":[]},{"rowNum":46,"id":"045","catCode":"CAT03","nameJa":"管渠","readingJa":"かんきょ","summaryJa":"パイプによる排水施設","detailJa":"コンクリート管・塩化ビニル管・鋼管などのパイプを地中に埋設して排水する施設。側溝（開渠）に対して管（閉渠）と呼ばれることもある。","nameFr":"Pipe Drain","summaryFr":"A drainage facility using buried pipes such as concrete or PVC pipes.","detailFr":"A facility that drains water by burying pipes such as concrete pipes, PVC pipes, and steel pipes underground. Sometimes called a closed channel as opposed to a side ditch (open channel).","nameEn":"Cống thoát nước","summaryEn":"Công trình thoát nước sử dụng ống chôn ngầm như ống bê tông hoặc ống PVC.","detailEn":"Công trình thoát nước bằng cách chôn ống như ống bê tông, ống PVC và ống thép xuống đất. Đôi khi gọi là kênh kín trái với rãnh thoát nước (kênh hở).","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Cống ngầm","summary3":"Hệ thống thoát nước bằng đường ống","detail3":"Cơ sở thoát nước bằng cách chôn ngầm các loại ống như ống bê tông, ống nhựa PVC, ống thép dưới lòng đất. Đôi khi được gọi là cống kín (閉渠) so với rãnh thoát nước hở (開渠).","caption3":"","images":[]},{"rowNum":47,"id":"046","catCode":"CAT03","nameJa":"基礎工","readingJa":"きそこう","summaryJa":"構造物を支える地盤部分の工事","detailJa":"橋梁・建物・水路などの構造物を安全に支えるための地盤内の工事。直接基礎・杭基礎・ケーソン基礎などの種類がある。","nameFr":"Foundation Work","summaryFr":"Construction in the ground to safely support structures such as bridges and buildings.","detailFr":"Construction in the ground to safely support structures such as bridges, buildings, and water channels. Types include spread foundations, pile foundations, and caisson foundations.","nameEn":"Công tác móng","summaryEn":"Xây dựng trong lòng đất để đỡ an toàn các kết cấu như cầu và công trình.","detailEn":"Xây dựng trong lòng đất để đỡ an toàn các kết cấu như cầu, công trình và kênh nước. Các loại bao gồm móng trực tiếp, móng cọc và móng hộp.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Công trình nền móng","summary3":"Công trình phần nền đất đỡ kết cấu công trình","detail3":"Công trình trong nền đất để hỗ trợ an toàn các công trình kiến trúc như cầu, tòa nhà, kênh rạch. Có các loại như móng trực tiếp, móng cọc, móng caisson.","caption3":"","images":[]},{"rowNum":48,"id":"047","catCode":"CAT03","nameJa":"ブロック積み","readingJa":"ぶろっくづみ","summaryJa":"コンクリートブロックを積んで壁を作ること","detailJa":"コンクリートブロックをモルタルで積み重ねて擁壁・護岸・境界壁などを構築する工法。石積みの代替として広く用いられる。","nameFr":"Block Masonry","summaryFr":"Stacking concrete blocks with mortar to construct retaining walls or revetments.","detailFr":"A construction method of stacking concrete blocks with mortar to build retaining walls, revetments, and boundary walls. Widely used as an alternative to stone masonry.","nameEn":"Xây khối","summaryEn":"Xếp các khối bê tông với vữa để xây tường chắn đất hoặc kè.","detailEn":"Phương pháp xây dựng xếp các khối bê tông với vữa để xây tường chắn đất, kè và tường ranh giới. Được sử dụng rộng rãi như một lựa chọn thay thế cho xây đá.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Xây khối","summary3":"Xây tường bằng cách xếp các khối bê tông","detail3":"Công pháp xây dựng tường chắn, kè bảo vệ bờ, tường ranh giới bằng cách xếp chồng các khối bê tông bằng vữa. Được sử dụng rộng rãi như một giải pháp thay thế cho xây đá.","caption3":"","images":[]},{"rowNum":49,"id":"048","catCode":"CAT03","nameJa":"法面","readingJa":"のりめん","summaryJa":"盛土・切土の斜面部分","detailJa":"道路・堤防の盛土や切取りによって生じる傾斜面のこと。崩壊を防ぐため法面保護工（植生・コンクリート吹付け等）が施される。","nameFr":"Slope Face","summaryFr":"The inclined surface created by embankment or cutting work.","detailFr":"The inclined surface created by embankment or cutting work on roads and embankments. Slope protection work (vegetation, concrete spraying, etc.) is applied to prevent collapse.","nameEn":"Mái dốc","summaryEn":"Bề mặt nghiêng được tạo ra bởi công tác đắp nền hoặc đào cắt.","detailEn":"Bề mặt nghiêng được tạo ra bởi công tác đắp nền hoặc đào cắt trên đường và đê. Công tác bảo vệ mái dốc (trồng cây, phun bê tông, v.v.) được áp dụng để ngăn sụp đổ.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Mặt taluy","summary3":"Phần mặt dốc đắp đất và đào đất","detail3":"Mặt dốc được hình thành do việc đắp đất hoặc cắt đất khi xây dựng đường bộ và đê điều. Để ngăn chặn sạt lở, các công trình bảo vệ mái taluy (trồng cây xanh, phun bê tông, v.v.) được thực hiện.","caption3":"","images":[]},{"rowNum":50,"id":"049","catCode":"CAT03","nameJa":"法面保護","readingJa":"のりめんほご","summaryJa":"斜面の崩れを防ぐ工法（植生・コンクリート等）","detailJa":"雨水浸食・風化・崩壊から法面を守る工法の総称。植生工（種子吹付け・芝張り）・コンクリート系工法（吹付け・張りコンクリート）・ロック系工法などがある。","nameFr":"Slope Protection","summaryFr":"Methods to protect slopes from erosion, weathering, and collapse.","detailFr":"A general term for methods to protect slopes from rainwater erosion, weathering, and collapse. Includes vegetation methods (seed spraying, sod laying), concrete methods (shotcrete, concrete lining), and rock methods.","nameEn":"Bảo vệ mái dốc","summaryEn":"Các phương pháp bảo vệ mái dốc khỏi xói mòn, phong hóa và sụp đổ.","detailEn":"Thuật ngữ chung cho các phương pháp bảo vệ mái dốc khỏi xói mòn do nước mưa, phong hóa và sụp đổ. Bao gồm phương pháp thực vật (phun hạt giống, đặt cỏ), phương pháp bê tông (bê tông phun, lót bê tông) và phương pháp đá.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Bảo vệ mái taluy","summary3":"Công pháp chống sạt lở ta-luy (thảm thực vật, bê tông, v.v.)","detail3":"Tổng hợp các công pháp bảo vệ mặt dốc khỏi xói mòn do nước mưa, phong hóa và sụt lở. Bao gồm công pháp thảm thực vật (phun hạt giống, trải cỏ), công pháp bê tông (phun và đổ bê tông), công pháp đá và các phương pháp khác.","caption3":"","images":[]},{"rowNum":51,"id":"050","catCode":"CAT03","nameJa":"護岸","readingJa":"ごがん","summaryJa":"川岸・水路岸を守る構造物","detailJa":"河川・水路の岸を流水による侵食・崩壊から守るためのコンクリートブロック・捨石・矢板等による構造物。","nameFr":"Revetment","summaryFr":"A structure protecting riverbanks or channel banks from erosion by flowing water.","detailFr":"A structure using concrete blocks, rubble stones, and sheet piles to protect river and channel banks from erosion and collapse caused by flowing water.","nameEn":"Kè bảo vệ bờ","summaryEn":"Kết cấu bảo vệ bờ sông hoặc bờ kênh khỏi xói mòn do nước chảy.","detailEn":"Kết cấu sử dụng khối bê tông, đá thả và cừ thép để bảo vệ bờ sông và kênh khỏi xói mòn và sụp đổ do nước chảy.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Kè chống xói mòn","summary3":"Công trình bảo vệ bờ sông và bờ kênh","detail3":"Công trình bằng khối beton, đá gia cố, cừ larsen và các vật liệu khác nhằm bảo vệ bờ sông, bờ kênh khỏi bị xói mòn và sạt lở do dòng chảy.","caption3":"","images":[]},{"rowNum":52,"id":"051","catCode":"CAT04","nameJa":"品質管理","readingJa":"ひんしつかんり","summaryJa":"工事の出来栄えを基準通りに保つ管理","detailJa":"工事の材料・施工・完成品が設計基準・仕様書の品質を満たしているかを確認・管理する活動。試験・検査・写真記録が主な手段。","nameFr":"Quality Control","summaryFr":"Managing and verifying that construction materials and work meet specified quality standards.","detailFr":"Activities to verify and manage that construction materials, workmanship, and finished products meet the quality standards of design specifications. Testing, inspection, and photographic records are the main means.","nameEn":"Kiểm soát chất lượng","summaryEn":"Quản lý và xác minh vật liệu và công việc xây dựng đáp ứng các tiêu chuẩn chất lượng quy định.","detailEn":"Các hoạt động xác minh và quản lý rằng vật liệu xây dựng, tay nghề và thành phẩm đáp ứng các tiêu chuẩn chất lượng của thông số kỹ thuật thiết kế. Thử nghiệm, kiểm tra và ghi lại ảnh là phương tiện chính.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Quản lý chất lượng","summary3":"Quản lý để duy trì chất lượng thi công theo đúng tiêu chuẩn","detail3":"Hoạt động xác nhận và quản lý xem vật liệu xây dựng, thi công và sản phẩm hoàn thành có đáp ứng chất lượng của tiêu chuẩn thiết kế và sách đặc tả kỹ thuật hay không. Các phương tiện chính là thử nghiệm, kiểm tra và ghi chép bằng hình ảnh.","caption3":"","images":[]},{"rowNum":53,"id":"052","catCode":"CAT04","nameJa":"工程管理","readingJa":"こうていかんり","summaryJa":"スケジュール通りに工事を進める管理","detailJa":"工程表に基づき工事の進捗を把握し、遅延が生じた場合は対策を講じて工期内完成を目指す管理活動。","nameFr":"Schedule Management","summaryFr":"Managing construction progress to ensure completion within the scheduled timeframe.","detailFr":"A management activity that tracks construction progress based on the schedule and takes countermeasures when delays occur, aiming for completion within the construction period.","nameEn":"Quản lý tiến độ","summaryEn":"Quản lý tiến độ xây dựng để đảm bảo hoàn thành trong khung thời gian đã lên kế hoạch.","detailEn":"Hoạt động quản lý theo dõi tiến độ xây dựng dựa trên lịch trình và thực hiện các biện pháp đối phó khi xảy ra chậm trễ, nhằm mục tiêu hoàn thành trong thời hạn xây dựng.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Quản lý quy trình","summary3":"Quản lý tiến độ thi công theo đúng kế hoạch","detail3":"Hoạt động quản lý nhằm nắm bắt tiến độ thi công dựa trên biểu đồ tiến độ, và khi xảy ra chậm trễ thì thực hiện các biện pháp đối phó để hướng tới việc hoàn thành trong thời hạn công trình.","caption3":"","images":[]},{"rowNum":54,"id":"053","catCode":"CAT04","nameJa":"安全管理","readingJa":"あんぜんかんり","summaryJa":"事故・災害を防ぐための管理","detailJa":"工事現場での労働災害・公衆災害を防止するための日常的な管理活動。点検・KY活動・教育・整理整頓・保護具管理などを含む。","nameFr":"Safety Management","summaryFr":"Daily management activities to prevent occupational and public accidents at construction sites.","detailFr":"Daily management activities to prevent occupational accidents and public accidents at construction sites. Includes inspections, KY activities, training, housekeeping, and protective equipment management.","nameEn":"Quản lý an toàn","summaryEn":"Các hoạt động quản lý hàng ngày để ngăn ngừa tai nạn lao động và tai nạn công cộng tại công trường.","detailEn":"Các hoạt động quản lý hàng ngày để ngăn ngừa tai nạn lao động và tai nạn công cộng tại công trường xây dựng. Bao gồm kiểm tra, hoạt động KY, đào tạo, sắp xếp ngăn nắp và quản lý thiết bị bảo hộ.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Quản lý an toàn","summary3":"Quản lý để phòng ngừa tai nạn và thiên tai","detail3":"Hoạt động quản lý hàng ngày nhằm phòng ngừa tai nạn lao động và tai nạn công cộng tại công trường xây dựng. Bao gồm kiểm tra, hoạt động KY (dự đoán nguy hiểm), giáo dục, sắp xếp ngăn nắp, quản lý trang bị bảo hộ.","caption3":"","images":[]},{"rowNum":55,"id":"054","catCode":"CAT04","nameJa":"出来形管理","readingJa":"できがたかんり","summaryJa":"完成した構造物の寸法・形状の確認","detailJa":"施工が完了した構造物・工作物の寸法・高さ・勾配などを計測し、設計値との差異が規定の許容誤差内に収まっているか確認する管理。","nameFr":"As-Built Management","summaryFr":"Measuring completed structures to confirm dimensions are within allowable tolerances.","detailFr":"Measuring the dimensions, height, and gradient of completed structures and works to confirm that deviations from design values are within specified allowable tolerances.","nameEn":"Quản lý kích thước hoàn công","summaryEn":"Đo kết cấu hoàn thiện để xác nhận kích thước nằm trong sai số cho phép.","detailEn":"Đo kích thước, chiều cao và độ dốc của kết cấu và công trình hoàn thiện để xác nhận rằng độ lệch so với giá trị thiết kế nằm trong sai số cho phép quy định.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Quản lý chất lượng công trình hoàn thành","summary3":"Xác nhận kích thước và hình dạng của công trình hoàn thành","detail3":"Quản lý kiểm tra các kích thước, độ cao, độ dốc của các công trình kiến trúc và công trình xây dựng đã hoàn thành thi công, xác nhận xem sự chênh lệch so với giá trị thiết kế có nằm trong phạm vi sai số cho phép quy định hay không.","caption3":"","images":[]},{"rowNum":56,"id":"055","catCode":"CAT04","nameJa":"検査","readingJa":"けんさ","summaryJa":"工事の品質・出来形を確認すること","detailJa":"発注者側の監督員が工事の品質・出来形・写真記録などを確認し、合否を判定する公式チェック。中間検査・完成検査がある。","nameFr":"Inspection","summaryFr":"An official check by the client's supervisor to confirm construction quality and dimensions.","detailFr":"An official check by the client's supervisor to confirm construction quality, as-built dimensions, and photographic records, and to judge pass or fail. Includes intermediate inspections and final completion inspections.","nameEn":"Kiểm tra","summaryEn":"Kiểm tra chính thức của giám sát viên chủ đầu tư để xác nhận chất lượng và kích thước xây dựng.","detailEn":"Kiểm tra chính thức của giám sát viên chủ đầu tư để xác nhận chất lượng xây dựng, kích thước hoàn công và hồ sơ ảnh, và đánh giá đạt hay không đạt. Bao gồm kiểm tra giữa chừng và kiểm tra nghiệm thu cuối cùng.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Kiểm tra","summary3":"Xác nhận chất lượng và hình dạng hoàn thành của công trình","detail3":"Kiểm tra chính thức do giám sát viên phía bên đặt hàng thực hiện để xác nhận chất lượng công trình, hình dáng hoàn thành, hồ sơ ảnh chụp và đưa ra phán định đạt hay không đạt. Có kiểm tra trung gian và kiểm tra hoàn thành.","caption3":"","images":[]},{"rowNum":57,"id":"056","catCode":"CAT04","nameJa":"試験","readingJa":"しけん","summaryJa":"材料や施工の品質を数値で確認すること","detailJa":"コンクリートのスランプ・強度試験、土の締固め度試験など、材料や施工の品質を数値データで確認する作業。試験結果は管理帳票に記録する。","nameFr":"Testing","summaryFr":"Confirming the quality of materials and construction with numerical data.","detailFr":"Work to confirm the quality of materials and construction with numerical data, such as concrete slump and strength tests, and soil compaction tests. Test results are recorded in management forms.","nameEn":"Thử nghiệm","summaryEn":"Xác nhận chất lượng vật liệu và xây dựng bằng dữ liệu số.","detailEn":"Công việc xác nhận chất lượng vật liệu và xây dựng bằng dữ liệu số, như thử nghiệm độ sụt và cường độ bê tông, và thử nghiệm độ đầm chặt của đất. Kết quả thử nghiệm được ghi vào mẫu quản lý.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Kỳ thi","summary3":"Xác nhận chất lượng vật liệu và thi công bằng các giá trị số","detail3":"Công việc xác nhận chất lượng vật liệu và thi công bằng dữ liệu số thông qua các thí nghiệm như thí nghiệm độ sụt và cường độ bê tông, thí nghiệm độ đầm nén đất. Kết quả thí nghiệm được ghi lại trong biểu mẫu quản lý.","caption3":"","images":[]},{"rowNum":58,"id":"057","catCode":"CAT04","nameJa":"密度試験","readingJa":"みつどしけん","summaryJa":"締固めた土の密度を確認する試験","detailJa":"盛土・路盤の締固め後、土の密度（乾燥密度）を現地で測定し、締固め度が基準値（90〜95%以上）を満たしているか確認する試験。","nameFr":"Density Test","summaryFr":"A field test to confirm that compacted soil meets the required density standard.","detailFr":"A test conducted after compacting embankment or road base to measure the dry density of soil in the field, confirming that the compaction ratio meets the standard value (90–95% or more).","nameEn":"Thử nghiệm mật độ","summaryEn":"Thử nghiệm hiện trường để xác nhận đất đầm chặt đạt tiêu chuẩn mật độ yêu cầu.","detailEn":"Thử nghiệm được thực hiện sau khi đầm chặt nền đắp hoặc nền đường để đo mật độ khô của đất tại hiện trường, xác nhận tỷ lệ đầm chặt đạt giá trị tiêu chuẩn (90–95% hoặc hơn).","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Thí nghiệm mật độ","summary3":"Thí nghiệm xác định mật độ của đất đã được đầm nén","detail3":"Thí nghiệm đo mật độ đất (mật độ khô) tại hiện trường sau khi đầm nén đất đắp và nền đường, để xác nhận xem độ đầm nén có đạt giá trị tiêu chuẩn (90~95% trở lên) hay không.","caption3":"","images":[]},{"rowNum":59,"id":"058","catCode":"CAT04","nameJa":"スランプ試験","readingJa":"すらんぷしけん","summaryJa":"コンクリートの軟らかさを確認する試験","detailJa":"生コンクリートをスランプコーンに詰め、抜いた後の沈下量（スランプ値）を測定する試験。コンクリートのワーカビリティ（施工性）を確認する。","nameFr":"Slump Test","summaryFr":"A test measuring the consistency of fresh concrete using a slump cone.","detailFr":"A test where fresh concrete is packed into a slump cone and the amount of subsidence (slump value) after the cone is removed is measured. Used to confirm the workability of concrete.","nameEn":"Thử nghiệm độ sụt","summaryEn":"Thử nghiệm đo độ đồng nhất của bê tông tươi bằng côn độ sụt.","detailEn":"Thử nghiệm bê tông tươi được nhồi vào côn độ sụt và đo lượng lún xuống (giá trị độ sụt) sau khi tháo côn. Dùng để xác nhận tính công tác của bê tông.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Thử nghiệm độ sụt (Slump test)","summary3":"Thử nghiệm kiểm tra độ dẻo của bê tông","detail3":"Thí nghiệm nhồi bê tông tươi vào côn đổ sụt, sau đó đo lượng sụt lún (giá trị độ sụt) khi rút côn ra. Xác nhận tính thi công (workability) của bê tông.","caption3":"","images":[]},{"rowNum":60,"id":"059","catCode":"CAT04","nameJa":"写真管理","readingJa":"しゃしんかんり","summaryJa":"施工状況を写真で記録・整理すること","detailJa":"工事の各段階を写真で記録し、工事完成後も施工状況を確認できるよう整理・保管する管理活動。埋設物・鉄筋など完成後に見えなくなる部分の記録に特に重要。","nameFr":"Photo Documentation","summaryFr":"Recording and organizing construction progress with photographs.","detailFr":"A management activity of photographically recording each stage of construction and organizing and storing the photos so construction conditions can be confirmed even after completion. Particularly important for recording buried items and reinforcement that cannot be seen after completion.","nameEn":"Quản lý ảnh","summaryEn":"Ghi lại và sắp xếp tiến độ xây dựng bằng ảnh chụp.","detailEn":"Hoạt động quản lý ghi lại từng giai đoạn xây dựng bằng ảnh và sắp xếp, lưu trữ ảnh để có thể xác nhận điều kiện thi công ngay cả sau khi hoàn thành. Đặc biệt quan trọng để ghi lại các vật chôn ngầm và cốt thép không thể nhìn thấy sau khi hoàn thành.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Quản lý ảnh","summary3":"Ghi lại và sắp xếp tình hình thi công bằng hình ảnh","detail3":"Hoạt động quản lý ghi lại bằng hình ảnh từng giai đoạn thi công và sắp xếp, bảo quản để có thể xác nhận tình trạng thi công ngay cả sau khi hoàn thành công trình. Đặc biệt quan trọng đối với việc ghi lại các bộ phận sẽ không nhìn thấy được sau khi hoàn thành như vật chôn ngầm, cốt thép.","caption3":"","images":[]},{"rowNum":61,"id":"060","catCode":"CAT04","nameJa":"施工記録","readingJa":"せこうきろく","summaryJa":"工事の内容を記録した書類","detailJa":"工事の施工日・作業内容・使用材料・試験結果・写真などを体系的に記録した書類。完成検査や後の維持管理に使用する。","nameFr":"Construction Records","summaryFr":"Documents systematically recording construction dates, work content, materials, and test results.","detailFr":"Documents systematically recording construction dates, work content, materials used, test results, and photographs. Used for final inspection and subsequent maintenance management.","nameEn":"Hồ sơ thi công","summaryEn":"Tài liệu ghi lại một cách có hệ thống ngày thi công, nội dung công việc, vật liệu và kết quả thử nghiệm.","detailEn":"Tài liệu ghi lại một cách có hệ thống ngày thi công, nội dung công việc, vật liệu sử dụng, kết quả thử nghiệm và ảnh chụp. Được sử dụng cho kiểm tra nghiệm thu cuối và quản lý bảo trì sau này.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Hồ sơ thi công","summary3":"Tài liệu ghi chép nội dung công trình","detail3":"Tài liệu ghi chép có hệ thống về ngày thi công, nội dung công việc, vật liệu sử dụng, kết quả thử nghiệm, hình ảnh, v.v. của công trình. Được sử dụng cho kiểm tra nghiệm thu hoàn thành và quản lý bảo trì sau này.","caption3":"","images":[]},{"rowNum":62,"id":"061","catCode":"CAT04","nameJa":"日報","readingJa":"にっぽう","summaryJa":"毎日の作業内容の報告書","detailJa":"その日の作業内容・作業員数・使用重機・天候・進捗状況などを記録する日次報告書。工程管理と労務管理の基礎資料となる。","nameFr":"Daily Report","summaryFr":"A daily report recording work content, worker count, equipment used, weather, and progress.","detailFr":"A daily report recording the day's work content, number of workers, equipment used, weather, and progress status. Serves as basic data for schedule management and labor management.","nameEn":"Báo cáo hàng ngày","summaryEn":"Báo cáo hàng ngày ghi lại nội dung công việc, số lượng công nhân, thiết bị sử dụng, thời tiết và tiến độ.","detailEn":"Báo cáo hàng ngày ghi lại nội dung công việc trong ngày, số lượng công nhân, thiết bị sử dụng, thời tiết và tình trạng tiến độ. Đóng vai trò dữ liệu cơ bản cho quản lý tiến độ và quản lý lao động.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Báo cáo ngày","summary3":"Báo cáo nội dung công việc hàng ngày","detail3":"Báo cáo hàng ngày ghi chép nội dung công việc, số lượng công nhân, máy móc thiết bị sử dụng, thời tiết, tình hình tiến độ của ngà
