nhận điều kiện thi công ngay cả sau khi hoàn thành. Đặc biệt quan trọng để ghi lại các vật chôn ngầm và cốt thép không thể nhìn thấy sau khi hoàn thành.","caption3":"","name4":"Manajemen Foto","summary4":"Merekam dan mengorganisir situasi pelaksanaan konstruksi dengan foto","detail4":"Kegiatan manajemen untuk merekam setiap tahap konstruksi dengan foto, mengatur dan menyimpan dokumentasi agar kondisi pelaksanaan dapat dikonfirmasi bahkan setelah konstruksi selesai. Sangat penting terutama untuk pencatatan bagian-bagian yang tidak terlihat setelah selesai seperti benda tertanam dan tulangan besi.","caption4":"","images":[]},{"rowNum":61,"id":"060","catCode":"CAT04","nameJa":"施工記録","readingJa":"せこうきろく","summaryJa":"工事の内容を記録した書類","detailJa":"工事の施工日・作業内容・使用材料・試験結果・写真などを体系的に記録した書類。完成検査や後の維持管理に使用する。","nameEn":"Construction Records","summaryEn":"Documents systematically recording construction dates, work content, materials, and test results.","detailEn":"Documents systematically recording construction dates, work content, materials used, test results, and photographs. Used for final inspection and subsequent maintenance management.","image":"","captionJa":"","captionEn":"","published":"","name3":"Hồ sơ thi công","summary3":"Tài liệu ghi lại một cách có hệ thống ngày thi công, nội dung công việc, vật liệu và kết quả thử nghiệm.","detail3":"Tài liệu ghi lại một cách có hệ thống ngày thi công, nội dung công việc, vật liệu sử dụng, kết quả thử nghiệm và ảnh chụp. Được sử dụng cho kiểm tra nghiệm thu cuối và quản lý bảo trì sau này.","caption3":"","name4":"Catatan Pelaksanaan","summary4":"Dokumen yang mencatat isi pekerjaan konstruksi","detail4":"Dokumen yang mencatat secara sistematis tanggal pelaksanaan konstruksi, isi pekerjaan, material yang digunakan, hasil pengujian, foto, dan lain-lain. Digunakan untuk inspeksi penyelesaian dan pemeliharaan selanjutnya.","caption4":"","images":[]},{"rowNum":62,"id":"061","catCode":"CAT04","nameJa":"日報","readingJa":"にっぽう","summaryJa":"毎日の作業内容の報告書","detailJa":"その日の作業内容・作業員数・使用重機・天候・進捗状況などを記録する日次報告書。工程管理と労務管理の基礎資料となる。","nameEn":"Daily Report","summaryEn":"A daily report recording work content, worker count, equipment used, weather, and progress.","detailEn":"A daily report recording the day's work content, number of workers, equipment used, weather, and progress status. Serves as basic data for schedule management and labor management.","image":"","captionJa":"","captionEn":"","published":"","name3":"Báo cáo hàng ngày","summary3":"Báo cáo hàng ngày ghi lại nội dung công việc, số lượng công nhân, thiết bị sử dụng, thời tiết và tiến độ.","detail3":"Báo cáo hàng ngày ghi lại nội dung công việc trong ngày, số lượng công nhân, thiết bị sử dụng, thời tiết và tình trạng tiến độ. Đóng vai trò dữ liệu cơ bản cho quản lý tiến độ và quản lý lao động.","caption3":"","name4":"Laporan Harian","summary4":"Laporan konten pekerjaan harian","detail4":"Laporan harian yang mencatat isi pekerjaan hari tersebut, jumlah pekerja, alat berat yang digunakan, cuaca, status kemajuan, dan lain-lain. Menjadi data dasar untuk manajemen jadwal dan manajemen tenaga kerja.","caption4":"","images":[]},{"rowNum":63,"id":"062","catCode":"CAT04","nameJa":"設計図書","readingJa":"せっけいとしょ","summaryJa":"工事の設計図・仕様書のセット","detailJa":"工事内容を定めた設計図・仕様書・特記仕様書・数量計算書などをまとめたもの。工事はこの図書に従って行われる。","nameEn":"Design Documents","summaryEn":"A set of design drawings and specifications defining the construction content.","detailEn":"A collection of design drawings, specifications, special specifications, and quantity calculation sheets defining the construction content. Construction is carried out in accordance with these documents.","image":"","captionJa":"","captionEn":"","published":"","name3":"Hồ sơ thiết kế","summary3":"Bộ bản vẽ thiết kế và thông số kỹ thuật xác định nội dung xây dựng.","detail3":"Tập hợp bản vẽ thiết kế, thông số kỹ thuật, thông số kỹ thuật đặc biệt và tờ tính toán khối lượng xác định nội dung xây dựng. Công trình được thực hiện theo các tài liệu này.","caption3":"","name4":"Dokumen desain","summary4":"Set gambar desain dan spesifikasi konstruksi","detail4":"Kumpulan gambar desain, spesifikasi, spesifikasi khusus, dan daftar perhitungan kuantitas yang menetapkan isi pekerjaan konstruksi. Pekerjaan konstruksi dilaksanakan sesuai dengan dokumen ini.","caption4":"","images":[]},{"rowNum":64,"id":"063","catCode":"CAT04","nameJa":"仕様書","readingJa":"しようしょ","summaryJa":"工事のやり方・材料を指定した文書","detailJa":"工事に使用する材料の品質・規格、施工方法・精度などを規定した文書。標準仕様書と特記仕様書がある。","nameEn":"Specifications","summaryEn":"A document specifying the quality of materials, construction methods, and required precision.","detailEn":"A document stipulating the quality and standards of materials used in construction, as well as construction methods and required precision. Includes standard specifications and special specifications.","image":"","captionJa":"","captionEn":"","published":"","name3":"Thông số kỹ thuật","summary3":"Tài liệu quy định chất lượng vật liệu, phương pháp thi công và độ chính xác yêu cầu.","detail3":"Tài liệu quy định chất lượng và tiêu chuẩn của vật liệu sử dụng trong xây dựng, cũng như phương pháp thi công và độ chính xác yêu cầu. Bao gồm thông số kỹ thuật tiêu chuẩn và thông số kỹ thuật đặc biệt.","caption3":"","name4":"Spesifikasi","summary4":"Dokumen yang menetapkan metode pelaksanaan pekerjaan dan material","detail4":"Dokumen yang mengatur kualitas dan standar material yang digunakan dalam konstruksi, metode pelaksanaan, tingkat presisi, dan lain-lain. Terdapat spesifikasi standar dan spesifikasi khusus.","caption4":"","images":[]},{"rowNum":65,"id":"064","catCode":"CAT04","nameJa":"変更指示","readingJa":"へんこうしじ","summaryJa":"設計・施工内容の変更を伝える指示","detailJa":"工事中に設計の変更が必要になった場合、発注者から受注者（施工業者）に対して正式に変更内容を指示する文書または口頭指示。","nameEn":"Change Order","summaryEn":"A formal instruction from the client to the contractor to modify design or construction content.","detailEn":"When design changes become necessary during construction, a formal written or verbal instruction from the client to the contractor specifying the change content.","image":"","captionJa":"","captionEn":"","published":"","name3":"Lệnh thay đổi","summary3":"Chỉ thị chính thức từ chủ đầu tư đến nhà thầu để sửa đổi nội dung thiết kế hoặc xây dựng.","detail3":"Khi cần thay đổi thiết kế trong quá trình xây dựng, chỉ thị bằng văn bản hoặc lời nói chính thức từ chủ đầu tư đến nhà thầu nêu rõ nội dung thay đổi.","caption3":"","name4":"Instruksi untuk perubahan","summary4":"Instruksi untuk menyampaikan perubahan isi desain dan konstruksi","detail4":"Dokumen atau instruksi lisan yang secara resmi mengarahkan perubahan isi dari pemesan kepada penerima pesanan (kontraktor pelaksana) ketika perubahan desain diperlukan selama pelaksanaan konstruksi.","caption4":"","images":[]},{"rowNum":66,"id":"065","catCode":"CAT04","nameJa":"手直し","readingJa":"てなおし","summaryJa":"不具合のある部分を修正すること","detailJa":"検査・確認で不合格・不具合と判定された箇所を補修・やり直しすること。発注者指示に従い速やかに対応する必要がある。","nameEn":"Rework","summaryEn":"Repairing or redoing parts found to be defective or non-conforming during inspection.","detailEn":"Repairing or redoing parts found to be non-conforming or defective during inspection and confirmation. It is necessary to respond promptly in accordance with client instructions.","image":"","captionJa":"","captionEn":"","published":"","name3":"Sửa lại","summary3":"Sửa chữa hoặc làm lại các phần được phát hiện là lỗi hoặc không phù hợp trong quá trình kiểm tra.","detail3":"Sửa chữa hoặc làm lại các phần được phát hiện là không phù hợp hoặc có lỗi trong quá trình kiểm tra và xác nhận. Cần phải phản hồi kịp thời theo hướng dẫn của chủ đầu tư.","caption3":"","name4":"perbaikan","summary4":"Memperbaiki bagian yang mengalami kerusakan","detail4":"Memperbaiki dan mengerjakan ulang bagian yang dinyatakan tidak lulus atau cacat pada pemeriksaan dan konfirmasi. Perlu merespons dengan cepat sesuai instruksi dari pemesan.","caption4":"","images":[]},{"rowNum":67,"id":"066","catCode":"CAT05","nameJa":"発注者","readingJa":"はっちゅうしゃ","summaryJa":"工事を依頼する側（官公庁・自治体など）","detailJa":"工事の発注・費用負担・検査を行う側。国・都道府県・市町村などの公共機関が多い。工事の目的・基準を決定する最重要関係者。","nameEn":"Client / Owner","summaryEn":"The party commissioning and funding the construction, such as government agencies.","detailEn":"The party responsible for ordering, funding, and inspecting construction. Often public institutions such as the national government, prefectures, and municipalities. The most important stakeholder who determines the purpose and standards of construction.","image":"","captionJa":"","captionEn":"","published":"","name3":"Chủ đầu tư","summary3":"Bên đặt hàng và tài trợ cho công trình, thường là các cơ quan chính phủ.","detail3":"Bên chịu trách nhiệm đặt hàng, tài trợ và kiểm tra xây dựng. Thường là các tổ chức công như chính phủ quốc gia, tỉnh và đô thị. Bên liên quan quan trọng nhất quyết định mục đích và tiêu chuẩn xây dựng.","caption3":"","name4":"Pemesan","summary4":"Pihak yang meminta pekerjaan konstruksi (instansi pemerintah, pemerintah daerah, dll.)","detail4":"Pihak yang melakukan pemesanan konstruksi, menanggung biaya, dan melaksanakan inspeksi. Sebagian besar adalah lembaga publik seperti negara, prefektur, dan kotamadya. Merupakan pihak berkepentingan terpenting yang menentukan tujuan dan standar konstruksi.","caption4":"","images":[]},{"rowNum":68,"id":"067","catCode":"CAT05","nameJa":"監督員","readingJa":"かんとくいん","summaryJa":"発注者側の工事確認担当者","detailJa":"発注者（官公庁等）が現場に派遣する工事監督の担当者。施工者の施工状況を確認し、指示・承諾・検査を行う権限を持つ。","nameEn":"Site Supervisor","summaryEn":"A representative of the client assigned to oversee and confirm construction at the site.","detailEn":"A construction supervision representative dispatched to the site by the client (government agency, etc.). Has the authority to confirm construction conditions, give instructions, grant approvals, and conduct inspections.","image":"","captionJa":"","captionEn":"","published":"","name3":"Giám sát công trình","summary3":"Đại diện của chủ đầu tư được cử đến giám sát và xác nhận công trình tại công trường.","detail3":"Đại diện giám sát xây dựng được chủ đầu tư (cơ quan chính phủ, v.v.) cử đến công trường. Có thẩm quyền xác nhận điều kiện thi công, đưa ra chỉ thị, cấp chấp thuận và tiến hành kiểm tra.","caption3":"","name4":"Pengawas","summary4":"Penanggung jawab konfirmasi pekerjaan dari pihak pemesan","detail4":"Petugas pengawas konstruksi yang dikirim ke lapangan oleh pemesan (instansi pemerintah, dll). Memiliki wewenang untuk memverifikasi situasi pelaksanaan oleh kontraktor serta melakukan instruksi, persetujuan, dan inspeksi.","caption4":"","images":[]},{"rowNum":69,"id":"068","catCode":"CAT05","nameJa":"協議","readingJa":"きょうぎ","summaryJa":"発注者・関係機関と話し合うこと","detailJa":"施工上の問題・設計変更・工程調整などについて、発注者・監督員・関係機関と正式に話し合い、解決策を協議すること。議事録を残すことが重要。","nameEn":"Conference / Consultation","summaryEn":"A formal discussion with the client or related agencies to resolve construction issues.","detailEn":"A formal discussion with the client, site supervisor, and related agencies about construction problems, design changes, and schedule adjustments to discuss solutions. It is important to keep meeting minutes.","image":"","captionJa":"","captionEn":"","published":"","name3":"Họp thương thảo","summary3":"Thảo luận chính thức với chủ đầu tư hoặc các cơ quan liên quan để giải quyết các vấn đề xây dựng.","detail3":"Thảo luận chính thức với chủ đầu tư, giám sát công trường và các cơ quan liên quan về các vấn đề xây dựng, thay đổi thiết kế và điều chỉnh tiến độ để thảo luận giải pháp. Quan trọng là phải giữ biên bản cuộc họp.","caption3":"","name4":"Konsultasi","summary4":"Berdiskusi dengan pemesan/klien dan lembaga terkait","detail4":"Melakukan pembahasan resmi dengan pemesan, pengawas, dan instansi terkait mengenai masalah pelaksanaan konstruksi, perubahan desain, penyesuaian jadwal kerja, dan lain-lain, serta berunding mencari solusi penyelesaian. Penting untuk menyimpan notulen rapat.","caption4":"","images":[]},{"rowNum":70,"id":"069","catCode":"CAT05","nameJa":"承諾","readingJa":"しょうだく","summaryJa":"発注者が提案・計画を認めること","detailJa":"施工者が提出した施工計画・変更案・材料を発注者・監督員が審査し、正式に認めること。承諾なしに施工を進めてはならない事項が多い。","nameEn":"Approval","summaryEn":"The client's formal acceptance of a submitted plan, change, or material.","detailEn":"The formal acceptance by the client or site supervisor after reviewing a construction plan, change proposal, or material submitted by the contractor. There are many items for which construction must not proceed without approval.","image":"","captionJa":"","captionEn":"","published":"","name3":"Phê duyệt","summary3":"Chấp thuận chính thức của chủ đầu tư đối với kế hoạch, thay đổi hoặc vật liệu đã nộp.","detail3":"Chấp thuận chính thức của chủ đầu tư hoặc giám sát công trường sau khi xem xét kế hoạch thi công, đề xuất thay đổi hoặc vật liệu do nhà thầu nộp. Có nhiều hạng mục không được thi công nếu không có phê duyệt.","caption3":"","name4":"Persetujuan","summary4":"Pemesan menyetujui proposal dan rencana","detail4":"Kontraktor yang mengajukan rencana konstruksi, proposal perubahan, dan material akan diperiksa oleh pemesan dan pengawas, kemudian secara resmi disetujui. Terdapat banyak hal yang tidak boleh dilanjutkan pelaksanaan konstruksinya tanpa persetujuan.","caption4":"","images":[]},{"rowNum":71,"id":"070","catCode":"CAT05","nameJa":"近隣対応","readingJa":"きんりんたいおう","summaryJa":"工事現場近くの住民への説明・配慮","detailJa":"工事に伴う騒音・振動・通行規制・粉塵等で影響を受ける近隣住民に対し、事前説明・苦情対応・工法配慮などを行うこと。","nameEn":"Neighborhood Relations","summaryEn":"Explaining construction impacts to nearby residents and addressing their concerns.","detailEn":"Providing prior explanations, responding to complaints, and considering construction methods for nearby residents who are affected by construction-related noise, vibration, traffic restrictions, and dust.","image":"","captionJa":"","captionEn":"","published":"","name3":"Quan hệ với cư dân lân cận","summary3":"Giải thích tác động xây dựng cho cư dân gần đó và giải quyết các mối lo ngại của họ.","detail3":"Cung cấp giải thích trước, phản hồi khiếu nại và xem xét phương pháp xây dựng cho cư dân gần đó bị ảnh hưởng bởi tiếng ồn, rung động, hạn chế giao thông và bụi liên quan đến xây dựng.","caption3":"","name4":"Penanganan Tetangga","summary4":"Penjelasan dan pertimbangan kepada warga yang tinggal di sekitar lokasi konstruksi","detail4":"Melakukan penjelasan terlebih dahulu, penanganan keluhan, dan pertimbangan metode konstruksi kepada warga sekitar yang terkena dampak kebisingan, getaran, pembatasan lalu lintas, debu, dan lain-lain yang menyertai pekerjaan konstruksi.","caption4":"","images":[]},{"rowNum":72,"id":"071","catCode":"CAT05","nameJa":"交通規制","readingJa":"こうつうきせい","summaryJa":"工事に伴う道路の通行制限","detailJa":"工事のために道路の一部または全部を通行止め・片側交互通行・速度制限などの規制を行うこと。所轄警察署への申請・許可が必要。","nameEn":"Traffic Control","summaryEn":"Restricting road traffic due to construction work.","detailEn":"Implementing restrictions such as road closures, alternating one-lane traffic, and speed limits on part or all of a road for construction purposes. Application to and permission from the local police station is required.","image":"","captionJa":"","captionEn":"","published":"","name3":"Kiểm soát giao thông","summary3":"Hạn chế giao thông đường bộ do công việc xây dựng.","detail3":"Thực hiện các hạn chế như đóng cửa đường, luân phiên giao thông một làn và giới hạn tốc độ trên một phần hoặc toàn bộ đường cho mục đích xây dựng. Cần phải nộp đơn và được cấp phép từ đồn cảnh sát địa phương.","caption3":"","name4":"Pengaturan Lalu Lintas","summary4":"Pembatasan lalu lintas jalan terkait pekerjaan konstruksi","detail4":"Melakukan pembatasan seperti penutupan sebagian atau seluruh jalan, lalu lintas bergantian satu arah, pembatasan kecepatan, dan lain-lain untuk keperluan konstruksi. Diperlukan pengajuan permohonan dan izin kepada kantor polisi yang berwenang.","caption4":"","images":[]},{"rowNum":73,"id":"072","catCode":"CAT05","nameJa":"占用許可","readingJa":"せんようきょか","summaryJa":"道路・河川などを一時的に使う許可","detailJa":"工事のために道路・河川・公園等の公共用地を一時的に使用（占有）するために、管理者（道路管理者・河川管理者等）から取得する許可。","nameEn":"Occupancy Permit","summaryEn":"A permit to temporarily use public land such as roads or rivers for construction.","detailEn":"A permit obtained from the administrator (road administrator, river administrator, etc.) to temporarily use (occupy) public land such as roads, rivers, and parks for construction purposes.","image":"","captionJa":"","captionEn":"","published":"","name3":"Giấy phép sử dụng tạm thời","summary3":"Giấy phép sử dụng tạm thời đất công như đường hoặc sông cho công trình xây dựng.","detail3":"Giấy phép được lấy từ người quản lý (người quản lý đường, người quản lý sông, v.v.) để tạm thời sử dụng (chiếm dụng) đất công như đường, sông và công viên cho mục đích xây dựng.","caption3":"","name4":"Izin Okupasi","summary4":"Izin penggunaan sementara jalan, sungai, dan lainnya","detail4":"Izin yang diperoleh dari pengelola (pengelola jalan, pengelola sungai, dll.) untuk menggunakan (menempati) secara sementara lahan publik seperti jalan, sungai, taman, dan sebagainya untuk keperluan konstruksi.","caption4":"","images":[]},{"rowNum":74,"id":"073","catCode":"CAT05","nameJa":"関係機関","readingJa":"かんけいきかん","summaryJa":"工事に関わる役所・電力・水道会社など","detailJa":"工事に関係する行政機関・公益事業者・地権者等の総称。電力会社・ガス会社・水道局・警察・隣接工事業者などが含まれる。","nameEn":"Related Agencies","summaryEn":"Government offices, utility companies, and other organizations related to the construction.","detailEn":"A general term for government agencies, public utility operators, and landowners related to the construction. Includes electric power companies, gas companies, water authorities, police, and adjacent construction companies.","image":"","captionJa":"","captionEn":"","published":"","name3":"Các cơ quan liên quan","summary3":"Các văn phòng chính phủ, công ty tiện ích và các tổ chức khác liên quan đến công trình xây dựng.","detail3":"Thuật ngữ chung cho các cơ quan chính phủ, nhà khai thác tiện ích công cộng và chủ đất liên quan đến xây dựng. Bao gồm công ty điện lực, công ty gas, cơ quan nước, cảnh sát và công ty xây dựng liền kề.","caption3":"","name4":"Instansi terkait","summary4":"Kantor pemerintahan, perusahaan listrik, perusahaan air, dan lainnya yang terkait dengan konstruksi","detail4":"Istilah umum untuk badan administratif, operator utilitas publik, pemilik tanah, dan pihak-pihak lain yang terkait dengan konstruksi. Termasuk perusahaan listrik, perusahaan gas, badan air minum, kepolisian, kontraktor konstruksi yang berdekatan, dan lain-lain.","caption4":"","images":[]},{"rowNum":75,"id":"074","catCode":"CAT05","nameJa":"地元説明","readingJa":"じもとせつめい","summaryJa":"工事内容を地域住民に説明すること","detailJa":"工事着工前に、工事の目的・内容・期間・影響（騒音・通行規制等）を地域住民に説明する説明会。理解と協力を得ることが目的。","nameEn":"Community Explanation Meeting","summaryEn":"An explanatory meeting with local residents before construction begins.","detailEn":"A meeting held before construction begins to explain the purpose, content, duration, and impacts (noise, traffic restrictions, etc.) of the construction to local residents. The purpose is to gain understanding and cooperation.","image":"","captionJa":"","captionEn":"","published":"","name3":"Họp giải thích cộng đồng","summary3":"Cuộc họp giải thích với cư dân địa phương trước khi xây dựng bắt đầu.","detail3":"Cuộc họp được tổ chức trước khi xây dựng bắt đầu để giải thích mục đích, nội dung, thời gian và tác động (tiếng ồn, hạn chế giao thông, v.v.) của công trình cho cư dân địa phương. Mục đích là để được hiểu và hợp tác.","caption3":"","name4":"Penjelasan lokal","summary4":"Menjelaskan isi pekerjaan konstruksi kepada penduduk daerah setempat","detail4":"Penjelasan kepada penduduk setempat mengenai tujuan, isi, periode, dan dampak konstruksi (kebisingan, pembatasan lalu lintas, dll.) sebelum dimulainya pekerjaan konstruksi. Tujuannya adalah untuk memperoleh pemahaman dan kerja sama.","caption4":"","images":[]},{"rowNum":76,"id":"075","catCode":"CAT05","nameJa":"苦情対応","readingJa":"くじょうたいおう","summaryJa":"工事への不満・クレームへの対応","detailJa":"工事に関して近隣住民・通行者等から寄せられた苦情・クレームを誠実に受け付け、原因調査・対策・報告を行う対応活動。","nameEn":"Complaint Handling","summaryEn":"Sincerely receiving and responding to complaints from nearby residents about construction.","detailEn":"An activity of sincerely receiving complaints and claims from nearby residents and passers-by regarding construction, and conducting cause investigation, countermeasures, and reporting.","image":"","captionJa":"","captionEn":"","published":"","name3":"Xử lý khiếu nại","summary3":"Tiếp nhận và phản hồi thành thật các khiếu nại từ cư dân gần đó về công trình xây dựng.","detail3":"Hoạt động tiếp nhận thành thật các khiếu nại từ cư dân gần đó và người qua lại liên quan đến xây dựng, và tiến hành điều tra nguyên nhân, biện pháp đối phó và báo cáo.","caption3":"","name4":"Penanganan Keluhan","summary4":"Penanganan Keluhan dan Komplain terhadap Pekerjaan Konstruksi","detail4":"Kegiatan tanggap yang menerima dengan jujur keluhan dan komplain dari penduduk sekitar, pejalan kaki, dan lain-lain terkait konstruksi, serta melakukan penyelidikan penyebab, penanggulangan, dan pelaporan.","caption4":"","images":[]},{"rowNum":77,"id":"076","catCode":"CAT05","nameJa":"書類提出","readingJa":"しょるいていしゅつ","summaryJa":"必要な文書を発注者などに提出すること","detailJa":"施工計画書・品質管理記録・出来形記録・完成図書など、工事に必要な書類を発注者・監督員に期日通りに提出する作業。","nameEn":"Document Submission","summaryEn":"Submitting required documents such as construction plans and quality records to the client.","detailEn":"The work of submitting required construction documents on time to the client and site supervisor, including construction plans, quality management records, as-built records, and completion documents.","image":"","captionJa":"","captionEn":"","published":"","name3":"Nộp tài liệu","summary3":"Nộp các tài liệu bắt buộc như kế hoạch xây dựng và hồ sơ chất lượng cho chủ đầu tư.","detail3":"Công việc nộp kịp thời các tài liệu xây dựng cần thiết cho chủ đầu tư và giám sát công trường, bao gồm kế hoạch thi công, hồ sơ quản lý chất lượng, hồ sơ hoàn công và tài liệu nghiệm thu.","caption3":"","name4":"Penyerahan dokumen","summary4":"Menyerahkan dokumen yang diperlukan kepada pihak pemesan dan lainnya","detail4":"Pekerjaan menyerahkan dokumen-dokumen yang diperlukan untuk pekerjaan konstruksi seperti rencana pelaksanaan konstruksi, catatan pengendalian mutu, catatan hasil pelaksanaan, gambar as built, dan lainnya kepada pemesan dan pengawas sesuai dengan jadwal yang ditentukan.","caption4":"","images":[]},{"rowNum":78,"id":"077","catCode":"CAT06","nameJa":"環境管理","readingJa":"かんきょうかんり","summaryJa":"工事による環境への影響を管理すること","detailJa":"工事に伴う騒音・振動・粉塵・水質汚濁・廃棄物等の環境への影響を最小限に抑えるための計画・実施・記録の活動。","nameEn":"Environmental Management","summaryEn":"Planning and implementing measures to minimize environmental impacts from construction.","detailEn":"Activities of planning, implementing, and recording measures to minimize environmental impacts from construction such as noise, vibration, dust, water pollution, and waste.","image":"","captionJa":"","captionEn":"","published":"","name3":"Quản lý môi trường","summary3":"Lập kế hoạch và thực hiện các biện pháp để giảm thiểu tác động môi trường từ xây dựng.","detail3":"Các hoạt động lập kế hoạch, thực hiện và ghi lại các biện pháp để giảm thiểu tác động môi trường từ xây dựng như tiếng ồn, rung động, bụi, ô nhiễm nước và chất thải.","caption3":"","name4":"Manajemen Lingkungan","summary4":"Mengelola dampak terhadap lingkungan akibat pekerjaan konstruksi","detail4":"Kegiatan perencanaan, pelaksanaan, dan pencatatan untuk meminimalkan dampak lingkungan seperti kebisingan, getaran, debu, pencemaran air, limbah, dan lain-lain yang timbul akibat pekerjaan konstruksi.","caption4":"","images":[]},{"rowNum":79,"id":"078","catCode":"CAT06","nameJa":"騒音対策","readingJa":"そうおんたいさく","summaryJa":"工事の音を抑える対策","detailJa":"重機・杭打ち機・コンプレッサー等の作業騒音を低減するための措置。防音シート設置・低騒音型機械の使用・作業時間帯の制限などがある。","nameEn":"Noise Control Measures","summaryEn":"Measures to reduce construction noise from machinery and equipment.","detailEn":"Measures to reduce work noise from heavy machinery, pile drivers, compressors, and other equipment. Includes installing soundproofing sheets, using low-noise machinery, and restricting working hours.","image":"","captionJa":"","captionEn":"","published":"","name3":"Biện pháp kiểm soát tiếng ồn","summary3":"Các biện pháp giảm tiếng ồn xây dựng từ máy móc và thiết bị.","detail3":"Các biện pháp giảm tiếng ồn công việc từ máy móc hạng nặng, máy đóng cọc, máy nén khí và các thiết bị khác. Bao gồm lắp đặt tấm cách âm, sử dụng máy móc ít ồn và hạn chế giờ làm việc.","caption3":"","name4":"Pengendalian Kebisingan","summary4":"Langkah-langkah untuk meredam suara konstruksi","detail4":"Langkah-langkah untuk mengurangi kebisingan kerja dari alat berat, mesin pancang tiang, kompresor, dan sebagainya. Termasuk pemasangan lembaran kedap suara, penggunaan mesin tipe rendah kebisingan, pembatasan waktu kerja, dan lain-lain.","caption4":"","images":[]},{"rowNum":80,"id":"079","catCode":"CAT06","nameJa":"振動対策","readingJa":"しんどうたいさく","summaryJa":"工事の振動を抑える対策","detailJa":"重機や杭打ち工事による地盤振動を低減するための措置。振動の小さい工法の選択・作業速度の調整・近隣への事前通知などがある。","nameEn":"Vibration Control Measures","summaryEn":"Measures to reduce ground vibration caused by construction machinery.","detailEn":"Measures to reduce ground vibration caused by heavy machinery and pile driving work. Includes selecting low-vibration construction methods, adjusting work speed, and giving prior notice to neighbors.","image":"","captionJa":"","captionEn":"","published":"","name3":"Biện pháp kiểm soát rung động","summary3":"Các biện pháp giảm rung động nền đất do máy móc xây dựng.","detail3":"Các biện pháp giảm rung động nền đất do máy móc hạng nặng và công việc đóng cọc. Bao gồm lựa chọn phương pháp xây dựng ít rung, điều chỉnh tốc độ công việc và thông báo trước cho cư dân lân cận.","caption3":"","name4":"Tindakan Penanggulangan Getaran","summary4":"Upaya untuk menekan getaran konstruksi","detail4":"Langkah-langkah untuk mengurangi getaran tanah akibat alat berat dan pekerjaan pemancangan tiang. Terdapat pemilihan metode kerja dengan getaran kecil, penyesuaian kecepatan kerja, dan pemberitahuan sebelumnya kepada warga sekitar.","caption4":"","images":[]},{"rowNum":81,"id":"080","catCode":"CAT06","nameJa":"粉塵対策","readingJa":"ふんじんたいさく","summaryJa":"土埃・粉塵を抑える対策（散水など）","detailJa":"掘削・整地・重機走行等で発生する粉塵（土埃）を抑制するための措置。散水・防塵ネット・車両タイヤ洗浄などがある。","nameEn":"Dust Control Measures","summaryEn":"Measures to suppress dust generated during excavation and earth-moving.","detailEn":"Measures to suppress dust generated during excavation, grading, and heavy machinery operation. Includes water sprinkling, dust prevention nets, and vehicle tire washing.","image":"","captionJa":"","captionEn":"","published":"","name3":"Biện pháp kiểm soát bụi","summary3":"Các biện pháp ngăn chặn bụi phát sinh trong quá trình đào đất và san lấp mặt bằng.","detail3":"Các biện pháp ngăn chặn bụi phát sinh trong quá trình đào đất, san lấp và vận hành máy móc hạng nặng. Bao gồm phun nước, lưới chống bụi và rửa lốp xe.","caption3":"","name4":"Pengendalian Debu","summary4":"Langkah-langkah untuk menekan debu tanah dan partikel debu (seperti penyiraman air)","detail4":"Tindakan untuk menekan debu (debu tanah) yang timbul dari penggalian, perataan tanah, dan lalu lintas alat berat. Terdapat penyiraman air, jaring anti-debu, pencucian ban kendaraan, dan sebagainya.","caption4":"","images":[]},{"rowNum":82,"id":"081","catCode":"CAT06","nameJa":"水質汚濁","readingJa":"すいしつおだく","summaryJa":"工事による川・水路の水の汚染","detailJa":"工事で発生する濁水・油・コンクリート廃液などが川や水路に流入し、水質を悪化させること。法律で防止措置が義務付けられている。","nameEn":"Water Pollution","summaryEn":"Contamination of rivers and channels by turbid water and waste fluids from construction.","detailEn":"The deterioration of water quality when turbid water, oil, concrete waste liquids, and other substances generated by construction flow into rivers and channels. Prevention measures are legally mandated.","image":"","captionJa":"","captionEn":"","published":"","name3":"Ô nhiễm nước","summary3":"Ô nhiễm sông và kênh do nước đục và chất thải lỏng từ xây dựng.","detail3":"Sự suy giảm chất lượng nước khi nước đục, dầu, chất thải lỏng bê tông và các chất khác phát sinh từ xây dựng chảy vào sông và kênh. Các biện pháp phòng ngừa được pháp luật quy định bắt buộc.","caption3":"","name4":"Pencemaran air","summary4":"Pencemaran air sungai dan saluran air akibat pekerjaan konstruksi","detail4":"Air keruh, minyak, dan cairan limbah beton yang dihasilkan dari pekerjaan konstruksi mengalir ke sungai atau saluran air dan memperburuk kualitas air. Langkah-langkah pencegahan diwajibkan oleh hukum.","caption4":"","images":[]},{"rowNum":83,"id":"082","catCode":"CAT06","nameJa":"濁水処理","readingJa":"だくすいしょり","summaryJa":"工事で出た濁った水を処理すること","detailJa":"掘削・コンクリート打設等で発生する土粒子・セメント分を含む濁水を、沈殿池や凝集沈殿装置で処理して基準値以下にしてから排出する作業。","nameEn":"Turbid Water Treatment","summaryEn":"Treating construction wastewater containing soil particles and cement before discharge.","detailEn":"Processing turbid water containing soil particles and cement components generated from excavation and concrete placement using sedimentation ponds or coagulation-sedimentation equipment, reducing concentrations below standard values before discharge.","image":"","captionJa":"","captionEn":"","published":"","name3":"Xử lý nước đục","summary3":"Xử lý nước thải xây dựng chứa hạt đất và xi măng trước khi xả.","detail3":"Xử lý nước đục chứa hạt đất và thành phần xi măng phát sinh từ đào đất và đổ bê tông bằng ao lắng hoặc thiết bị keo tụ lắng, giảm nồng độ xuống dưới giá trị tiêu chuẩn trước khi xả.","caption3":"","name4":"Pengolahan air keruh","summary4":"Mengolah air keruh yang dihasilkan dari pekerjaan konstruksi","detail4":"Pekerjaan pengolahan air keruh yang mengandung partikel tanah dan semen yang dihasilkan dari penggalian, pengecoran beton, dan sebagainya dengan menggunakan kolam pengendapan atau perangkat koagulasi-sedimentasi untuk menurunkan kadar kontaminan hingga di bawah nilai standar sebelum dibuang.","caption4":"","images":[]},{"rowNum":84,"id":"083","catCode":"CAT06","nameJa":"産業廃棄物","readingJa":"さんぎょうはいきぶつ","summaryJa":"工事で出るゴミ・廃材（産廃）","detailJa":"建設工事で発生するコンクリートがら・木くず・廃プラスチック・汚泥等の廃棄物。廃棄物処理法に基づき適正に処分しなければならない。","nameEn":"Industrial Waste","summaryEn":"Waste materials generated from construction such as concrete debris and wood scraps.","detailEn":"Waste materials generated from construction work such as concrete rubble, wood scraps, waste plastics, and sludge. Must be properly disposed of in accordance with the Waste Disposal Law.","image":"","captionJa":"","captionEn":"","published":"","name3":"Chất thải công nghiệp","summary3":"Vật liệu thải từ xây dựng như mảnh bê tông và vụn gỗ.","detail3":"Vật liệu thải phát sinh từ công trình xây dựng như mảnh bê tông, vụn gỗ, nhựa thải và bùn. Phải xử lý đúng cách theo Luật Xử lý Chất thải.","caption3":"","name4":"Limbah industri","summary4":"Sampah dan bahan sisa dari konstruksi (limbah industri)","detail4":"Limbah yang dihasilkan dari pekerjaan konstruksi seperti puing beton, limbah kayu, limbah plastik, lumpur, dan lain-lain. Harus dibuang dengan benar berdasarkan Undang-Undang Pengelolaan Limbah.","caption4":"","images":[]},{"rowNum":85,"id":"084","catCode":"CAT06","nameJa":"廃棄物処理","readingJa":"はいきぶつしょり","summaryJa":"産廃を適切に処分すること","detailJa":"工事で発生した産業廃棄物を分別・収集し、許可を受けた処理業者に委託して適正に処分・リサイクルすること。マニフェスト（管理票）の作成が義務。","nameEn":"Waste Disposal","summaryEn":"Properly sorting and disposing of industrial waste through licensed contractors.","detailEn":"Sorting and collecting industrial waste generated from construction and entrusting it to licensed treatment contractors for proper disposal and recycling. Creating a manifest (management form) is mandatory.","image":"","captionJa":"","captionEn":"","published":"","name3":"Xử lý chất thải","summary3":"Phân loại và xử lý đúng cách chất thải công nghiệp thông qua nhà thầu được cấp phép.","detail3":"Phân loại và thu gom chất thải công nghiệp phát sinh từ xây dựng và ủy thác cho nhà thầu xử lý được cấp phép để xử lý và tái chế đúng cách. Việc tạo bảng kê (mẫu quản lý) là bắt buộc.","caption3":"","name4":"Pengolahan limbah","summary4":"Membuang limbah industri dengan cara yang tepat","detail4":"Memilah dan mengumpulkan limbah industri yang dihasilkan dari pekerjaan konstruksi, serta membuang dan mendaur ulang secara tepat dengan mendelegasikan kepada perusahaan pengolahan yang telah memperoleh izin. Pembuatan manifes (lembar pengelolaan) adalah wajib.","caption4":"","images":[]},{"rowNum":86,"id":"085","catCode":"CAT06","nameJa":"緑化","readingJa":"りょっか","summaryJa":"工事後に草や木を植えること","detailJa":"工事で裸地になった法面・盛土面・切取り面などに植生を施し、緑を回復させる工事。侵食防止・景観回復・生態系保護の効果がある。","nameEn":"Revegetation","summaryEn":"Planting grass and trees on bare ground after construction.","detailEn":"Construction that restores vegetation on slopes, embankment faces, and cut faces left bare by construction. Has effects of erosion prevention, landscape restoration, and ecosystem protection.","image":"","captionJa":"","captionEn":"","published":"","name3":"Phủ xanh","summary3":"Trồng cỏ và cây trên đất trống sau xây dựng.","detail3":"Công trình khôi phục thực vật trên mái dốc, mặt đắp và mặt cắt bị để trần sau xây dựng. Có tác dụng ngăn xói mòn, phục hồi cảnh quan và bảo vệ hệ sinh thái.","caption3":"","name4":"Penghijauan","summary4":"Penanaman rumput dan pohon setelah pekerjaan konstruksi","detail4":"Pekerjaan untuk memulihkan kehijauan dengan melakukan penanaman vegetasi pada lereng, permukaan timbunan, dan permukaan galian yang menjadi tanah terbuka akibat konstruksi. Memiliki efek pencegahan erosi, pemulihan lanskap, dan perlindungan ekosistem.","caption4":"","images":[]},{"rowNum":87,"id":"086","catCode":"CAT06","nameJa":"侵食防止","readingJa":"しんしょくぼうし","summaryJa":"雨などによる土の流出を防ぐ対策","detailJa":"雨水・流水による土砂の流出・法面崩壊を防ぐための工法。植生工・コンクリート吹付け・シート養生・土留め工などがある。","nameEn":"Erosion Control","summaryEn":"Measures to prevent soil loss and slope collapse due to rain and water flow.","detailEn":"Construction methods to prevent soil erosion and slope collapse due to rainwater and water flow. Includes vegetation methods, shotcrete, sheet protection, and retaining wall construction.","image":"","captionJa":"","captionEn":"","published":"","name3":"Kiểm soát xói mòn","summary3":"Các biện pháp ngăn mất đất và sụp đổ mái dốc do mưa và dòng chảy.","detail3":"Các phương pháp xây dựng để ngăn xói mòn đất và sụp đổ mái dốc do nước mưa và dòng chảy. Bao gồm phương pháp thực vật, bê tông phun, bảo vệ tấm và xây dựng tường chắn đất.","caption3":"","name4":"Pencegahan erosi","summary4":"Upaya pencegahan erosi tanah akibat hujan dan sebagainya","detail4":"Metode konstruksi untuk mencegah erosi tanah dan keruntuhan lereng akibat air hujan dan aliran air. Metode ini meliputi penanaman vegetasi, penyemprotan beton, perawatan dengan lembaran pelindung, dan konstruksi penahan tanah.","caption4":"","images":[]},{"rowNum":88,"id":"087","catCode":"CAT06","nameJa":"生態系保護","readingJa":"せいたいけいほご","summaryJa":"動植物への影響を最小限にすること","detailJa":"工事による動植物の生息地・繁殖地への影響を調査し、工法・施工時期の変更・移植・保護区設置等で影響を最小化すること。","nameEn":"Ecosystem Protection","summaryEn":"Minimizing construction impacts on habitats of animals and plants.","detailEn":"Investigating construction impacts on habitats and breeding grounds of animals and plants, and minimizing impacts by changing construction methods, construction timing, transplanting, and setting up protected areas.","image":"","captionJa":"","captionEn":"","published":"","name3":"Bảo vệ hệ sinh thái","summary3":"Giảm thiểu tác động xây dựng đến môi trường sống của động vật và thực vật.","detail3":"Điều tra tác động xây dựng đến môi trường sống và khu vực sinh sản của động vật và thực vật, và giảm thiểu tác động bằng cách thay đổi phương pháp xây dựng, thời điểm thi công, cấy ghép và thiết lập khu bảo vệ.","caption3":"","name4":"Perlindungan ekosistem","summary4":"Meminimalkan dampak terhadap flora dan fauna","detail4":"Menyelidiki dampak konstruksi terhadap habitat dan tempat berkembang biak flora dan fauna, serta meminimalkan dampak tersebut melalui perubahan metode konstruksi, perubahan waktu pelaksanaan, transplantasi, pembentukan kawasan konservasi, dan sebagainya.","caption4":"","images":[]},{"rowNum":89,"id":"088","catCode":"CAT07","nameJa":"現場代理人","readingJa":"げんばだいりにん","summaryJa":"現場の責任者（所長など）","detailJa":"建設業法に基づき、受注者（建設会社）が工事現場に常駐させる責任者。発注者との協議・現場全体の管理・緊急時対応の権限を持つ。","nameEn":"Site Manager","summaryEn":"The on-site representative of the contractor responsible for all site management.","detailEn":"A responsible person that the contractor (construction company) keeps permanently stationed at the construction site based on the Construction Business Law. Has authority for consultations with the client, overall site management, and emergency response.","image":"","captionJa":"","captionEn":"","published":"","name3":"Quản lý công trường","summary3":"Đại diện tại công trường của nhà thầu chịu trách nhiệm về tất cả quản lý công trường.","detail3":"Người phụ trách mà nhà thầu (công ty xây dựng) duy trì thường trú tại công trường xây dựng theo Luật Kinh doanh Xây dựng. Có thẩm quyền tư vấn với chủ đầu tư, quản lý toàn bộ công trường và phản hồi khẩn cấp.","caption3":"","name4":"Wakil lapangan","summary4":"Penanggung jawab lapangan (kepala kantor, dll)","detail4":"Berdasarkan Undang-Undang Konstruksi, penanggung jawab yang ditempatkan secara permanen di lokasi proyek oleh kontraktor (perusahaan konstruksi). Memiliki wewenang untuk melakukan konsultasi dengan pemberi kerja, mengelola keseluruhan lokasi proyek, dan menangani situasi darurat.","caption4":"","images":[]},{"rowNum":90,"id":"089","catCode":"CAT07","nameJa":"主任技術者","readingJa":"しゅにんぎじゅつしゃ","summaryJa":"技術的な管理責任者","detailJa":"建設業法で義務付けられた工事現場の技術的な管理責任者。施工計画・施工品質・安全管理を技術面でリードする有資格者。","nameEn":"Chief Engineer","summaryEn":"The technically qualified manager responsible for technical supervision at the construction site.","detailEn":"A technically qualified manager required by the Construction Business Law to be responsible for technical supervision at construction sites. A qualified person who leads construction planning, quality, and safety management from a technical perspective.","image":"","captionJa":"","captionEn":"","published":"","name3":"Kỹ sư trưởng","summary3":"Người quản lý có trình độ kỹ thuật chịu trách nhiệm giám sát kỹ thuật tại công trường.","detail3":"Người quản lý có trình độ kỹ thuật được Luật Kinh doanh Xây dựng yêu cầu phải chịu trách nhiệm giám sát kỹ thuật tại công trường xây dựng. Người có chuyên môn dẫn dắt lập kế hoạch thi công, chất lượng và quản lý an toàn từ góc độ kỹ thuật.","caption3":"","name4":"Kepala Teknisi","summary4":"Penanggung jawab manajemen teknis","detail4":"Penanggung jawab manajemen teknis di lokasi konstruksi yang diwajibkan oleh Undang-Undang Industri Konstruksi. Pemegang sertifikat yang memimpin aspek teknis dalam perencanaan pelaksanaan, kualitas pelaksanaan, dan manajemen keselamatan.","caption4":"","images":[]},{"rowNum":91,"id":"090","catCode":"CAT07","nameJa":"職長","readingJa":"しょくちょう","summaryJa":"作業員グループのリーダー","detailJa":"複数の作業員をまとめ、日常の作業指示・安全管理・品質確認を行う現場の中間管理職。職長教育の受講が義務付けられている。","nameEn":"Foreman","summaryEn":"A site supervisor who leads a group of workers and manages daily work and safety.","detailEn":"A mid-level site manager who leads multiple workers and handles daily work instructions, safety management, and quality confirmation. Attendance at foreman training is mandatory.","image":"","captionJa":"","captionEn":"","published":"","name3":"Trưởng nhóm","summary3":"Giám sát công trường dẫn dắt một nhóm công nhân và quản lý công việc và an toàn hàng ngày.","detail3":"Người quản lý cấp trung tại công trường dẫn dắt nhiều công nhân và xử lý hướng dẫn công việc hàng ngày, quản lý an toàn và xác nhận chất lượng. Bắt buộc phải tham dự đào tạo trưởng nhóm.","caption3":"","name4":"Mandor","summary4":"Pemimpin kelompok pekerja","detail4":"Posisi manajemen menengah di lapangan yang memimpin beberapa pekerja dan melakukan instruksi kerja harian, manajemen keselamatan, serta konfirmasi kualitas. Wajib mengikuti pendidikan kepala regu kerja (shokuchō kyōiku).","caption4":"","images":[]},{"rowNum":92,"id":"091","catCode":"CAT07","nameJa":"重機","readingJa":"じゅうき","summaryJa":"ショベルカーなど大型機械の総称","detailJa":"建設工事に使用する大型機械の総称。バックホウ・ブルドーザー・ダンプトラック・クレーン・振動ローラーなど多種類がある。","nameEn":"Heavy Equipment","summaryEn":"A general term for large construction machinery such as excavators and bulldozers.","detailEn":"A general term for large machinery used in construction work. Includes many types such as backhoes, bulldozers, dump trucks, cranes, and vibratory rollers.","image":"","captionJa":"","captionEn":"","published":"","name3":"Thiết bị hạng nặng","summary3":"Thuật ngữ chung cho máy móc xây dựng lớn như máy đào và máy ủi.","detail3":"Thuật ngữ chung cho máy móc lớn sử dụng trong công trình xây dựng. Bao gồm nhiều loại như máy đào, máy ủi, xe ben, cần cẩu và máy lu rung.","caption3":"","name4":"Mesin berat","summary4":"Istilah umum untuk mesin-mesin besar seperti excavator","detail4":"Istilah umum untuk mesin-mesin besar yang digunakan dalam pekerjaan konstruksi. Terdapat berbagai jenis seperti excavator, bulldozer, dump truck, crane, dan vibrating roller.","caption4":"","images":[]},{"rowNum":93,"id":"092","catCode":"CAT07","nameJa":"バックホウ","readingJa":"ばっくほう","summaryJa":"ショベルカー（掘削に使う代表的な重機）","detailJa":"油圧で動くアーム・バケットを使って地面を掘削する建設機械。土の掘削・積込・整地・法面整形など多目的に使用される最も一般的な重機。","nameEn":"Backhoe (Excavator)","summaryEn":"A hydraulic excavator using an arm and bucket to dig the ground.","detailEn":"A construction machine that uses hydraulically powered arms and buckets to excavate the ground. The most common heavy machinery, used for multiple purposes including soil excavation, loading, grading, and slope shaping.","image":"","captionJa":"","captionEn":"","published":"","name3":"Máy đào (Máy xúc)","summary3":"Máy đào thủy lực sử dụng cần và gầu để đào đất.","detail3":"Máy xây dựng sử dụng cần và gầu được điều khiển bằng thủy lực để đào đất. Máy móc hạng nặng phổ biến nhất, được sử dụng cho nhiều mục đích bao gồm đào đất, bốc hàng, san lấp và tạo hình mái dốc.","caption3":"","name4":"Excavator","summary4":"Excavator (alat berat yang representatif untuk digunakan dalam penggalian)","detail4":"Mesin konstruksi yang menggali tanah menggunakan arm dan bucket yang digerakkan oleh sistem hidrolik. Mesin berat yang paling umum digunakan untuk berbagai keperluan seperti penggalian tanah, pemuatan, perataan tanah, dan pembentukan lereng.","caption4":"","images":[]},{"rowNum":94,"id":"093","catCode":"CAT07","nameJa":"ダンプトラック","readingJa":"だんぷとらっく","summaryJa":"荷台が傾いて土を降ろせるトラック","detailJa":"油圧で荷台を傾けて積み荷（土砂・砕石・廃棄物等）を降ろせるトラック。掘削土の搬出・材料の搬入に欠かせない。","nameEn":"Dump Truck","summaryEn":"A truck with a hydraulic tilting bed for unloading soil and materials.","detailEn":"A truck that can unload cargo (soil, crushed stone, waste, etc.) by tilting the bed hydraulically. Essential for transporting excavated soil out of the site and bringing materials in.","image":"","captionJa":"","captionEn":"","published":"","name3":"Xe ben","summary3":"Xe tải có thùng xe nghiêng thủy lực để đổ đất và vật liệu.","detail3":"Xe tải có thể đổ hàng hóa (đất, đá dăm, chất thải, v.v.) bằng cách nghiêng thùng xe bằng thủy lực. Thiết yếu để vận chuyển đất đào ra khỏi công trường và đưa vật liệu vào.","caption3":"","name4":"Truk dump","summary4":"Truk yang dapat menurunkan tanah dengan cara memiringkan bak muatan","detail4":"Truk yang dapat menurunkan muatan (tanah, batu pecah, limbah, dll.) dengan memiringkan bak muatan menggunakan sistem hidrolik. Sangat penting untuk pengangkutan tanah galian dan pengangkutan material masuk.","caption4":"","images":[]},{"rowNum":95,"id":"094","catCode":"CAT07","nameJa":"振動ローラー","readingJa":"しんどうろーらー","summaryJa":"振動で地面を締め固める機械","detailJa":"鉄製ドラムに振動を与えながら走行し、盛土・路盤・アスファルトを効果的に締め固める建設機械。大面積の転圧に最適。","nameEn":"Vibratory Roller","summaryEn":"A compaction machine that uses vibration to compact soil, road base, and asphalt.","detailEn":"A construction machine that travels while applying vibration to steel drums to effectively compact embankment, road base, and asphalt. Best suited for rolling large areas.","image":"","captionJa":"","captionEn":"","published":"","name3":"Máy lu rung","summary3":"Máy đầm chặt sử dụng rung động để đầm chặt đất, nền đường và nhựa đường.","detail3":"Máy xây dựng di chuyển trong khi tác động rung động vào trống thép để đầm chặt hiệu quả nền đắp, nền đường và nhựa đường. Phù hợp nhất để lu lèn diện tích lớn.","caption3":"","name4":"Roller getar","summary4":"Mesin yang memadatkan tanah dengan getaran","detail4":"Mesin konstruksi yang berjalan sambil memberikan getaran pada drum baja untuk memadatkan timbunan, perkerasan jalan, dan aspal secara efektif. Sangat cocok untuk pemadatan area yang luas.","caption4":"","images":[]},{"rowNum":96,"id":"095","catCode":"CAT07","nameJa":"保護具","readingJa":"ほごぐ","summaryJa":"ヘルメット・安全帯などの安全装備","detailJa":"作業員を労働災害から守るための個人用安全装備の総称。ヘルメット・安全帯（ハーネス）・安全靴・保護メガネ・防塵マスク等がある。着用が法律で義務付けられている。","nameEn":"Protective Equipment (PPE)","summaryEn":"Personal safety gear such as helmets and safety harnesses to protect workers.","detailEn":"A general term for personal safety equipment to protect workers from occupational accidents. Includes helmets, safety harnesses, safety shoes, protective goggles, and dust masks. Wearing is legally mandated.","image":"","captionJa":"","captionEn":"","published":"","name3":"Thiết bị bảo hộ cá nhân (PPE)","summary3":"Dụng cụ an toàn cá nhân như mũ bảo hiểm và dây an toàn để bảo vệ công nhân.","detail3":"Thuật ngữ chung cho thiết bị an toàn cá nhân để bảo vệ công nhân khỏi tai nạn lao động. Bao gồm mũ bảo hiểm, dây an toàn, giày bảo hộ, kính bảo hộ và khẩu trang chống bụi. Đeo là bắt buộc theo pháp luật.","caption3":"","name4":"Alat pelindung diri","summary4":"Helm, sabuk pengaman, dan peralatan keselamatan lainnya","detail4":"Istilah umum untuk peralatan keselamatan pribadi yang melindungi pekerja dari kecelakaan kerja. Termasuk helm keselamatan, sabuk pengaman (harness), sepatu keselamatan, kacamata pelindung, masker debu, dan lain-lain. Penggunaan peralatan ini diwajibkan oleh hukum.","caption4":"","images":[]},{"rowNum":97,"id":"096","catCode":"CAT07","nameJa":"ヒヤリハット","readingJa":"ひやりはっと","summaryJa":"事故になりそうだった危険な出来事","detailJa":"実際の事故には至らなかったが、一歩間違えば事故になっていた危険な出来事や状態のこと。報告・共有し再発防止に活かす重要な安全情報。","nameEn":"Near Miss","summaryEn":"A dangerous incident that almost resulted in an accident but did not.","detailEn":"A dangerous incident or condition that did not actually result in an accident, but could have if handled differently. Important safety information that should be reported, shared, and used to prevent recurrence.","image":"","captionJa":"","captionEn":"","published":"","name3":"Suýt tai nạn","summary3":"Sự cố nguy hiểm suýt dẫn đến tai nạn nhưng không xảy ra.","detail3":"Sự cố hoặc điều kiện nguy hiểm không thực sự dẫn đến tai nạn, nhưng có thể xảy ra nếu xử lý khác đi. Thông tin an toàn quan trọng cần được báo cáo, chia sẻ và sử dụng để ngăn ngừa tái phát.","caption3":"","name4":"Kejadian Nyaris Celaka","summary4":"Kejadian berbahaya yang hampir menyebabkan kecelakaan","detail4":"Kejadian atau kondisi berbahaya yang meskipun tidak sampai menyebabkan kecelakaan sesungguhnya, namun jika sedikit saja salah langkah bisa menjadi kecelakaan. Informasi keselamatan penting yang dilaporkan dan dibagikan untuk dimanfaatkan dalam pencegahan terulangnya kejadian serupa.","caption4":"","images":[]},{"rowNum":98,"id":"097","catCode":"CAT07","nameJa":"不陸","readingJa":"ふりく","summaryJa":"地面や施工面の凸凹・不均一","detailJa":"道路・床・法面などの仕上げ面に生じた凸凹・波打ちの状態。舗装の不陸は走行性・排水性を悪化させるため、規定の平坦性基準内に収める必要がある。","nameEn":"Unevenness / Irregularity","summaryEn":"Bumps and unevenness on road surfaces or construction surfaces.","detailEn":"Bumps and undulations on finished surfaces such as roads, floors, and slopes. Pavement unevenness deteriorates ride quality and drainage, so it must be kept within specified flatness standards.","image":"","captionJa":"","captionEn":"","published":"","name3":"Không bằng phẳng","summary3":"Gồ ghề và không đồng đều trên bề mặt đường hoặc bề mặt xây dựng.","detail3":"Gồ ghề và gợn sóng trên các bề mặt hoàn thiện như đường, sàn và mái dốc. Sự không bằng phẳng của mặt đường làm giảm chất lượng lái xe và thoát nước, vì vậy phải giữ trong tiêu chuẩn độ phẳng quy định.","caption3":"","name4":"Ketidakrataan","summary4":"Ketidakrataan dan ketidakseragaman permukaan tanah atau permukaan konstruksi","detail4":"Kondisi ketidakrataan dan gelombang yang terjadi pada permukaan akhir seperti jalan, lantai, dan lereng. Ketidakrataan perkerasan memperburuk kemampuan berkendara dan drainase, sehingga perlu dijaga dalam batas standar kerataan yang telah ditetapkan.","caption4":"","images":[]},{"rowNum":99,"id":"098","catCode":"CAT07","nameJa":"竣工","readingJa":"しゅんこう","summaryJa":"工事が完成すること","detailJa":"すべての工事が設計通りに完了し、発注者の完成検査に合格した状態。竣工後、引渡し手続きを経て発注者に施設が引き渡される。","nameEn":"Completion","summaryEn":"The state where all construction work is finished and has passed the final inspection.","detailEn":"The state where all construction has been completed as designed and has passed the client's completion inspection. After completion, the facility is handed over to the client through the handover procedure.","image":"","captionJa":"","captionEn":"","published":"","name3":"Hoàn công","summary3":"Trạng thái khi tất cả công việc xây dựng đã hoàn thành và vượt qua kiểm tra nghiệm thu cuối cùng.","detail3":"Trạng thái khi tất cả công trình đã hoàn thành theo thiết kế và vượt qua kiểm tra nghiệm thu cuối cùng của chủ đầu tư. Sau khi hoàn công, cơ sở được bàn giao cho chủ đầu tư qua thủ tục bàn giao.","caption3":"","name4":"Selesai pembangunan","summary4":"Penyelesaian pekerjaan konstruksi","detail4":"Semua pekerjaan konstruksi telah selesai sesuai dengan desain dan lulus inspeksi penyelesaian oleh pemilik proyek. Setelah penyelesaian konstruksi, fasilitas diserahkan kepada pemilik proyek melalui prosedur serah terima.","caption4":"","images":[]},{"rowNum":100,"id":"099","catCode":"CAT07","nameJa":"引渡し","readingJa":"ひきわたし","summaryJa":"完成した工事を発注者に渡すこと","detailJa":"完成検査合格後、施工者が完成した工事・施設を発注者に正式に引き渡す手続き。完成図書・鍵・保証書等を一括して渡す。","nameEn":"Handover","summaryEn":"The formal transfer of completed construction work to the client.","detailEn":"The procedure of formally transferring the completed construction work and facility from the contractor to the client after passing the completion inspection. Completion documents, keys, and warranties are all handed over together.","image":"","captionJa":"","captionEn":"","published":"","name3":"Bàn giao","summary3":"Việc chuyển giao chính thức công trình xây dựng hoàn thiện cho chủ đầu tư.","detail3":"Thủ tục chính thức chuyển giao công trình và cơ sở hoàn thiện từ nhà thầu cho chủ đầu tư sau khi vượt qua kiểm tra nghiệm thu. Tài liệu hoàn công, chìa khóa và giấy bảo hành được bàn giao cùng nhau.","caption3":"","name4":"Penyerahan","summary4":"Menyerahkan pekerjaan yang telah selesai kepada pemberi kerja","detail4":"Setelah lulus inspeksi penyelesaian, prosedur di mana kontraktor secara resmi menyerahkan pekerjaan dan fasilitas yang telah selesai kepada pemilik proyek. Dokumen penyelesaian, kunci, surat jaminan, dan lain-lain diserahkan secara bersamaan.","caption4":"","images":[]},{"rowNum":101,"id":"100","catCode":"CAT07","nameJa":"瑕疵担保","readingJa":"かしたんぽ","summaryJa":"工事完成後の欠陥に対する補償責任","detailJa":"工事完成・引渡し後に発覚した欠陥（瑕疵）に対して、施工者が無償で修補する責任。民法・建設業法で保証期間（1〜10年）が定められている。","nameEn":"Defect Liability","summaryEn":"The contractor's obligation to repair defects discovered after construction completion.","detailEn":"The contractor's responsibility to repair at no cost any defects discovered after construction completion and handover. The warranty period (1 to 10 years) is stipulated by the Civil Code and Construction Business Law.","image":"","captionJa":"","captionEn":"","published":"","name3":"Trách nhiệm về lỗi","summary3":"Nghĩa vụ của nhà thầu sửa chữa các khuyết tật được phát hiện sau khi hoàn thành xây dựng.","detail3":"Trách nhiệm của nhà thầu sửa chữa miễn phí bất kỳ khuyết tật nào được phát hiện sau khi hoàn thành xây dựng và bàn giao. Thời gian bảo hành (1 đến 10 năm) được quy định bởi Bộ luật Dân sự và Luật Kinh doanh Xây dựng.","caption3":"","name4":"Jaminan cacat tersembunyi","summary4":"Tanggung jawab jaminan terhadap cacat setelah penyelesaian konstruksi","detail4":"Tanggung jawab kontraktor untuk memperbaiki cacat (kekurangan) yang ditemukan setelah penyelesaian dan penyerahan pekerjaan konstruksi secara cuma-cuma. Periode garansi (1-10 tahun) ditetapkan dalam Hukum Perdata dan Undang-Undang Industri Konstruksi.","caption4":"","images":[]}];

function setLang(lang, btn) {
  // Case 3: Same language clicked while something is open → close and reset to list
  if (lang === currentLang && openTermId !== null) {
    openTermId = null;
    openDetailOpen = false;
    renderCatFilter();
    renderTerms();
    return;
  }
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const si = document.getElementById('search-input');
  si.placeholder = lang === 'ja' ? 'キーワードで検索...' : 'Search...';
  renderCatFilter();
  renderTerms();
}

  if (!cat) return '';
  if (currentLang === 'lang4') return cat.name4 || cat.name3 || cat.nameEn || cat.nameJa;
  if (currentLang === 'lang3') return cat.name3 || cat.nameEn || cat.nameJa;
  if (currentLang === 'en') return cat.nameEn || cat.nameJa;
  return cat.nameJa;
}

  if (currentLang === 'lang4') return t.name4 || t.name3 || t.nameEn || t.nameJa;

}
function termSummary(t) {
  if (currentLang === 'lang4') return t.summary4 || t.summary3 || t.summaryEn || t.summaryJa;
  if (currentLang === 'lang3') return t.summary3 || t.summaryEn || t.summaryJa;
  if (currentLang === 'en') return t.summaryEn || t.summaryJa;
  return t.summaryJa;
}
function termDetail(t) {
  if (currentLang === 'lang4') return t.detail4 || t.detail3 || t.detailEn || t.detailJa;
  if (currentLang === 'lang3') return t.detail3 || t.detailEn || t.detailJa;
  if (currentLang === 'en') return t.detailEn || t.detailJa;
  return t.detailJa;
}
function termCaption(t) {
  if (currentLang === 'lang4') return t.caption4 || t.caption3 || t.captionEn || t.captionJa;
  if (currentLang === 'lang3') return t.caption3 || t.captionEn || t.captionJa;
  if (currentLang === 'en') return t.captionEn || t.captionJa;
  return t.captionJa;
}

function kanaToRomaji(str) {
  if (!str) return '';
  const pairs = [
    ['きゃ','kya'],['きゅ','kyu'],['きょ','kyo'],
    ['しゃ','sha'],['しゅ','shu'],['しょ','sho'],
    ['ちゃ','cha'],['ちゅ','chu'],['ちょ','cho'],
    ['にゃ','nya'],['にゅ','nyu'],['にょ','nyo'],
    ['ひゃ','hya'],['ひゅ','hyu'],['ひょ','hyo'],
    ['みゃ','mya'],['みゅ','myu'],['みょ','myo'],
    ['りゃ','rya'],['りゅ','ryu'],['りょ','ryo'],
    ['ぎゃ','gya'],['ぎゅ','gyu'],['ぎょ','gyo'],
    ['じゃ','ja'],['じゅ','ju'],['じょ','jo'],
    ['あ','a'],['い','i'],['う','u'],['え','e'],['お','o'],
    ['か','ka'],['き','ki'],['く','ku'],['け','ke'],['こ','ko'],
    ['さ','sa'],['し','shi'],['す','su'],['せ','se'],['そ','so'],
    ['た','ta'],['ち','chi'],['つ','tsu'],['て','te'],['と','to'],
    ['な','na'],['に','ni'],['ぬ','nu'],['ね','ne'],['の','no'],
    ['は','ha'],['ひ','hi'],['ふ','fu'],['へ','he'],['ほ','ho'],
    ['ま','ma'],['み','mi'],['む','mu'],['め','me'],['も','mo'],
    ['や','ya'],['ゆ','yu'],['よ','yo'],
    ['ら','ra'],['り','ri'],['る','ru'],['れ','re'],['ろ','ro'],
    ['わ','wa'],['を','wo'],['ん','n'],
    ['が','ga'],['ぎ','gi'],['ぐ','gu'],['げ','ge'],['ご','go'],
    ['ざ','za'],['じ','ji'],['ず','zu'],['ぜ','ze'],['ぞ','zo'],
    ['だ','da'],['ぢ','di'],['づ','du'],['で','de'],['ど','do'],
    ['ば','ba'],['び','bi'],['ぶ','bu'],['べ','be'],['ぼ','bo'],
    ['ぱ','pa'],['ぴ','pi'],['ぷ','pu'],['ぺ','pe'],['ぽ','po'],
    ['ぁ','a'],['ぃ','i'],['ぅ','u'],['ぇ','e'],['ぉ','o'],
    ['ー','-'],
  ];
  let result = '';
  let i = 0;
  while (i < str.length) {
    if (str[i] === 'っ') {
      const rest = str.slice(i + 1);
      let nextRomaji = '';
      for (const [k, v] of pairs) {
        if (rest.startsWith(k)) { nextRomaji = v; break; }
      }
      result += nextRomaji ? nextRomaji[0] : 't';
      i++;
      continue;
    }
    let matched = false;
    for (const [k, v] of pairs) {
      if (str.startsWith(k, i)) {
        result += v;
        i += k.length;
        matched = true;
        break;
      }
    }
    if (!matched) { result += str[i]; i++; }
  }
  return result;
}

function sortTerms(arr) {
  return [...arr].sort((a, b) => {
    if (currentLang === 'ja') {
      const ra = a.readingJa || termName(a), rb = b.readingJa || termName(b);
      return ra.localeCompare(rb, 'ja');
    }
    return termName(a).localeCompare(termName(b));
  });
}

function renderCatFilter() {
  const btnAll = document.getElementById('btn-all');
  if (btnAll) btnAll.classList.toggle('active', currentCat === 'all');
  const sel = document.getElementById('categorySelect');
  if (sel) {
    const placeholder = currentLang === 'ja' ? '分野を選ぶ' : 'Choose category';
    let html = '<option value="">' + placeholder + '</option>';
    CATEGORIES.forEach(function(c) {
      html += '<option value="' + esc2(c.code) + '"' + (currentCat === c.code ? ' selected' : '') + '>' + esc2(catName(c)) + '</option>';
    });
    sel.innerHTML = html;
    console.log('ドロップダウン選択肢数:', sel.options.length);
  }
}

function setCat(code) {
  currentCat = code;
  openTermId = null;
  openDetailOpen = false;
  renderCatFilter();
  renderTerms();
}

function setCatFromSelect(sel) {
  setCat(sel.value || 'all');
}

function renderTerms() {
  const q = document.getElementById('search-input').value.toLowerCase();
  let filtered = TERMS.filter(t => {
    if (currentCat !== 'all' && t.catCode !== currentCat) return false;
    if (!q) return true;
    return (termName(t) + termSummary(t) + (t.readingJa || '') + (t.name3 || '') + (t.nameEn || '') + (t.name4 || '')).toLowerCase().includes(q);
  });
  const sorted = sortTerms(filtered);
  const wrap = document.getElementById('term-list-wrap');
  const countEl = document.getElementById('result-count');

  const labels = { ja: '件の用語', en: ' term(s)', lang3: ' term(s)' };
  countEl.textContent = sorted.length + (labels[currentLang] || '件');

  if (sorted.length === 0) {
    wrap.innerHTML = `<div class="empty"><div class="icon">🔍</div><div>${currentLang === 'ja' ? '該当する用語が見つかりません' : 'No terms found'}</div></div>`;
    return;
  }

  const detailLabel = currentLang === 'ja' ? '詳細を見る' : 'Show details';
  const detailCloseLabel = currentLang === 'ja' ? '閉じる' : 'Close';

  _termIdByItemId = {};
  const items = sorted.map((t, i) => {
    const itemId = 'item-' + i;
    _termIdByItemId[itemId] = t.id;
    const name = esc2(termName(t));
    const romajiHtml = (currentLang === 'ja' && t.readingJa) ? `<span class="term-romaji">${esc2(kanaToRomaji(t.readingJa))}</span>` : '';
    const summary = esc2(termSummary(t));
    const detail = termDetail(t);
    const caption = termCaption(t);

    let detailHtml = '';
    const hasImages = t.images && t.images.length > 0;
    if (detail || hasImages || t.image) {
      const detailText = detail ? '<div class="term-detail-text">' + esc2(detail) + '</div>' : '';
      const cap = esc2(caption);
      let imgHtml = '';
      if (hasImages) {
        const imgTitle = currentLang === 'ja' ? '図・写真' : 'Figures and Photos';
        imgHtml = '<div class="term-images-section"><div class="term-images-title">' + esc2(imgTitle) + '</div>';
        t.images.forEach(function(img) {
          imgHtml += '<div class="term-image-item"><img class="term-detail-image" src="' + img.dataUrl + '" alt="' + cap + '">';
          if (cap) imgHtml += '<div class="term-detail-caption">' + cap + '</div>';
          imgHtml += '</div>';
        });
        imgHtml += '</div>';
      } else if (t.image) {
        imgHtml = '<div class="term-image-item"><img class="term-detail-image" src="images/' + esc2(t.image) + '" alt="' + cap + '" loading="lazy">';
        if (cap) imgHtml += '<div class="term-detail-caption">' + cap + '</div>';
        imgHtml += '</div>';
      }
      detailHtml = `
        <button class="detail-toggle" id="dtbtn-${itemId}" onclick="toggleDetail('${itemId}')">
          <span id="dtlabel-${itemId}">${detailLabel}</span>
          <span class="detail-arrow">▼</span>
        </button>
        <div class="term-detail-panel" id="detail-${itemId}">
          ${detailText}
          ${imgHtml}
        </div>`;
    }

    return `<div class="term-item" id="${itemId}">
      <button class="term-toggle" id="toggle-${itemId}" onclick="toggleSummary('${itemId}')">
        <span class="term-toggle-text">${name}${romajiHtml}</span>
        <span class="term-arrow">▼</span>
      </button>
      <div class="term-summary-panel" id="summary-${itemId}">
        <div class="term-summary-text">${summary}</div>
        ${detailHtml}
      </div>
    </div>`;
  });

  wrap.innerHTML = `<div class="term-list">${items.join('')}</div>`;

  // Restore open state after re-render (e.g. after language switch)
  if (openTermId !== null) {
    const restoredItemId = Object.keys(_termIdByItemId).find(k => _termIdByItemId[k] === openTermId);
    if (restoredItemId) {
      _applyOpenState(restoredItemId);
    } else {
      openTermId = null;
      openDetailOpen = false;
    }
  }
}

function _applyOpenState(itemId) {
  const toggleBtn = document.getElementById('toggle-' + itemId);
  const summaryPanel = document.getElementById('summary-' + itemId);
  if (!toggleBtn || !summaryPanel) return;
  toggleBtn.classList.add('open');
  summaryPanel.classList.add('open');
  if (openDetailOpen) {
    const btn = document.getElementById('dtbtn-' + itemId);
    const panel = document.getElementById('detail-' + itemId);
    const labelEl = document.getElementById('dtlabel-' + itemId);
    const closeLabel = currentLang === 'ja' ? '閉じる' : 'Close';
    if (btn && panel) {
      btn.classList.add('open');
      panel.classList.add('open');
      if (labelEl) labelEl.textContent = closeLabel;
    }
  }
  const el = document.getElementById(itemId);
  if (el) el.scrollIntoView({ behavior: 'instant', block: 'center' });
}

function toggleSummary(itemId) {
  const toggleBtn = document.getElementById('toggle-' + itemId);
  const summaryPanel = document.getElementById('summary-' + itemId);

  // Close previously open summary (and its detail) if a different term
  if (openTermId !== null && _termIdByItemId[itemId] !== openTermId) {
    const prevItemId = Object.keys(_termIdByItemId).find(k => _termIdByItemId[k] === openTermId);
    if (prevItemId) {
      const prevToggle = document.getElementById('toggle-' + prevItemId);
      const prevPanel = document.getElementById('summary-' + prevItemId);
      if (prevToggle) prevToggle.classList.remove('open');
      if (prevPanel) prevPanel.classList.remove('open');
      if (openDetailOpen) {
        const prevDetailBtn = document.getElementById('dtbtn-' + prevItemId);
        const prevDetail = document.getElementById('detail-' + prevItemId);
        if (prevDetailBtn) prevDetailBtn.classList.remove('open');
        if (prevDetail) prevDetail.classList.remove('open');
      }
    }
    openDetailOpen = false;
  }

  const isOpen = summaryPanel.classList.toggle('open');
  toggleBtn.classList.toggle('open', isOpen);
  openTermId = isOpen ? _termIdByItemId[itemId] : null;

  // If closing summary, also close detail
  if (!isOpen && openDetailOpen) {
    const detailBtn = document.getElementById('dtbtn-' + itemId);
    const detailPanel = document.getElementById('detail-' + itemId);
    if (detailBtn) detailBtn.classList.remove('open');
    if (detailPanel) detailPanel.classList.remove('open');
    openDetailOpen = false;
  }

  if (isOpen) {
    setTimeout(() => toggleBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 10);
  }
}

function toggleDetail(itemId) {
  const btn = document.getElementById('dtbtn-' + itemId);
  const panel = document.getElementById('detail-' + itemId);
  const labelEl = document.getElementById('dtlabel-' + itemId);
  const detailLabel = currentLang === 'ja' ? '詳細を見る' : 'Show details';
  const detailCloseLabel = currentLang === 'ja' ? '閉じる' : 'Close';

  const isOpen = panel.classList.toggle('open');
  btn.classList.toggle('open', isOpen);
  if (labelEl) labelEl.textContent = isOpen ? detailCloseLabel : detailLabel;
  openDetailOpen = isOpen;
}

function esc2(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Init
console.log('分類データ:', CATEGORIES);
renderCatFilter();
renderTerms();
</script>
</body>
</html>
