y làm việc. Đây là tài liệu cơ sở cho việc quản lý tiến độ thi công và quản lý lao động.","caption3":"","images":[]},{"rowNum":63,"id":"062","catCode":"CAT04","nameJa":"設計図書","readingJa":"せっけいとしょ","summaryJa":"工事の設計図・仕様書のセット","detailJa":"工事内容を定めた設計図・仕様書・特記仕様書・数量計算書などをまとめたもの。工事はこの図書に従って行われる。","nameFr":"Design Documents","summaryFr":"A set of design drawings and specifications defining the construction content.","detailFr":"A collection of design drawings, specifications, special specifications, and quantity calculation sheets defining the construction content. Construction is carried out in accordance with these documents.","nameEn":"Hồ sơ thiết kế","summaryEn":"Bộ bản vẽ thiết kế và thông số kỹ thuật xác định nội dung xây dựng.","detailEn":"Tập hợp bản vẽ thiết kế, thông số kỹ thuật, thông số kỹ thuật đặc biệt và tờ tính toán khối lượng xác định nội dung xây dựng. Công trình được thực hiện theo các tài liệu này.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Bản vẽ thiết kế","summary3":"Bộ bản vẽ thiết kế và thuyết minh kỹ thuật công trình","detail3":"Tài liệu tổng hợp bao gồm bản vẽ thiết kế, sách quy cách kỹ thuật, sách quy cách đặc biệt, bảng tính toán khối lượng công việc và các tài liệu khác quy định nội dung công trình. Công trình được thực hiện theo các tài liệu này.","caption3":"","images":[]},{"rowNum":64,"id":"063","catCode":"CAT04","nameJa":"仕様書","readingJa":"しようしょ","summaryJa":"工事のやり方・材料を指定した文書","detailJa":"工事に使用する材料の品質・規格、施工方法・精度などを規定した文書。標準仕様書と特記仕様書がある。","nameFr":"Specifications","summaryFr":"A document specifying the quality of materials, construction methods, and required precision.","detailFr":"A document stipulating the quality and standards of materials used in construction, as well as construction methods and required precision. Includes standard specifications and special specifications.","nameEn":"Thông số kỹ thuật","summaryEn":"Tài liệu quy định chất lượng vật liệu, phương pháp thi công và độ chính xác yêu cầu.","detailEn":"Tài liệu quy định chất lượng và tiêu chuẩn của vật liệu sử dụng trong xây dựng, cũng như phương pháp thi công và độ chính xác yêu cầu. Bao gồm thông số kỹ thuật tiêu chuẩn và thông số kỹ thuật đặc biệt.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Đặc tả kỹ thuật","summary3":"Tài liệu quy định phương pháp thi công và vật liệu","detail3":"Tài liệu quy định chất lượng, tiêu chuẩn của vật liệu sử dụng trong công trình, phương pháp thi công, độ chính xác, v.v. Có sổ tay kỹ thuật tiêu chuẩn và sổ tay kỹ thuật đặc biệt.","caption3":"","images":[]},{"rowNum":65,"id":"064","catCode":"CAT04","nameJa":"変更指示","readingJa":"へんこうしじ","summaryJa":"設計・施工内容の変更を伝える指示","detailJa":"工事中に設計の変更が必要になった場合、発注者から受注者（施工業者）に対して正式に変更内容を指示する文書または口頭指示。","nameFr":"Change Order","summaryFr":"A formal instruction from the client to the contractor to modify design or construction content.","detailFr":"When design changes become necessary during construction, a formal written or verbal instruction from the client to the contractor specifying the change content.","nameEn":"Lệnh thay đổi","summaryEn":"Chỉ thị chính thức từ chủ đầu tư đến nhà thầu để sửa đổi nội dung thiết kế hoặc xây dựng.","detailEn":"Khi cần thay đổi thiết kế trong quá trình xây dựng, chỉ thị bằng văn bản hoặc lời nói chính thức từ chủ đầu tư đến nhà thầu nêu rõ nội dung thay đổi.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Hướng dẫn thay đổi","summary3":"Chỉ thị thông báo thay đổi nội dung thiết kế và thi công","detail3":"Trong trường hợp cần thay đổi thiết kế trong quá trình thi công, văn bản hoặc chỉ thị bằng lời nói mà bên đặt hàng chỉ thị chính thức nội dung thay đổi cho bên nhận thầu (nhà thầu thi công).","caption3":"","images":[]},{"rowNum":66,"id":"065","catCode":"CAT04","nameJa":"手直し","readingJa":"てなおし","summaryJa":"不具合のある部分を修正すること","detailJa":"検査・確認で不合格・不具合と判定された箇所を補修・やり直しすること。発注者指示に従い速やかに対応する必要がある。","nameFr":"Rework","summaryFr":"Repairing or redoing parts found to be defective or non-conforming during inspection.","detailFr":"Repairing or redoing parts found to be non-conforming or defective during inspection and confirmation. It is necessary to respond promptly in accordance with client instructions.","nameEn":"Sửa lại","summaryEn":"Sửa chữa hoặc làm lại các phần được phát hiện là lỗi hoặc không phù hợp trong quá trình kiểm tra.","detailEn":"Sửa chữa hoặc làm lại các phần được phát hiện là không phù hợp hoặc có lỗi trong quá trình kiểm tra và xác nhận. Cần phải phản hồi kịp thời theo hướng dẫn của chủ đầu tư.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"sửa chữa","summary3":"Sửa chữa các bộ phận có lỗi","detail3":"Sửa chữa, làm lại các vị trí được xác định là không đạt yêu cầu hoặc có lỗi qua kiểm tra và xác nhận. Cần phải ứng phó nhanh chóng theo chỉ thị của bên đặt hàng.","caption3":"","images":[]},{"rowNum":67,"id":"066","catCode":"CAT05","nameJa":"発注者","readingJa":"はっちゅうしゃ","summaryJa":"工事を依頼する側（官公庁・自治体など）","detailJa":"工事の発注・費用負担・検査を行う側。国・都道府県・市町村などの公共機関が多い。工事の目的・基準を決定する最重要関係者。","nameFr":"Client / Owner","summaryFr":"The party commissioning and funding the construction, such as government agencies.","detailFr":"The party responsible for ordering, funding, and inspecting construction. Often public institutions such as the national government, prefectures, and municipalities. The most important stakeholder who determines the purpose and standards of construction.","nameEn":"Chủ đầu tư","summaryEn":"Bên đặt hàng và tài trợ cho công trình, thường là các cơ quan chính phủ.","detailEn":"Bên chịu trách nhiệm đặt hàng, tài trợ và kiểm tra xây dựng. Thường là các tổ chức công như chính phủ quốc gia, tỉnh và đô thị. Bên liên quan quan trọng nhất quyết định mục đích và tiêu chuẩn xây dựng.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Bên đặt hàng","summary3":"Bên đặt hàng công trình (cơ quan công quyền, chính quyền địa phương, v.v.)","detail3":"Bên thực hiện việc đặt hàng công trình, chịu trách nhiệm chi phí và kiểm tra. Phần lớn là các cơ quan công cộng như quốc gia, tỉnh thành phố, thị xã và làng xã. Là bên liên quan quan trọng nhất quyết định mục đích và tiêu chuẩn của công trình.","caption3":"","images":[]},{"rowNum":68,"id":"067","catCode":"CAT05","nameJa":"監督員","readingJa":"かんとくいん","summaryJa":"発注者側の工事確認担当者","detailJa":"発注者（官公庁等）が現場に派遣する工事監督の担当者。施工者の施工状況を確認し、指示・承諾・検査を行う権限を持つ。","nameFr":"Site Supervisor","summaryFr":"A representative of the client assigned to oversee and confirm construction at the site.","detailFr":"A construction supervision representative dispatched to the site by the client (government agency, etc.). Has the authority to confirm construction conditions, give instructions, grant approvals, and conduct inspections.","nameEn":"Giám sát công trình","summaryEn":"Đại diện của chủ đầu tư được cử đến giám sát và xác nhận công trình tại công trường.","detailEn":"Đại diện giám sát xây dựng được chủ đầu tư (cơ quan chính phủ, v.v.) cử đến công trường. Có thẩm quyền xác nhận điều kiện thi công, đưa ra chỉ thị, cấp chấp thuận và tiến hành kiểm tra.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Nhân viên giám sát","summary3":"Người phụ trách xác nhận công trình phía bên đặt hàng","detail3":"Người phụ trách giám sát công trình do bên đặt hàng (cơ quan công quyền, v.v.) cử đến hiện trường. Có thẩm quyền kiểm tra tình hình thi công của nhà thầu thi công, đưa ra chỉ thị, phê duyệt và tiến hành kiểm tra nghiệm thu.","caption3":"","images":[]},{"rowNum":69,"id":"068","catCode":"CAT05","nameJa":"協議","readingJa":"きょうぎ","summaryJa":"発注者・関係機関と話し合うこと","detailJa":"施工上の問題・設計変更・工程調整などについて、発注者・監督員・関係機関と正式に話し合い、解決策を協議すること。議事録を残すことが重要。","nameFr":"Conference / Consultation","summaryFr":"A formal discussion with the client or related agencies to resolve construction issues.","detailFr":"A formal discussion with the client, site supervisor, and related agencies about construction problems, design changes, and schedule adjustments to discuss solutions. It is important to keep meeting minutes.","nameEn":"Họp thương thảo","summaryEn":"Thảo luận chính thức với chủ đầu tư hoặc các cơ quan liên quan để giải quyết các vấn đề xây dựng.","detailEn":"Thảo luận chính thức với chủ đầu tư, giám sát công trường và các cơ quan liên quan về các vấn đề xây dựng, thay đổi thiết kế và điều chỉnh tiến độ để thảo luận giải pháp. Quan trọng là phải giữ biên bản cuộc họp.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Thương lượng","summary3":"Thảo luận với bên đặt hàng và các cơ quan liên quan","detail3":"Về các vấn đề thi công, thay đổi thiết kế, điều chỉnh tiến độ, cần thảo luận chính thức với chủ đầu tư, cán bộ giám sát và các cơ quan liên quan để thương thảo phương án giải quyết. Việc lưu giữ biên bản họp là quan trọng.","caption3":"","images":[]},{"rowNum":70,"id":"069","catCode":"CAT05","nameJa":"承諾","readingJa":"しょうだく","summaryJa":"発注者が提案・計画を認めること","detailJa":"施工者が提出した施工計画・変更案・材料を発注者・監督員が審査し、正式に認めること。承諾なしに施工を進めてはならない事項が多い。","nameFr":"Approval","summaryFr":"The client's formal acceptance of a submitted plan, change, or material.","detailFr":"The formal acceptance by the client or site supervisor after reviewing a construction plan, change proposal, or material submitted by the contractor. There are many items for which construction must not proceed without approval.","nameEn":"Phê duyệt","summaryEn":"Chấp thuận chính thức của chủ đầu tư đối với kế hoạch, thay đổi hoặc vật liệu đã nộp.","detailEn":"Chấp thuận chính thức của chủ đầu tư hoặc giám sát công trường sau khi xem xét kế hoạch thi công, đề xuất thay đổi hoặc vật liệu do nhà thầu nộp. Có nhiều hạng mục không được thi công nếu không có phê duyệt.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Chấp thuận","summary3":"Bên đặt hàng chấp nhận đề xuất và kế hoạch","detail3":"Người thi công trình bày kế hoạch thi công, phương án thay đổi, vật liệu để chủ đầu tư và giám sát viên thẩm tra và chính thức chấp thuận. Có nhiều hạng mục không được phép tiến hành thi công nếu chưa có sự chấp thuận.","caption3":"","images":[]},{"rowNum":71,"id":"070","catCode":"CAT05","nameJa":"近隣対応","readingJa":"きんりんたいおう","summaryJa":"工事現場近くの住民への説明・配慮","detailJa":"工事に伴う騒音・振動・通行規制・粉塵等で影響を受ける近隣住民に対し、事前説明・苦情対応・工法配慮などを行うこと。","nameFr":"Neighborhood Relations","summaryFr":"Explaining construction impacts to nearby residents and addressing their concerns.","detailFr":"Providing prior explanations, responding to complaints, and considering construction methods for nearby residents who are affected by construction-related noise, vibration, traffic restrictions, and dust.","nameEn":"Quan hệ với cư dân lân cận","summaryEn":"Giải thích tác động xây dựng cho cư dân gần đó và giải quyết các mối lo ngại của họ.","detailEn":"Cung cấp giải thích trước, phản hồi khiếu nại và xem xét phương pháp xây dựng cho cư dân gần đó bị ảnh hưởng bởi tiếng ồn, rung động, hạn chế giao thông và bụi liên quan đến xây dựng.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Ứng phó với khu vực lân cận","summary3":"Giải thích và quan tâm đối với cư dân sống gần công trường xây dựng","detail3":"Thực hiện việc giải thích trước, xử lý khiếu nại và chú ý đến phương pháp thi công đối với cư dân lân cận bị ảnh hưởng bởi tiếng ồn, rung động, hạn chế giao thông, bụi bặm và các tác động khác phát sinh từ công trình xây dựng.","caption3":"","images":[]},{"rowNum":72,"id":"071","catCode":"CAT05","nameJa":"交通規制","readingJa":"こうつうきせい","summaryJa":"工事に伴う道路の通行制限","detailJa":"工事のために道路の一部または全部を通行止め・片側交互通行・速度制限などの規制を行うこと。所轄警察署への申請・許可が必要。","nameFr":"Traffic Control","summaryFr":"Restricting road traffic due to construction work.","detailFr":"Implementing restrictions such as road closures, alternating one-lane traffic, and speed limits on part or all of a road for construction purposes. Application to and permission from the local police station is required.","nameEn":"Kiểm soát giao thông","summaryEn":"Hạn chế giao thông đường bộ do công việc xây dựng.","detailEn":"Thực hiện các hạn chế như đóng cửa đường, luân phiên giao thông một làn và giới hạn tốc độ trên một phần hoặc toàn bộ đường cho mục đích xây dựng. Cần phải nộp đơn và được cấp phép từ đồn cảnh sát địa phương.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Quản lý giao thông","summary3":"Hạn chế giao thông đường bộ do thi công","detail3":"Việc thực hiện các biện pháp quy định như cấm đường một phần hoặc toàn bộ, giao thông luân phiên một chiều, hạn chế tốc độ trên đường do thi công. Cần phải nộp đơn xin phép và được cơ quan cảnh sát có thẩm quyền cấp phép.","caption3":"","images":[]},{"rowNum":73,"id":"072","catCode":"CAT05","nameJa":"占用許可","readingJa":"せんようきょか","summaryJa":"道路・河川などを一時的に使う許可","detailJa":"工事のために道路・河川・公園等の公共用地を一時的に使用（占有）するために、管理者（道路管理者・河川管理者等）から取得する許可。","nameFr":"Occupancy Permit","summaryFr":"A permit to temporarily use public land such as roads or rivers for construction.","detailFr":"A permit obtained from the administrator (road administrator, river administrator, etc.) to temporarily use (occupy) public land such as roads, rivers, and parks for construction purposes.","nameEn":"Giấy phép sử dụng tạm thời","summaryEn":"Giấy phép sử dụng tạm thời đất công như đường hoặc sông cho công trình xây dựng.","detailEn":"Giấy phép được lấy từ người quản lý (người quản lý đường, người quản lý sông, v.v.) để tạm thời sử dụng (chiếm dụng) đất công như đường, sông và công viên cho mục đích xây dựng.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Giấy phép chiếm dụng","summary3":"Giấy phép sử dụng tạm thời đường bộ, sông ngòi và các công trình khác","detail3":"Giấy phép thu được từ cơ quan quản lý (cơ quan quản lý đường bộ, cơ quan quản lý sông ngòi, v.v.) để sử dụng (chiếm dụng) tạm thời các khu đất công cộng như đường bộ, sông ngòi, công viên, v.v. phục vụ cho mục đích thi công.","caption3":"","images":[]},{"rowNum":74,"id":"073","catCode":"CAT05","nameJa":"関係機関","readingJa":"かんけいきかん","summaryJa":"工事に関わる役所・電力・水道会社など","detailJa":"工事に関係する行政機関・公益事業者・地権者等の総称。電力会社・ガス会社・水道局・警察・隣接工事業者などが含まれる。","nameFr":"Related Agencies","summaryFr":"Government offices, utility companies, and other organizations related to the construction.","detailFr":"A general term for government agencies, public utility operators, and landowners related to the construction. Includes electric power companies, gas companies, water authorities, police, and adjacent construction companies.","nameEn":"Các cơ quan liên quan","summaryEn":"Các văn phòng chính phủ, công ty tiện ích và các tổ chức khác liên quan đến công trình xây dựng.","detailEn":"Thuật ngữ chung cho các cơ quan chính phủ, nhà khai thác tiện ích công cộng và chủ đất liên quan đến xây dựng. Bao gồm công ty điện lực, công ty gas, cơ quan nước, cảnh sát và công ty xây dựng liền kề.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Cơ quan liên quan","summary3":"Các cơ quan chính quyền, công ty điện lực, công ty cấp nước và các đơn vị khác liên quan đến công trình xây dựng","detail3":"Thuật ngữ chung chỉ các cơ quan hành chính, doanh nghiệp công ích, chủ đất và các bên liên quan khác có liên quan đến công trình. Bao gồm các công ty điện lực, công ty gas, cục cấp nước, cảnh sát, các nhà thầu xây dựng kề cận và các đối tượng tương tự.","caption3":"","images":[]},{"rowNum":75,"id":"074","catCode":"CAT05","nameJa":"地元説明","readingJa":"じもとせつめい","summaryJa":"工事内容を地域住民に説明すること","detailJa":"工事着工前に、工事の目的・内容・期間・影響（騒音・通行規制等）を地域住民に説明する説明会。理解と協力を得ることが目的。","nameFr":"Community Explanation Meeting","summaryFr":"An explanatory meeting with local residents before construction begins.","detailFr":"A meeting held before construction begins to explain the purpose, content, duration, and impacts (noise, traffic restrictions, etc.) of the construction to local residents. The purpose is to gain understanding and cooperation.","nameEn":"Họp giải thích cộng đồng","summaryEn":"Cuộc họp giải thích với cư dân địa phương trước khi xây dựng bắt đầu.","detailEn":"Cuộc họp được tổ chức trước khi xây dựng bắt đầu để giải thích mục đích, nội dung, thời gian và tác động (tiếng ồn, hạn chế giao thông, v.v.) của công trình cho cư dân địa phương. Mục đích là để được hiểu và hợp tác.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Giải thích địa phương","summary3":"Giải thích nội dung công trình cho người dân địa phương","detail3":"Cuộc họp thuyết minh nhằm giải thích cho cư dân địa phương về mục đích, nội dung, thời gian và tác động của công trình (tiếng ồn, hạn chế giao thông, v.v.) trước khi khởi công. Mục đích là để có được sự hiểu biết và hợp tác.","caption3":"","images":[]},{"rowNum":76,"id":"075","catCode":"CAT05","nameJa":"苦情対応","readingJa":"くじょうたいおう","summaryJa":"工事への不満・クレームへの対応","detailJa":"工事に関して近隣住民・通行者等から寄せられた苦情・クレームを誠実に受け付け、原因調査・対策・報告を行う対応活動。","nameFr":"Complaint Handling","summaryFr":"Sincerely receiving and responding to complaints from nearby residents about construction.","detailFr":"An activity of sincerely receiving complaints and claims from nearby residents and passers-by regarding construction, and conducting cause investigation, countermeasures, and reporting.","nameEn":"Xử lý khiếu nại","summaryEn":"Tiếp nhận và phản hồi thành thật các khiếu nại từ cư dân gần đó về công trình xây dựng.","detailEn":"Hoạt động tiếp nhận thành thật các khiếu nại từ cư dân gần đó và người qua lại liên quan đến xây dựng, và tiến hành điều tra nguyên nhân, biện pháp đối phó và báo cáo.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Xử lý khiếu nại","summary3":"Ứng phó với sự bất mãn và khiếu nại về công trình xây dựng","detail3":"Hoạt động ứng phó bao gồm tiếp nhận một cách chân thành các khiếu nại và phàn nàn từ cư dân lân cận, người qua lại và những người khác liên quan đến công trình, sau đó tiến hành điều tra nguyên nhân, đưa ra biện pháp đối phó và báo cáo.","caption3":"","images":[]},{"rowNum":77,"id":"076","catCode":"CAT05","nameJa":"書類提出","readingJa":"しょるいていしゅつ","summaryJa":"必要な文書を発注者などに提出すること","detailJa":"施工計画書・品質管理記録・出来形記録・完成図書など、工事に必要な書類を発注者・監督員に期日通りに提出する作業。","nameFr":"Document Submission","summaryFr":"Submitting required documents such as construction plans and quality records to the client.","detailFr":"The work of submitting required construction documents on time to the client and site supervisor, including construction plans, quality management records, as-built records, and completion documents.","nameEn":"Nộp tài liệu","summaryEn":"Nộp các tài liệu bắt buộc như kế hoạch xây dựng và hồ sơ chất lượng cho chủ đầu tư.","detailEn":"Công việc nộp kịp thời các tài liệu xây dựng cần thiết cho chủ đầu tư và giám sát công trường, bao gồm kế hoạch thi công, hồ sơ quản lý chất lượng, hồ sơ hoàn công và tài liệu nghiệm thu.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Nộp hồ sơ","summary3":"Nộp các tài liệu cần thiết cho chủ đầu tư và các bên liên quan","detail3":"Công việc nộp đúng hạn cho chủ đầu tư và cán bộ giám sát các tài liệu cần thiết cho công trình như sổ kế hoạch thi công, hồ sơ quản lý chất lượng, hồ sơ ghi nhận kết quả thực hiện, hồ sơ hoàn thành và các tài liệu khác.","caption3":"","images":[]},{"rowNum":78,"id":"077","catCode":"CAT06","nameJa":"環境管理","readingJa":"かんきょうかんり","summaryJa":"工事による環境への影響を管理すること","detailJa":"工事に伴う騒音・振動・粉塵・水質汚濁・廃棄物等の環境への影響を最小限に抑えるための計画・実施・記録の活動。","nameFr":"Environmental Management","summaryFr":"Planning and implementing measures to minimize environmental impacts from construction.","detailFr":"Activities of planning, implementing, and recording measures to minimize environmental impacts from construction such as noise, vibration, dust, water pollution, and waste.","nameEn":"Quản lý môi trường","summaryEn":"Lập kế hoạch và thực hiện các biện pháp để giảm thiểu tác động môi trường từ xây dựng.","detailEn":"Các hoạt động lập kế hoạch, thực hiện và ghi lại các biện pháp để giảm thiểu tác động môi trường từ xây dựng như tiếng ồn, rung động, bụi, ô nhiễm nước và chất thải.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Quản lý môi trường","summary3":"Quản lý tác động đến môi trường do thi công gây ra","detail3":"Các hoạt động lập kế hoạch, thực hiện và ghi chép nhằm giảm thiểu tối đa tác động đến môi trường như tiếng ồn, rung động, bụi, ô nhiễm chất lượng nước, chất thải và các yếu tố khác phát sinh trong quá trình thi công.","caption3":"","images":[]},{"rowNum":79,"id":"078","catCode":"CAT06","nameJa":"騒音対策","readingJa":"そうおんたいさく","summaryJa":"工事の音を抑える対策","detailJa":"重機・杭打ち機・コンプレッサー等の作業騒音を低減するための措置。防音シート設置・低騒音型機械の使用・作業時間帯の制限などがある。","nameFr":"Noise Control Measures","summaryFr":"Measures to reduce construction noise from machinery and equipment.","detailFr":"Measures to reduce work noise from heavy machinery, pile drivers, compressors, and other equipment. Includes installing soundproofing sheets, using low-noise machinery, and restricting working hours.","nameEn":"Biện pháp kiểm soát tiếng ồn","summaryEn":"Các biện pháp giảm tiếng ồn xây dựng từ máy móc và thiết bị.","detailEn":"Các biện pháp giảm tiếng ồn công việc từ máy móc hạng nặng, máy đóng cọc, máy nén khí và các thiết bị khác. Bao gồm lắp đặt tấm cách âm, sử dụng máy móc ít ồn và hạn chế giờ làm việc.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Biện pháp chống ồn","summary3":"Các biện pháp giảm tiếng ồn trong thi công","detail3":"Các biện pháp giảm tiếng ồn từ máy móc hạng nặng, máy đóng cọc, máy nén khí và các thiết bị thi công khác. Bao gồm việc lắp đặt tấm cách âm, sử dụng máy móc loại ít tiếng ồn, hạn chế thời gian thi công.","caption3":"","images":[]},{"rowNum":80,"id":"079","catCode":"CAT06","nameJa":"振動対策","readingJa":"しんどうたいさく","summaryJa":"工事の振動を抑える対策","detailJa":"重機や杭打ち工事による地盤振動を低減するための措置。振動の小さい工法の選択・作業速度の調整・近隣への事前通知などがある。","nameFr":"Vibration Control Measures","summaryFr":"Measures to reduce ground vibration caused by construction machinery.","detailFr":"Measures to reduce ground vibration caused by heavy machinery and pile driving work. Includes selecting low-vibration construction methods, adjusting work speed, and giving prior notice to neighbors.","nameEn":"Biện pháp kiểm soát rung động","summaryEn":"Các biện pháp giảm rung động nền đất do máy móc xây dựng.","detailEn":"Các biện pháp giảm rung động nền đất do máy móc hạng nặng và công việc đóng cọc. Bao gồm lựa chọn phương pháp xây dựng ít rung, điều chỉnh tốc độ công việc và thông báo trước cho cư dân lân cận.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Biện pháp chống rung động","summary3":"Các biện pháp kiểm soát rung động trong thi công","detail3":"Các biện pháp giảm thiểu rung động nền đất do máy móc hạng nặng và công trình đóng cọc gây ra. Bao gồm lựa chọn công pháp có rung động nhỏ, điều chỉnh tốc độ thi công, thông báo trước cho khu vực lân cận.","caption3":"","images":[]},{"rowNum":81,"id":"080","catCode":"CAT06","nameJa":"粉塵対策","readingJa":"ふんじんたいさく","summaryJa":"土埃・粉塵を抑える対策（散水など）","detailJa":"掘削・整地・重機走行等で発生する粉塵（土埃）を抑制するための措置。散水・防塵ネット・車両タイヤ洗浄などがある。","nameFr":"Dust Control Measures","summaryFr":"Measures to suppress dust generated during excavation and earth-moving.","detailFr":"Measures to suppress dust generated during excavation, grading, and heavy machinery operation. Includes water sprinkling, dust prevention nets, and vehicle tire washing.","nameEn":"Biện pháp kiểm soát bụi","summaryEn":"Các biện pháp ngăn chặn bụi phát sinh trong quá trình đào đất và san lấp mặt bằng.","detailEn":"Các biện pháp ngăn chặn bụi phát sinh trong quá trình đào đất, san lấp và vận hành máy móc hạng nặng. Bao gồm phun nước, lưới chống bụi và rửa lốp xe.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Biện pháp phòng chống bụi","summary3":"Các biện pháp kiểm soát bụi đất và bụi mịn (như phun nước, v.v.)","detail3":"Các biện pháp để kiểm soát bụi (bụi đất) phát sinh từ việc đào đất, san lấp mặt bằng, di chuyển máy móc hạng nặng, v.v. Bao gồm tưới nước, lưới chống bụi, rửa lốp xe và các biện pháp khác.","caption3":"","images":[]},{"rowNum":82,"id":"081","catCode":"CAT06","nameJa":"水質汚濁","readingJa":"すいしつおだく","summaryJa":"工事による川・水路の水の汚染","detailJa":"工事で発生する濁水・油・コンクリート廃液などが川や水路に流入し、水質を悪化させること。法律で防止措置が義務付けられている。","nameFr":"Water Pollution","summaryFr":"Contamination of rivers and channels by turbid water and waste fluids from construction.","detailFr":"The deterioration of water quality when turbid water, oil, concrete waste liquids, and other substances generated by construction flow into rivers and channels. Prevention measures are legally mandated.","nameEn":"Ô nhiễm nước","summaryEn":"Ô nhiễm sông và kênh do nước đục và chất thải lỏng từ xây dựng.","detailEn":"Sự suy giảm chất lượng nước khi nước đục, dầu, chất thải lỏng bê tông và các chất khác phát sinh từ xây dựng chảy vào sông và kênh. Các biện pháp phòng ngừa được pháp luật quy định bắt buộc.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Ô nhiễm chất lượng nước","summary3":"Ô nhiễm nước sông, kênh rạch do thi công xây dựng","detail3":"Nước thải đục, dầu, nước thải bê tông và các chất thải khác phát sinh từ công trình xây dựng chảy vào sông hoặc kênh rạch, làm suy giảm chất lượng nước. Pháp luật quy định bắt buộc phải có các biện pháp phòng ngừa.","caption3":"","images":[]},{"rowNum":83,"id":"082","catCode":"CAT06","nameJa":"濁水処理","readingJa":"だくすいしょり","summaryJa":"工事で出た濁った水を処理すること","detailJa":"掘削・コンクリート打設等で発生する土粒子・セメント分を含む濁水を、沈殿池や凝集沈殿装置で処理して基準値以下にしてから排出する作業。","nameFr":"Turbid Water Treatment","summaryFr":"Treating construction wastewater containing soil particles and cement before discharge.","detailFr":"Processing turbid water containing soil particles and cement components generated from excavation and concrete placement using sedimentation ponds or coagulation-sedimentation equipment, reducing concentrations below standard values before discharge.","nameEn":"Xử lý nước đục","summaryEn":"Xử lý nước thải xây dựng chứa hạt đất và xi măng trước khi xả.","detailEn":"Xử lý nước đục chứa hạt đất và thành phần xi măng phát sinh từ đào đất và đổ bê tông bằng ao lắng hoặc thiết bị keo tụ lắng, giảm nồng độ xuống dưới giá trị tiêu chuẩn trước khi xả.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Xử lý nước thải","summary3":"Xử lý nước đục phát sinh từ công trình xây dựng","detail3":"Công việc xử lý nước thải đục chứa các hạt đất và thành phần xi măng phát sinh từ việc đào đất, đổ bê tông, v.v. bằng bể lắng hoặc thiết bị keo tụ lắng để đạt dưới giá trị tiêu chuẩn trước khi xả thải.","caption3":"","images":[]},{"rowNum":84,"id":"083","catCode":"CAT06","nameJa":"産業廃棄物","readingJa":"さんぎょうはいきぶつ","summaryJa":"工事で出るゴミ・廃材（産廃）","detailJa":"建設工事で発生するコンクリートがら・木くず・廃プラスチック・汚泥等の廃棄物。廃棄物処理法に基づき適正に処分しなければならない。","nameFr":"Industrial Waste","summaryFr":"Waste materials generated from construction such as concrete debris and wood scraps.","detailFr":"Waste materials generated from construction work such as concrete rubble, wood scraps, waste plastics, and sludge. Must be properly disposed of in accordance with the Waste Disposal Law.","nameEn":"Chất thải công nghiệp","summaryEn":"Vật liệu thải từ xây dựng như mảnh bê tông và vụn gỗ.","detailEn":"Vật liệu thải phát sinh từ công trình xây dựng như mảnh bê tông, vụn gỗ, nhựa thải và bùn. Phải xử lý đúng cách theo Luật Xử lý Chất thải.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Chất thải công nghiệp","summary3":"Rác thải và vật liệu phế thải từ công trình xây dựng (chất thải công nghiệp)","detail3":"Chất thải phát sinh từ công trình xây dựng như phế liệu bê tông, mảnh vụn gỗ, nhựa thải, bùn thải, v.v. Phải được xử lý thích hợp theo Luật Xử lý Chất thải.","caption3":"","images":[]},{"rowNum":85,"id":"084","catCode":"CAT06","nameJa":"廃棄物処理","readingJa":"はいきぶつしょり","summaryJa":"産廃を適切に処分すること","detailJa":"工事で発生した産業廃棄物を分別・収集し、許可を受けた処理業者に委託して適正に処分・リサイクルすること。マニフェスト（管理票）の作成が義務。","nameFr":"Waste Disposal","summaryFr":"Properly sorting and disposing of industrial waste through licensed contractors.","detailFr":"Sorting and collecting industrial waste generated from construction and entrusting it to licensed treatment contractors for proper disposal and recycling. Creating a manifest (management form) is mandatory.","nameEn":"Xử lý chất thải","summaryEn":"Phân loại và xử lý đúng cách chất thải công nghiệp thông qua nhà thầu được cấp phép.","detailEn":"Phân loại và thu gom chất thải công nghiệp phát sinh từ xây dựng và ủy thác cho nhà thầu xử lý được cấp phép để xử lý và tái chế đúng cách. Việc tạo bảng kê (mẫu quản lý) là bắt buộc.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Xử lý chất thải","summary3":"Xử lý chất thải công nghiệp một cách thích hợp","detail3":"Phân loại, thu gom chất thải công nghiệp phát sinh từ công trình xây dựng và ủy thác cho đơn vị xử lý có giấy phép để xử lý và tái chế một cách thích hợp. Việc lập phiếu quản lý chất thải (manifest) là bắt buộc.","caption3":"","images":[]},{"rowNum":86,"id":"085","catCode":"CAT06","nameJa":"緑化","readingJa":"りょっか","summaryJa":"工事後に草や木を植えること","detailJa":"工事で裸地になった法面・盛土面・切取り面などに植生を施し、緑を回復させる工事。侵食防止・景観回復・生態系保護の効果がある。","nameFr":"Revegetation","summaryFr":"Planting grass and trees on bare ground after construction.","detailFr":"Construction that restores vegetation on slopes, embankment faces, and cut faces left bare by construction. Has effects of erosion prevention, landscape restoration, and ecosystem protection.","nameEn":"Phủ xanh","summaryEn":"Trồng cỏ và cây trên đất trống sau xây dựng.","detailEn":"Công trình khôi phục thực vật trên mái dốc, mặt đắp và mặt cắt bị để trần sau xây dựng. Có tác dụng ngăn xói mòn, phục hồi cảnh quan và bảo vệ hệ sinh thái.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Xanh hóa","summary3":"Trồng cỏ và cây xanh sau khi thi công","detail3":"Công trình thực hiện việc trồng thảm thực vật trên các mái taluy, mặt đắp, mặt đào đã trở thành đất trống do thi công để phục hồi cảnh quan xanh. Có tác dụng ngăn chặn xói mòn, phục hồi cảnh quan và bảo vệ hệ sinh thái.","caption3":"","images":[]},{"rowNum":87,"id":"086","catCode":"CAT06","nameJa":"侵食防止","readingJa":"しんしょくぼうし","summaryJa":"雨などによる土の流出を防ぐ対策","detailJa":"雨水・流水による土砂の流出・法面崩壊を防ぐための工法。植生工・コンクリート吹付け・シート養生・土留め工などがある。","nameFr":"Erosion Control","summaryFr":"Measures to prevent soil loss and slope collapse due to rain and water flow.","detailFr":"Construction methods to prevent soil erosion and slope collapse due to rainwater and water flow. Includes vegetation methods, shotcrete, sheet protection, and retaining wall construction.","nameEn":"Kiểm soát xói mòn","summaryEn":"Các biện pháp ngăn mất đất và sụp đổ mái dốc do mưa và dòng chảy.","detailEn":"Các phương pháp xây dựng để ngăn xói mòn đất và sụp đổ mái dốc do nước mưa và dòng chảy. Bao gồm phương pháp thực vật, bê tông phun, bảo vệ tấm và xây dựng tường chắn đất.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Chống xói mòn","summary3":"Các biện pháp ngăn chặn xói mòn đất do mưa và các nguyên nhân khác","detail3":"Công pháp để ngăn chặn xói mòn đất cát và sạt lở mái taluy do nước mưa và dòng chảy. Bao gồm công trình trồng thảm thực vật, phun bê tông, che phủ bằng tấm bạt, công trình gia cố giữ đất.","caption3":"","images":[]},{"rowNum":88,"id":"087","catCode":"CAT06","nameJa":"生態系保護","readingJa":"せいたいけいほご","summaryJa":"動植物への影響を最小限にすること","detailJa":"工事による動植物の生息地・繁殖地への影響を調査し、工法・施工時期の変更・移植・保護区設置等で影響を最小化すること。","nameFr":"Ecosystem Protection","summaryFr":"Minimizing construction impacts on habitats of animals and plants.","detailFr":"Investigating construction impacts on habitats and breeding grounds of animals and plants, and minimizing impacts by changing construction methods, construction timing, transplanting, and setting up protected areas.","nameEn":"Bảo vệ hệ sinh thái","summaryEn":"Giảm thiểu tác động xây dựng đến môi trường sống của động vật và thực vật.","detailEn":"Điều tra tác động xây dựng đến môi trường sống và khu vực sinh sản của động vật và thực vật, và giảm thiểu tác động bằng cách thay đổi phương pháp xây dựng, thời điểm thi công, cấy ghép và thiết lập khu bảo vệ.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Bảo vệ hệ sinh thái","summary3":"Giảm thiểu tác động đến động thực vật","detail3":"Điều tra tác động của công trình đối với môi trường sống và nơi sinh sản của động thực vật, giảm thiểu tác động thông qua việc thay đổi phương pháp thi công, thời gian thi công, di trồng, thiết lập khu bảo tồn, v.v.","caption3":"","images":[]},{"rowNum":89,"id":"088","catCode":"CAT07","nameJa":"現場代理人","readingJa":"げんばだいりにん","summaryJa":"現場の責任者（所長など）","detailJa":"建設業法に基づき、受注者（建設会社）が工事現場に常駐させる責任者。発注者との協議・現場全体の管理・緊急時対応の権限を持つ。","nameFr":"Site Manager","summaryFr":"The on-site representative of the contractor responsible for all site management.","detailFr":"A responsible person that the contractor (construction company) keeps permanently stationed at the construction site based on the Construction Business Law. Has authority for consultations with the client, overall site management, and emergency response.","nameEn":"Quản lý công trường","summaryEn":"Đại diện tại công trường của nhà thầu chịu trách nhiệm về tất cả quản lý công trường.","detailEn":"Người phụ trách mà nhà thầu (công ty xây dựng) duy trì thường trú tại công trường xây dựng theo Luật Kinh doanh Xây dựng. Có thẩm quyền tư vấn với chủ đầu tư, quản lý toàn bộ công trường và phản hồi khẩn cấp.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Đại diện công trường","summary3":"Người chịu tr책nhiệm tại hiện trường (Giám đốc công trường, v.v...)","detail3":"Theo Luật Xây dựng, là người chịu tr책nhiệm mà bên nhận thầu (công ty xây dựng) bố trí thường trú tại công trường thi công. Có thẩm quyền đàm phán với chủ đầu tư, quản lý toàn bộ công trường và ứng phó trong tình huống khẩn cấp.","caption3":"","images":[]},{"rowNum":90,"id":"089","catCode":"CAT07","nameJa":"主任技術者","readingJa":"しゅにんぎじゅつしゃ","summaryJa":"技術的な管理責任者","detailJa":"建設業法で義務付けられた工事現場の技術的な管理責任者。施工計画・施工品質・安全管理を技術面でリードする有資格者。","nameFr":"Chief Engineer","summaryFr":"The technically qualified manager responsible for technical supervision at the construction site.","detailFr":"A technically qualified manager required by the Construction Business Law to be responsible for technical supervision at construction sites. A qualified person who leads construction planning, quality, and safety management from a technical perspective.","nameEn":"Kỹ sư trưởng","summaryEn":"Người quản lý có trình độ kỹ thuật chịu trách nhiệm giám sát kỹ thuật tại công trường.","detailEn":"Người quản lý có trình độ kỹ thuật được Luật Kinh doanh Xây dựng yêu cầu phải chịu trách nhiệm giám sát kỹ thuật tại công trường xây dựng. Người có chuyên môn dẫn dắt lập kế hoạch thi công, chất lượng và quản lý an toàn từ góc độ kỹ thuật.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Kỹ sư trưởng","summary3":"Người chịu trách nhiệm quản lý kỹ thuật","detail3":"Người chịu tr책nhiệm quản lý kỹ thuật tại công trường xây dựng được quy định bắt buộc theo Luật Xây dựng. Là người có trình độ chuyên môn dẫn dắt về mặt kỹ thuật trong kế hoạch thi công, chất lượng thi công và quản lý an toàn.","caption3":"","images":[]},{"rowNum":91,"id":"090","catCode":"CAT07","nameJa":"職長","readingJa":"しょくちょう","summaryJa":"作業員グループのリーダー","detailJa":"複数の作業員をまとめ、日常の作業指示・安全管理・品質確認を行う現場の中間管理職。職長教育の受講が義務付けられている。","nameFr":"Foreman","summaryFr":"A site supervisor who leads a group of workers and manages daily work and safety.","detailFr":"A mid-level site manager who leads multiple workers and handles daily work instructions, safety management, and quality confirmation. Attendance at foreman training is mandatory.","nameEn":"Trưởng nhóm","summaryEn":"Giám sát công trường dẫn dắt một nhóm công nhân và quản lý công việc và an toàn hàng ngày.","detailEn":"Người quản lý cấp trung tại công trường dẫn dắt nhiều công nhân và xử lý hướng dẫn công việc hàng ngày, quản lý an toàn và xác nhận chất lượng. Bắt buộc phải tham dự đào tạo trưởng nhóm.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Trưởng ca","summary3":"Trưởng nhóm công nhân","detail3":"Cấp quản lý trung gian tại hiện trường có nhiệm vụ quản lý nhiều công nhân, thực hiện chỉ đạo công việc hàng ngày, quản lý an toàn và kiểm tra chất lượng. Bắt buộc phải tham gia khóa đào tạo trưởng ca.","caption3":"","images":[]},{"rowNum":92,"id":"091","catCode":"CAT07","nameJa":"重機","readingJa":"じゅうき","summaryJa":"ショベルカーなど大型機械の総称","detailJa":"建設工事に使用する大型機械の総称。バックホウ・ブルドーザー・ダンプトラック・クレーン・振動ローラーなど多種類がある。","nameFr":"Heavy Equipment","summaryFr":"A general term for large construction machinery such as excavators and bulldozers.","detailFr":"A general term for large machinery used in construction work. Includes many types such as backhoes, bulldozers, dump trucks, cranes, and vibratory rollers.","nameEn":"Thiết bị hạng nặng","summaryEn":"Thuật ngữ chung cho máy móc xây dựng lớn như máy đào và máy ủi.","detailEn":"Thuật ngữ chung cho máy móc lớn sử dụng trong công trình xây dựng. Bao gồm nhiều loại như máy đào, máy ủi, xe ben, cần cẩu và máy lu rung.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Máy móc hạng nặng","summary3":"Tên gọi chung cho các máy móc lớn như máy xúc","detail3":"Thuật ngữ chung chỉ các loại máy móc lớn được sử dụng trong công trình xây dựng. Có nhiều loại như máy xúc, máy ủi, xe tải ben, cần cẩu, lu rung, v.v.","caption3":"","images":[]},{"rowNum":93,"id":"092","catCode":"CAT07","nameJa":"バックホウ","readingJa":"ばっくほう","summaryJa":"ショベルカー（掘削に使う代表的な重機）","detailJa":"油圧で動くアーム・バケットを使って地面を掘削する建設機械。土の掘削・積込・整地・法面整形など多目的に使用される最も一般的な重機。","nameFr":"Backhoe (Excavator)","summaryFr":"A hydraulic excavator using an arm and bucket to dig the ground.","detailFr":"A construction machine that uses hydraulically powered arms and buckets to excavate the ground. The most common heavy machinery, used for multiple purposes including soil excavation, loading, grading, and slope shaping.","nameEn":"Máy đào (Máy xúc)","summaryEn":"Máy đào thủy lực sử dụng cần và gầu để đào đất.","detailEn":"Máy xây dựng sử dụng cần và gầu được điều khiển bằng thủy lực để đào đất. Máy móc hạng nặng phổ biến nhất, được sử dụng cho nhiều mục đích bao gồm đào đất, bốc hàng, san lấp và tạo hình mái dốc.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Máy xúc đào","summary3":"Máy xúc (máy móc hạng nặng đại diện được sử dụng để đào)","detail3":"Máy xây dựng sử dụng cánh tay thủy lực và gầu để đào đất. Đây là loại máy công trình phổ biến nhất được sử dụng đa mục đích như đào đất, xúc chất, san lấp mặt bằng, và tạo hình mái taluy.","caption3":"","images":[]},{"rowNum":94,"id":"093","catCode":"CAT07","nameJa":"ダンプトラック","readingJa":"だんぷとらっく","summaryJa":"荷台が傾いて土を降ろせるトラック","detailJa":"油圧で荷台を傾けて積み荷（土砂・砕石・廃棄物等）を降ろせるトラック。掘削土の搬出・材料の搬入に欠かせない。","nameFr":"Dump Truck","summaryFr":"A truck with a hydraulic tilting bed for unloading soil and materials.","detailFr":"A truck that can unload cargo (soil, crushed stone, waste, etc.) by tilting the bed hydraulically. Essential for transporting excavated soil out of the site and bringing materials in.","nameEn":"Xe ben","summaryEn":"Xe tải có thùng xe nghiêng thủy lực để đổ đất và vật liệu.","detailEn":"Xe tải có thể đổ hàng hóa (đất, đá dăm, chất thải, v.v.) bằng cách nghiêng thùng xe bằng thủy lực. Thiết yếu để vận chuyển đất đào ra khỏi công trường và đưa vật liệu vào.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Xe tải tự đổ","summary3":"Xe tải có thùng xe nghiêng để đổ đất","detail3":"Xe tải có thể nghiêng thùng xe bằng hệ thống thủy lực để đổ hàng hóa (đất cát, đá dăm, chất thải, v.v.). Không thể thiếu trong việc vận chuyển đất đào và vận chuyển vật liệu vào công trình.","caption3":"","images":[]},{"rowNum":95,"id":"094","catCode":"CAT07","nameJa":"振動ローラー","readingJa":"しんどうろーらー","summaryJa":"振動で地面を締め固める機械","detailJa":"鉄製ドラムに振動を与えながら走行し、盛土・路盤・アスファルトを効果的に締め固める建設機械。大面積の転圧に最適。","nameFr":"Vibratory Roller","summaryFr":"A compaction machine that uses vibration to compact soil, road base, and asphalt.","detailFr":"A construction machine that travels while applying vibration to steel drums to effectively compact embankment, road base, and asphalt. Best suited for rolling large areas.","nameEn":"Máy lu rung","summaryEn":"Máy đầm chặt sử dụng rung động để đầm chặt đất, nền đường và nhựa đường.","detailEn":"Máy xây dựng di chuyển trong khi tác động rung động vào trống thép để đầm chặt hiệu quả nền đắp, nền đường và nhựa đường. Phù hợp nhất để lu lèn diện tích lớn.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Máy lu rung","summary3":"Máy đầm nén đất bằng rung động","detail3":"Máy xây dựng chạy trên mặt đường với trống thép tạo rung động để đầm nén hiệu quả đất đắp, nền đường và asphalt. Tối ưu cho việc lu lèn diện tích lớn.","caption3":"","images":[]},{"rowNum":96,"id":"095","catCode":"CAT07","nameJa":"保護具","readingJa":"ほごぐ","summaryJa":"ヘルメット・安全帯などの安全装備","detailJa":"作業員を労働災害から守るための個人用安全装備の総称。ヘルメット・安全帯（ハーネス）・安全靴・保護メガネ・防塵マスク等がある。着用が法律で義務付けられている。","nameFr":"Protective Equipment (PPE)","summaryFr":"Personal safety gear such as helmets and safety harnesses to protect workers.","detailFr":"A general term for personal safety equipment to protect workers from occupational accidents. Includes helmets, safety harnesses, safety shoes, protective goggles, and dust masks. Wearing is legally mandated.","nameEn":"Thiết bị bảo hộ cá nhân (PPE)","summaryEn":"Dụng cụ an toàn cá nhân như mũ bảo hiểm và dây an toàn để bảo vệ công nhân.","detailEn":"Thuật ngữ chung cho thiết bị an toàn cá nhân để bảo vệ công nhân khỏi tai nạn lao động. Bao gồm mũ bảo hiểm, dây an toàn, giày bảo hộ, kính bảo hộ và khẩu trang chống bụi. Đeo là bắt buộc theo pháp luật.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Thiết bị bảo hộ","summary3":"Thiết bị an toàn như mũ bảo hiểm, dây an toàn","detail3":"Thuật ngữ chung chỉ các thiết bị an toàn cá nhân nhằm bảo vệ công nhân khỏi tai nạn lao động. Bao gồm mũ bảo hiểm, dây an toàn (harness), giày bảo hộ, kính bảo hộ, khẩu trang chống bụi, v.v. Việc đeo các thiết bị này được quy định bắt buộc bởi pháp luật.","caption3":"","images":[]},{"rowNum":97,"id":"096","catCode":"CAT07","nameJa":"ヒヤリハット","readingJa":"ひやりはっと","summaryJa":"事故になりそうだった危険な出来事","detailJa":"実際の事故には至らなかったが、一歩間違えば事故になっていた危険な出来事や状態のこと。報告・共有し再発防止に活かす重要な安全情報。","nameFr":"Near Miss","summaryFr":"A dangerous incident that almost resulted in an accident but did not.","detailFr":"A dangerous incident or condition that did not actually result in an accident, but could have if handled differently. Important safety information that should be reported, shared, and used to prevent recurrence.","nameEn":"Suýt tai nạn","summaryEn":"Sự cố nguy hiểm suýt dẫn đến tai nạn nhưng không xảy ra.","detailEn":"Sự cố hoặc điều kiện nguy hiểm không thực sự dẫn đến tai nạn, nhưng có thể xảy ra nếu xử lý khác đi. Thông tin an toàn quan trọng cần được báo cáo, chia sẻ và sử dụng để ngăn ngừa tái phát.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Sự cố suýt xảy ra","summary3":"Sự kiện nguy hiểm có thể dẫn đến tai nạn","detail3":"Những sự kiện hoặc tình trạng nguy hiểm mà tuy không dẫn đến tai nạn thực tế nhưng chỉ cần một bước sai lầm nhỏ là có thể gây ra tai nạn. Đây là thông tin an toàn quan trọng cần được báo cáo, chia sẻ và áp dụng để ngăn ngừa tái diễn.","caption3":"","images":[]},{"rowNum":98,"id":"097","catCode":"CAT07","nameJa":"不陸","readingJa":"ふりく","summaryJa":"地面や施工面の凸凹・不均一","detailJa":"道路・床・法面などの仕上げ面に生じた凸凹・波打ちの状態。舗装の不陸は走行性・排水性を悪化させるため、規定の平坦性基準内に収める必要がある。","nameFr":"Unevenness / Irregularity","summaryFr":"Bumps and unevenness on road surfaces or construction surfaces.","detailFr":"Bumps and undulations on finished surfaces such as roads, floors, and slopes. Pavement unevenness deteriorates ride quality and drainage, so it must be kept within specified flatness standards.","nameEn":"Không bằng phẳng","summaryEn":"Gồ ghề và không đồng đều trên bề mặt đường hoặc bề mặt xây dựng.","detailEn":"Gồ ghề và gợn sóng trên các bề mặt hoàn thiện như đường, sàn và mái dốc. Sự không bằng phẳng của mặt đường làm giảm chất lượng lái xe và thoát nước, vì vậy phải giữ trong tiêu chuẩn độ phẳng quy định.","image":"","captionJa":"","captionFr":"","captionEn":"1","published":"","name3":"Độ không bằng phẳng","summary3":"Độ lồi lõm và không đều của mặt đất hoặc bề mặt thi công","detail3":"Tình trạng gồ ghề, lượn sóng xuất hiện trên bề mặt hoàn thiện của đường bộ, sàn, mái dốc. Do độ không bằng phẳng của lớp phủ đường làm giảm tính năng lưu thông và thoát nước, cần phải đảm bảo nằm trong tiêu chuẩn độ phẳng quy định.","caption3":"","images":[]},{"rowNum":99,"id":"098","catCode":"CAT07","nameJa":"竣工","readingJa":"しゅんこう","summaryJa":"工事が完成すること","detailJa":"すべての工事が設計通りに完了し、発注者の完成検査に合格した状態。竣工後、引渡し手続きを経て発注者に施設が引き渡される。","nameFr":"Completion","summaryFr":"The state where all construction work is finished and has passed the final inspection.","detailFr":"The state where all construction has been completed as designed and has passed the client's completion inspection. After completion, the facility is handed over to the client through the handover procedure.","nameEn":"Hoàn công","summaryEn":"Trạng thái khi tất cả công việc xây dựng đã hoàn thành và vượt qua kiểm tra nghiệm thu cuối cùng.","detailEn":"Trạng thái khi tất cả công trình đã hoàn thành theo thiết kế và vượt qua kiểm tra nghiệm thu cuối cùng của chủ đầu tư. Sau khi hoàn công, cơ sở được const CATEGORIES = [{"rowNum":2,"code":"CAT01","nameJa":"測量","reading":"そくりょう","nameFr":"Surveying","nameEn":"Khảo sát","order":1,"name3":"Đo đạc"},{"rowNum":3,"code":"CAT02","nameJa":"施工準備","reading":"せこうじゅんび","nameFr":"Construction Preparation","nameEn":"Chuẩn bị thi công","order":2,"name3":"Chuẩn bị thi công"},{"rowNum":4,"code":"CAT03","nameJa":"実施工","reading":"じっせこう","nameFr":"Construction Work","nameEn":"Thi công thực tế","order":3,"name3":"Thi công thực tế"},{"rowNum":5,"code":"CAT04","nameJa":"施工管理","reading":"せこうかんり","nameFr":"Construction Management","nameEn":"Quản lý thi công","order":4,"name3":"Quản lý thi công"},{"rowNum":6,"code":"CAT05","nameJa":"対外調整","reading":"たいがいちょうせい","nameFr":"External Coordination","nameEn":"Phối hợp bên ngoài","order":5,"name3":"Điều chỉnh đối ngoại"},{"rowNum":7,"code":"CAT06","nameJa":"環境","reading":"かんきょう","nameFr":"Environment","nameEn":"Môi trường","order":6,"name3":"Môi trường"},{"rowNum":8,"code":"CAT07","nameJa":"その他","reading":"そのほか","nameFr":"Others","nameEn":"Khác","order":7,"name3":"Khác"}];
const CAT_MAP = {};
CATEGORIES.forEach(c => { CAT_MAP[c.code] = c; });

let currentLang = 'ja';
let currentCat = 'all';
let openTermId = null;      // t.id of the currently open term (persists across renders)
let openDetailOpen = false; // whether detail panel is also open (persists across renders)
let _termIdByItemId = {};   // itemId → t.id, rebuilt each renderTerms

function setLang(lang, btn) {
  // Case 3: Same language clicked while something is open → close and reset to list
  if (lang === currentLang && openTermId !== null) {
    openTermId = null;
    openDetailOpen = false;
    renderCatFilter();
    renderTerms();
    return;
  }
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const si = document.getElementById('search-input');
  si.placeholder = lang === 'ja' ? 'キーワードで検索...' : 'Search...';
  renderCatFilter();
  renderTerms();
}

function catName(cat) {
  if (!cat) return '';
  if (currentLang === 'lang3') return cat.name3 || cat.nameEn || cat.nameJa;
  if (currentLang === 'en') return cat.nameEn || cat.nameJa;
  return cat.nameJa;
}
function termName(t) {
  if (currentLang === 'lang3') return t.name3 || t.nameEn || t.nameJa;
  if (currentLang === 'en') return t.nameEn || t.nameJa;
  return t.nameJa;
}
function termSummary(t) {
  if (currentLang === 'lang3') return t.summary3 || t.summaryEn || t.summaryJa;
  if (currentLang === 'en') return t.summaryEn || t.summaryJa;
  return t.summaryJa;
}
function termDetail(t) {
  if (currentLang === 'lang3') return t.detail3 || t.detailEn || t.detailJa;
  if (currentLang === 'en') return t.detailEn || t.detailJa;
  return t.detailJa;
}
function termCaption(t) {
  if (currentLang === 'lang3') return t.caption3 || t.captionEn || t.captionJa;
  if (currentLang === 'en') return t.captionEn || t.captionJa;
  return t.captionJa;
}

function kanaToRomaji(str) {
  if (!str) return '';
  const pairs = [
    ['きゃ','kya'],['きゅ','kyu'],['きょ','kyo'],
    ['しゃ','sha'],['しゅ','shu'],['しょ','sho'],
    ['ちゃ','cha'],['ちゅ','chu'],['ちょ','cho'],
    ['にゃ','nya'],['にゅ','nyu'],['にょ','nyo'],
    ['ひゃ','hya'],['ひゅ','hyu'],['ひょ','hyo'],
    ['みゃ','mya'],['みゅ','myu'],['みょ','myo'],
    ['りゃ','rya'],['りゅ','ryu'],['りょ','ryo'],
    ['ぎゃ','gya'],['ぎゅ','gyu'],['ぎょ','gyo'],
    ['じゃ','ja'],['じゅ','ju'],['じょ','jo'],
    ['あ','a'],['い','i'],['う','u'],['え','e'],['お','o'],
    ['か','ka'],['き','ki'],['く','ku'],['け','ke'],['こ','ko'],
    ['さ','sa'],['し','shi'],['す','su'],['せ','se'],['そ','so'],
    ['た','ta'],['ち','chi'],['つ','tsu'],['て','te'],['と','to'],
    ['な','na'],['に','ni'],['ぬ','nu'],['ね','ne'],['の','no'],
    ['は','ha'],['ひ','hi'],['ふ','fu'],['へ','he'],['ほ','ho'],
    ['ま','ma'],['み','mi'],['む','mu'],['め','me'],['も','mo'],
    ['や','ya'],['ゆ','yu'],['よ','yo'],
    ['ら','ra'],['り','ri'],['る','ru'],['れ','re'],['ろ','ro'],
    ['わ','wa'],['を','wo'],['ん','n'],
    ['が','ga'],['ぎ','gi'],['ぐ','gu'],['げ','ge'],['ご','go'],
    ['ざ','za'],['じ','ji'],['ず','zu'],['ぜ','ze'],['ぞ','zo'],
    ['だ','da'],['ぢ','di'],['づ','du'],['で','de'],['ど','do'],
    ['ば','ba'],['び','bi'],['ぶ','bu'],['べ','be'],['ぼ','bo'],
    ['ぱ','pa'],['ぴ','pi'],['ぷ','pu'],['ぺ','pe'],['ぽ','po'],
    ['ぁ','a'],['ぃ','i'],['ぅ','u'],['ぇ','e'],['ぉ','o'],
    ['ー','-'],
  ];
  let result = '';
  let i = 0;
  while (i < str.length) {
    if (str[i] === 'っ') {
      const rest = str.slice(i + 1);
      let nextRomaji = '';
      for (const [k, v] of pairs) {
        if (rest.startsWith(k)) { nextRomaji = v; break; }
      }
      result += nextRomaji ? nextRomaji[0] : 't';
      i++;
      continue;
    }
    let matched = false;
    for (const [k, v] of pairs) {
      if (str.startsWith(k, i)) {
        result += v;
        i += k.length;
        matched = true;
        break;
      }
    }
    if (!matched) { result += str[i]; i++; }
  }
  return result;
}

function sortTerms(arr) {
  return [...arr].sort((a, b) => {
    if (currentLang === 'ja') {
      const ra = a.readingJa || termName(a), rb = b.readingJa || termName(b);
      return ra.localeCompare(rb, 'ja');
    }
    return termName(a).localeCompare(termName(b));
  });
}

function renderCatFilter() {
  const btnAll = document.getElementById('btn-all');
  if (btnAll) btnAll.classList.toggle('active', currentCat === 'all');
  const sel = document.getElementById('categorySelect');
  if (sel) {
    const placeholder = currentLang === 'ja' ? '分野を選ぶ' : 'Choose category';
    let html = '<option value="">' + placeholder + '</option>';
    CATEGORIES.forEach(function(c) {
      html += '<option value="' + esc2(c.code) + '"' + (currentCat === c.code ? ' selected' : '') + '>' + esc2(catName(c)) + '</option>';
    });
    sel.innerHTML = html;
    console.log('ドロップダウン選択肢数:', sel.options.length);
  }
}

function setCat(code) {
  currentCat = code;
  openTermId = null;
  openDetailOpen = false;
  renderCatFilter();
  renderTerms();
}

function setCatFromSelect(sel) {
  setCat(sel.value || 'all');
}

function renderTerms() {
  const q = document.getElementById('search-input').value.toLowerCase();
  let filtered = TERMS.filter(t => {
    if (currentCat !== 'all' && t.catCode !== currentCat) return false;
    if (!q) return true;
    return (termName(t) + termSummary(t) + (t.readingJa || '') + (t.name3 || '') + (t.nameEn || '')).toLowerCase().includes(q);
  });
  const sorted = sortTerms(filtered);
  const wrap = document.getElementById('term-list-wrap');
  const countEl = document.getElementById('result-count');

  const labels = { ja: '件の用語', en: ' term(s)', lang3: ' term(s)' };
  countEl.textContent = sorted.length + (labels[currentLang] || '件');

  if (sorted.length === 0) {
    wrap.innerHTML = `<div class="empty"><div class="icon">🔍</div><div>${currentLang === 'ja' ? '該当する用語が見つかりません' : 'No terms found'}</div></div>`;
    return;
  }

  const detailLabel = currentLang === 'ja' ? '詳細を見る' : 'Show details';
  const detailCloseLabel = currentLang === 'ja' ? '閉じる' : 'Close';

  _termIdByItemId = {};
  const items = sorted.map((t, i) => {
    const itemId = 'item-' + i;
    _termIdByItemId[itemId] = t.id;
    const name = esc2(termName(t));
    const romajiHtml = (currentLang === 'ja' && t.readingJa) ? `<span class="term-romaji">${esc2(kanaToRomaji(t.readingJa))}</span>` : '';
    const summary = esc2(termSummary(t));
    const detail = termDetail(t);
    const caption = termCaption(t);

    let detailHtml = '';
    const hasImages = t.images && t.images.length > 0;
    if (detail || hasImages || t.image) {
      const detailText = detail ? '<div class="term-detail-text">' + esc2(detail) + '</div>' : '';
      const cap = esc2(caption);
      let imgHtml = '';
      if (hasImages) {
        const imgTitle = currentLang === 'ja' ? '図・写真' : 'Figures and Photos';
        imgHtml = '<div class="term-images-section"><div class="term-images-title">' + esc2(imgTitle) + '</div>';
        t.images.forEach(function(img) {
          imgHtml += '<div class="term-image-item"><img class="term-detail-image" src="' + img.dataUrl + '" alt="' + cap + '">';
          if (cap) imgHtml += '<div class="term-detail-caption">' + cap + '</div>';
          imgHtml += '</div>';
        });
        imgHtml += '</div>';
      } else if (t.image) {
        imgHtml = '<div class="term-image-item"><img class="term-detail-image" src="images/' + esc2(t.image) + '" alt="' + cap + '" loading="lazy">';
        if (cap) imgHtml += '<div class="term-detail-caption">' + cap + '</div>';
        imgHtml += '</div>';
      }
      detailHtml = `
        <button class="detail-toggle" id="dtbtn-${itemId}" onclick="toggleDetail('${itemId}')">
          <span id="dtlabel-${itemId}">${detailLabel}</span>
          <span class="detail-arrow">▼</span>
        </button>
        <div class="term-detail-panel" id="detail-${itemId}">
          ${detailText}
          ${imgHtml}
        </div>`;
    }

    return `<div class="term-item" id="${itemId}">
      <button class="term-toggle" id="toggle-${itemId}" onclick="toggleSummary('${itemId}')">
        <span class="term-toggle-text">${name}${romajiHtml}</span>
        <span class="term-arrow">▼</span>
      </button>
      <div class="term-summary-panel" id="summary-${itemId}">
        <div class="term-summary-text">${summary}</div>
        ${detailHtml}
      </div>
    </div>`;
  });

  wrap.innerHTML = `<div class="term-list">${items.join('')}</div>`;

  // Restore open state after re-render (e.g. after language switch)
  if (openTermId !== null) {
    const restoredItemId = Object.keys(_termIdByItemId).find(k => _termIdByItemId[k] === openTermId);
    if (restoredItemId) {
      _applyOpenState(restoredItemId);
    } else {
      openTermId = null;
      openDetailOpen = false;
    }
  }
}

function _applyOpenState(itemId) {
  const toggleBtn = document.getElementById('toggle-' + itemId);
  const summaryPanel = document.getElementById('summary-' + itemId);
  if (!toggleBtn || !summaryPanel) return;
  toggleBtn.classList.add('open');
  summaryPanel.classList.add('open');
  if (openDetailOpen) {
    const btn = document.getElementById('dtbtn-' + itemId);
    const panel = document.getElementById('detail-' + itemId);
    const labelEl = document.getElementById('dtlabel-' + itemId);
    const closeLabel = currentLang === 'ja' ? '閉じる' : 'Close';
    if (btn && panel) {
      btn.classList.add('open');
      panel.classList.add('open');
      if (labelEl) labelEl.textContent = closeLabel;
    }
  }
  const el = document.getElementById(itemId);
  if (el) el.scrollIntoView({ behavior: 'instant', block: 'center' });
}

function toggleSummary(itemId) {
  const toggleBtn = document.getElementById('toggle-' + itemId);
  const summaryPanel = document.getElementById('summary-' + itemId);

  // Close previously open summary (and its detail) if a different term
  if (openTermId !== null && _termIdByItemId[itemId] !== openTermId) {
    const prevItemId = Object.keys(_termIdByItemId).find(k => _termIdByItemId[k] === openTermId);
    if (prevItemId) {
      const prevToggle = document.getElementById('toggle-' + prevItemId);
      const prevPanel = document.getElementById('summary-' + prevItemId);
      if (prevToggle) prevToggle.classList.remove('open');
      if (prevPanel) prevPanel.classList.remove('open');
      if (openDetailOpen) {
        const prevDetailBtn = document.getElementById('dtbtn-' + prevItemId);
        const prevDetail = document.getElementById('detail-' + prevItemId);
        if (prevDetailBtn) prevDetailBtn.classList.remove('open');
        if (prevDetail) prevDetail.classList.remove('open');
      }
    }
    openDetailOpen = false;
  }

  const isOpen = summaryPanel.classList.toggle('open');
  toggleBtn.classList.toggle('open', isOpen);
  openTermId = isOpen ? _termIdByItemId[itemId] : null;

  // If closing summary, also close detail
  if (!isOpen && openDetailOpen) {
    const detailBtn = document.getElementById('dtbtn-' + itemId);
    const detailPanel = document.getElementById('detail-' + itemId);
    if (detailBtn) detailBtn.classList.remove('open');
    if (detailPanel) detailPanel.classList.remove('open');
    openDetailOpen = false;
  }

  if (isOpen) {
    setTimeout(() => toggleBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 10);
  }
}

function toggleDetail(itemId) {
  const btn = document.getElementById('dtbtn-' + itemId);
  const panel = document.getElementById('detail-' + itemId);
  const labelEl = document.getElementById('dtlabel-' + itemId);
  const detailLabel = currentLang === 'ja' ? '詳細を見る' : 'Show details';
  const detailCloseLabel = currentLang === 'ja' ? '閉じる' : 'Close';

  const isOpen = panel.classList.toggle('open');
  btn.classList.toggle('open', isOpen);
  if (labelEl) labelEl.textContent = isOpen ? detailCloseLabel : detailLabel;
  openDetailOpen = isOpen;
}

function esc2(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

renderTerms();
