<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hanayama Construction Glossary ver.2</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #1a56db;
      --bg: #f3f4f6;
      --card: #fff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --radius: 10px;
    }
    body { font-family: 'Hiragino Kaku Gothic ProN','Noto Sans JP','Meiryo',sans-serif; font-size: 16px; line-height: 1.6; color: var(--text); background: var(--bg); }

    /* Sticky header wrapper */
    .site-header { position: sticky; top: 0; z-index: 100; }

    /* Header */
    header { background: var(--primary); color: white; padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .header-inner { max-width: 720px; margin: 0 auto; }
    header h1 { font-size: 1.25rem; font-weight: 700; }
    .lang-bar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .lang-btn { padding: 6px 18px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.5); background: transparent; color: white; font-size: 0.9rem; font-weight: 600; cursor: pointer; min-height: 44px; transition: background 0.2s; }
    .lang-btn.active { background: white; color: var(--primary); border-color: white; }
    .lang-btn:hover:not(.active) { background: rgba(255,255,255,0.15); }

    /* Controls bar */
    .controls-bar { background: white; border-bottom: 1px solid var(--border); padding: 8px 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .controls-inner { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
    .filter-group { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .filter-all-btn { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border); background: white; font-size: 0.9rem; cursor: pointer; min-height: 44px; white-space: nowrap; font-weight: 600; transition: all 0.15s; }
    .filter-all-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .filter-all-btn:hover:not(.active) { border-color: var(--primary); color: var(--primary); }
    #categorySelect { display: inline-block; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: white; font-size: 0.9rem; cursor: pointer; min-height: 44px; min-width: 120px; color: var(--text); }
    #categorySelect:focus { outline: 2px solid var(--primary); outline-offset: 0; }
    .search-box { position: relative; flex: 1; min-width: 0; }
    .search-box input { width: 100%; padding: 10px 16px 10px 40px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; min-height: 44px; background: white; }
    .search-box input:focus { border-color: var(--primary); }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 1rem; pointer-events: none; }

    /* Main */
    main { max-width: 720px; margin: 0 auto; padding: 20px 16px 80px; }

    /* Result count */
    .result-count { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; }

    /* Term list */
    .term-list { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: white; }

    /* Term item */
    .term-item { border-bottom: 1px solid var(--border); }
    .term-item:last-child { border-bottom: none; }

    /* Term name button */
    .term-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 14px 16px;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      min-height: 44px;
      gap: 12px;
      transition: background 0.15s;
    }
    .term-toggle:hover { background: #f9fafb; }
    .term-toggle.open { background: #eff6ff; color: var(--primary); }
    .term-toggle-text { flex: 1; display: flex; flex-direction: column; align-items: flex-start; }
    .term-reading { font-size: 0.8rem; font-weight: 400; color: var(--muted); margin-left: 6px; }
    .term-romaji { font-size: 12px; color: #888; font-weight: 400; }
    .term-arrow { font-size: 0.75rem; color: var(--muted); flex-shrink: 0; transition: transform 0.2s; }
    .term-toggle.open .term-arrow { transform: rotate(180deg); color: var(--primary); }

    /* Summary panel */
    .term-summary-panel { display: none; padding: 0 16px 16px; border-top: 1px solid #dbeafe; background: #f8faff; }
    .term-summary-panel.open { display: block; }
    .term-summary-text { font-size: 0.97rem; line-height: 1.75; color: #374151; padding-top: 14px; }

    /* Detail toggle button */
    .detail-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      padding: 10px 18px;
      border: 2px solid var(--primary);
      border-radius: 999px;
      background: white;
      color: var(--primary);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
      transition: background 0.15s;
    }
    .detail-toggle:hover { background: #eff6ff; }
    .detail-arrow { font-size: 0.7rem; transition: transform 0.2s; }
    .detail-toggle.open .detail-arrow { transform: rotate(180deg); }

    /* Detail panel */
    .term-detail-panel { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .term-detail-panel.open { display: block; }
    .term-detail-text { font-size: 0.95rem; line-height: 1.8; color: #374151; white-space: pre-wrap; }
    .term-detail-image { width: 100%; border-radius: 8px; margin-top: 16px; display: block; }
    .term-detail-caption { font-size: 0.82rem; color: var(--muted); text-align: center; margin-top: 6px; }

    /* Empty state */
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); background: white; border: 1px solid var(--border); border-radius: var(--radius); }
    .empty .icon { font-size: 2.5rem; margin-bottom: 12px; }

    /* Images in detail panel */
    .term-images-section { margin-top: 16px; }
    .term-images-title { font-size: 0.78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
    .term-image-item { margin-bottom: 16px; }
    .term-image-item:last-child { margin-bottom: 0; }
    .term-detail-caption { font-size: 14px; color: var(--muted); text-align: center; margin-top: 6px; }

    @media (max-width: 600px) {
      header h1 { font-size: 1.1rem; }
      main { padding: 16px 12px 60px; }
      .term-toggle { padding: 13px 14px; }
      .term-summary-panel { padding: 0 14px 14px; }
    }
  </style>
</head>
<body>

<div class="site-header">
  <header>
    <div class="header-inner">
      <h1>Hanayama Construction Glossary ver.2</h1>
      <div class="lang-bar">
        <button class="lang-btn active" onclick="setLang('ja', this)">JPN</button>
        <button class="lang-btn" onclick="setLang('en', this)">ENG</button>
        <button class="lang-btn" onclick="setLang('lang3', this)">VIE</button>
        <button class="lang-btn" onclick="setLang('lang4', this)">IND</button>
      </div>
    </div>
  </header>
  <div class="controls-bar">
    <div class="controls-inner">
      <div class="filter-group">
        <button class="filter-all-btn active" id="btn-all" onclick="setCat('all')">All</button>
        <select id="categorySelect" onchange="setCatFromSelect(this)">
          <option value="">分野を選ぶ</option>
        </select>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="search" id="search-input" placeholder="キーワードで検索..." oninput="renderTerms()" autocomplete="off">
      </div>
    </div>
  </div>
</div>

<main>
  <div class="result-count" id="result-count"></div>
  <div id="term-list-wrap"></div>
</main>

<script>
const TERMS = [{"rowNum":2,"id":"001","catCode":"CAT01","nameJa":"測量","readingJa":"そくりょう","summaryJa":"距離・角度・高さを測る全般作業","detailJa":"建設工事の基礎となる作業。トランシットやレベルを使い、現場の位置・形状・高低差を正確に計測する。測量の精度が工事全体の品質を左右する。","nameEn":"Surveying","summaryEn":"The process of measuring distances, angles, and elevations at a construction site.","detailEn":"Surveying is the foundation of all construction work. Using instruments like transits and levels, workers accurately measure the position, shape, and elevation differences at the site. The accuracy of surveying determines the quality of the entire construction project.","image":"","captionJa":"","captionEn":"","published":"","name3":"Khảo sát","summary3":"Công việc đo đạc khoảng cách, góc độ và độ cao tại công trường.","detail3":"Khảo sát là nền tảng của mọi công trình xây dựng. Sử dụng các thiết bị như máy kinh vĩ và máy thủy bình, công nhân đo chính xác vị trí, hình dạng và chênh lệch độ cao tại công trường. Độ chính xác của khảo sát quyết định chất lượng toàn bộ công trình.","caption3":"","name4":"Survei","summary4":"Pekerjaan umum mengukur jarak, sudut, dan ketinggian","detail4":"Pekerjaan yang menjadi dasar dari konstruksi bangunan. Menggunakan transit dan waterpass untuk mengukur secara akurat posisi, bentuk, dan perbedaan ketinggian di lokasi kerja. Akurasi survei menentukan kualitas keseluruhan pekerjaan konstruksi.","caption4":"","images":[]},{"rowNum":3,"id":"002","catCode":"CAT01","nameJa":"基準点","readingJa":"きじゅんてん","summaryJa":"測量の基準となる固定点","detailJa":"国や自治体が設置した測量の起点となる固定標識。三角点・水準点などがある。工事測量はこの点を基準に行われるため、位置を変えてはならない。","nameEn":"Reference Point","summaryEn":"A fixed point established as the starting reference for surveying.","detailEn":"A fixed marker established by the government or local authorities as the origin for surveying. Types include triangulation points and benchmark points. All construction surveying is based on these points, so they must never be moved.","image":"","captionJa":"","captionEn":"","published":"","name3":"Điểm chuẩn","summary3":"Điểm cố định được thiết lập làm cơ sở tham chiếu cho công tác khảo sát.","detail3":"Mốc cố định do chính phủ hoặc chính quyền địa phương lập ra làm điểm xuất phát cho công tác khảo sát. Bao gồm điểm tam giác và điểm mốc cao độ. Mọi khảo sát xây dựng đều dựa trên các điểm này nên tuyệt đối không được di chuyển.","caption3":"","name4":"Titik referensi","summary4":"Titik tetap yang menjadi acuan survei","detail4":"Penanda tetap yang dijadikan titik awal pengukuran yang didirikan oleh negara atau pemerintah daerah. Terdapat titik triangulasi, titik ketinggian, dan lain-lain. Karena pengukuran konstruksi dilakukan berdasarkan titik ini, posisinya tidak boleh dipindahkan.","caption4":"","images":[]},{"rowNum":4,"id":"003","catCode":"CAT01","nameJa":"水準測量","readingJa":"すいじゅんそくりょう","summaryJa":"高さの差を測る作業","detailJa":"レベル（水準儀）と標尺を使い、2点間の高低差を測定する作業。道路・水路の勾配設計や排水計画に欠かせない基本測量。","nameEn":"Leveling Survey","summaryEn":"The process of measuring elevation differences between two points.","detailEn":"Using a level and a leveling rod, workers measure the difference in elevation between two points. This is an essential basic survey for designing road and drainage channel gradients and planning drainage systems.","image":"","captionJa":"","captionEn":"","published":"","name3":"Đo thủy chuẩn","summary3":"Quá trình đo chênh lệch độ cao giữa hai điểm.","detail3":"Sử dụng máy thủy bình và mia, công nhân đo chênh lệch độ cao giữa hai điểm. Đây là phép đo cơ bản thiết yếu để thiết kế độ dốc đường và kênh thoát nước.","caption3":"","name4":"Leveling","summary4":"Pekerjaan mengukur perbedaan ketinggian","detail4":"Pekerjaan mengukur perbedaan ketinggian antara dua titik menggunakan level (waterpass) dan rambu ukur. Survei dasar yang sangat diperlukan untuk desain kemiringan jalan dan saluran air serta perencanaan drainase.","caption4":"","images":[]},{"rowNum":5,"id":"004","catCode":"CAT01","nameJa":"トランシット","readingJa":"とらんしっと","summaryJa":"角度を測る測量機械","detailJa":"水平角・鉛直角を高精度で測定できる光学機器。杭の位置出しや構造物の方向確認に使用する。現在はトータルステーションが主流。","nameEn":"Transit (Theodolite)","summaryEn":"An optical surveying instrument for measuring horizontal and vertical angles.","detailEn":"An optical instrument capable of measuring horizontal and vertical angles with high precision. Used for staking out pile positions and confirming the direction of structures. The total station is now the mainstream replacement.","image":"","captionJa":"","captionEn":"","published":"","name3":"Máy kinh vĩ","summary3":"Thiết bị khảo sát quang học để đo góc ngang và góc đứng.","detail3":"Thiết bị quang học có thể đo góc ngang và góc đứng với độ chính xác cao. Dùng để xác định vị trí cọc và kiểm tra hướng của kết cấu. Hiện nay máy toàn đạc là thiết bị chủ đạo.","caption3":"","name4":"Transit","summary4":"Alat ukur survei untuk mengukur sudut","detail4":"Instrumen optik yang dapat mengukur sudut horizontal dan sudut vertikal dengan presisi tinggi. Digunakan untuk penentuan posisi patok dan konfirmasi arah struktur bangunan. Saat ini total station menjadi yang utama digunakan.","caption4":"","images":[]},{"rowNum":6,"id":"005","catCode":"CAT01","nameJa":"レベル","readingJa":"れべる","summaryJa":"高さを測る機械（水準儀）","detailJa":"望遠鏡と気泡管を組み合わせた測量機器で、水平視準線を使って高低差を測定する。道路・堤防・水路の高さ管理に広く使われる。","nameEn":"Level (Leveling Instrument)","summaryEn":"A surveying instrument combining a telescope and bubble tube to measure elevation differences.","detailEn":"A surveying instrument combining a telescope and bubble tube that measures elevation differences using a horizontal line of sight. Widely used for managing the height of roads, embankments, and water channels.","image":"","captionJa":"","captionEn":"","published":"","name3":"Máy thủy bình","summary3":"Thiết bị khảo sát kết hợp kính thiên văn và ống bọt nước để đo chênh lệch độ cao.","detail3":"Thiết bị khảo sát kết hợp kính thiên văn và ống bọt nước, đo chênh lệch độ cao bằng đường ngắm nằm ngang. Được sử dụng rộng rãi để quản lý độ cao của đường, đê và kênh nước.","caption3":"","name4":"Tingkat","summary4":"Mesin pengukur ketinggian (waterpass)","detail4":"Instrumen survei yang menggabungkan teleskop dan tabung gelembung udara, mengukur perbedaan ketinggian menggunakan garis bidik horizontal. Digunakan secara luas untuk pengelolaan ketinggian jalan, tanggul, dan saluran air.","caption4":"","images":[]},{"rowNum":7,"id":"006","catCode":"CAT01","nameJa":"丁張り","readingJa":"ちょうはり","summaryJa":"工事の位置・高さを示す木の枠組み","detailJa":"掘削や型枠設置の前に、設計通りの位置と高さを現地に示すために設ける仮設の木製枠組み。水糸を張って基準線とする。","nameEn":"Batter Boards","summaryEn":"Temporary wooden frames set up to mark the position and elevation of construction work.","detailEn":"Temporary wooden frames erected before excavation or formwork installation to indicate the designed position and height on site. String lines are stretched between them to serve as reference lines.","image":"","captionJa":"","captionEn":"","published":"","name3":"Khung định vị","summary3":"Khung gỗ tạm thời dựng lên để đánh dấu vị trí và độ cao của công trình.","detail3":"Khung gỗ tạm thời dựng lên trước khi đào đất hoặc lắp ván khuôn để chỉ rõ vị trí và độ cao thiết kế tại công trường. Dây căng được kéo giữa các khung để làm đường chuẩn.","caption3":"","name4":"Bowplank","summary4":"Kerangka kayu yang menunjukkan posisi dan ketinggian konstruksi","detail4":"Kerangka kayu sementara yang dipasang untuk menunjukkan posisi dan ketinggian sesuai desain di lokasi sebelum penggalian atau pemasangan bekisting. Benang air dipasang sebagai garis referensi.","caption4":"","images":[]},{"rowNum":8,"id":"007","catCode":"CAT01","nameJa":"杭打ち","readingJa":"くいうち","summaryJa":"測量の基点となる杭を地面に打つこと","detailJa":"測量した位置を現地に記録するため、木杭や鋼杭を地面に打ち込む作業。工事の基準点・境界点・中心線などを表示する。","nameEn":"Staking","summaryEn":"Driving stakes into the ground to mark surveyed positions.","detailEn":"The work of driving wooden or steel stakes into the ground to record surveyed positions on site. Used to mark reference points, boundary points, and centerlines of construction work.","image":"","captionJa":"","captionEn":"","published":"","name3":"Đóng cọc tiêu","summary3":"Đóng cọc xuống đất để đánh dấu các vị trí đã khảo sát.","detail3":"Công việc đóng cọc gỗ hoặc cọc thép xuống đất để ghi lại các vị trí đã khảo sát tại công trường. Dùng để đánh dấu điểm chuẩn, điểm ranh giới và đường tim công trình.","caption3":"","name4":"Pemancangan tiang","summary4":"Memasang patok yang menjadi titik referensi untuk pengukuran tanah ke dalam tanah","detail4":"Pekerjaan memasang patok kayu atau patok baja ke dalam tanah untuk mencatat posisi yang telah diukur di lokasi. Menunjukkan titik acuan konstruksi, titik batas, garis tengah, dan sebagainya.","caption4":"","images":[]},{"rowNum":9,"id":"008","catCode":"CAT01","nameJa":"縦断測量","readingJa":"じゅうだんそくりょう","summaryJa":"道路・水路に沿った高さの変化を測る","detailJa":"道路や水路の中心線に沿って一定間隔で高さを測定し、縦断面図を作成する作業。勾配の計算や土量算出に使用する。","nameEn":"Profile Survey","summaryEn":"Measuring elevation changes along the centerline of a road or channel.","detailEn":"Measuring elevations at regular intervals along the centerline of a road or water channel to create a longitudinal profile drawing. Used for calculating gradients and earthwork volumes.","image":"","captionJa":"","captionEn":"","published":"","name3":"Đo trắc dọc","summary3":"Đo sự thay đổi độ cao dọc theo đường tim của đường hoặc kênh.","detail3":"Đo độ cao tại các khoảng cách đều nhau dọc theo đường tim của đường hoặc kênh nước để tạo bản vẽ mặt cắt dọc. Dùng để tính độ dốc và khối lượng đất.","caption3":"","name4":"Survei longitudinal","summary4":"Mengukur perubahan ketinggian sepanjang jalan dan saluran air","detail4":"Pekerjaan mengukur ketinggian pada interval tertentu sepanjang garis tengah jalan atau saluran air, dan membuat gambar penampang memanjang. Digunakan untuk perhitungan kemiringan dan perhitungan volume tanah.","caption4":"","images":[]},{"rowNum":10,"id":"009","catCode":"CAT01","nameJa":"横断測量","readingJa":"おうだんそくりょう","summaryJa":"道路・水路に直角方向の断面を測る","detailJa":"道路や水路の中心線に直角な方向の断面形状を測定する作業。横断面図を基に土工数量を計算する。","nameEn":"Cross-Section Survey","summaryEn":"Measuring the cross-sectional shape perpendicular to a road or channel centerline.","detailEn":"Measuring the cross-sectional shape in a direction perpendicular to the centerline of a road or water channel. Cross-section drawings are used as the basis for calculating earthwork quantities.","image":"","captionJa":"","captionEn":"","published":"","name3":"Đo trắc ngang","summary3":"Đo hình dạng mặt cắt ngang vuông góc với đường tim của đường hoặc kênh.","detail3":"Đo hình dạng mặt cắt theo hướng vuông góc với đường tim của đường hoặc kênh nước. Bản vẽ mặt cắt ngang được dùng làm cơ sở tính toán khối lượng đất.","caption3":"","name4":"Survei Cross-Section","summary4":"Mengukur penampang melintang yang tegak lurus terhadap jalan dan saluran air","detail4":"Pekerjaan mengukur bentuk penampang melintang dalam arah tegak lurus terhadap garis tengah jalan atau saluran air. Menghitung volume pekerjaan tanah berdasarkan gambar penampang melintang.","caption4":"","images":[]},{"rowNum":11,"id":"010","catCode":"CAT01","nameJa":"座標","readingJa":"ざひょう","summaryJa":"位置を数値で表すX・Y・Z値","detailJa":"平面上の位置をX（東西）・Y（南北）の数値で、高さをZ値で表したもの。CADや測量データの基本単位。","nameEn":"Coordinates","summaryEn":"Numerical values (X, Y, Z) representing a position in space.","detailEn":"A position on a plane expressed numerically as X (east-west) and Y (north-south), with height expressed as a Z value. The basic unit of CAD and survey data.","image":"","captionJa":"","captionEn":"","published":"","name3":"Tọa độ","summary3":"Các giá trị số (X, Y, Z) biểu thị vị trí trong không gian.","detail3":"Vị trí trên mặt phẳng được biểu thị bằng số X (đông-tây) và Y (nam-bắc), với độ cao được biểu thị bằng giá trị Z. Đơn vị cơ bản của CAD và dữ liệu khảo sát.","caption3":"","name4":"Koordinat","summary4":"Nilai X, Y, Z yang menyatakan posisi dalam angka","detail4":"Representasi posisi pada bidang datar dengan nilai numerik X (timur-barat) dan Y (utara-selatan), serta ketinggian dengan nilai Z. Merupakan unit dasar data CAD dan survei.","caption4":"","images":[]},{"rowNum":12,"id":"011","catCode":"CAT01","nameJa":"標高","readingJa":"ひょうこう","summaryJa":"海面からの高さ（TP）","detailJa":"東京湾平均海面（T.P.=Tokyo Peil）を基準（0m）とした高さ。日本全国の高さはこの値で統一されている。","nameEn":"Elevation","summaryEn":"Height measured from mean sea level (T.P. = Tokyo Peil).","detailEn":"Height referenced from the mean sea level of Tokyo Bay (T.P. = Tokyo Peil), set at 0 m. Heights across Japan are unified using this value.","image":"","captionJa":"","captionEn":"","published":"","name3":"Cao độ","summary3":"Độ cao tính từ mực nước biển trung bình (T.P. = Tokyo Peil).","detail3":"Độ cao tính từ mực nước biển trung bình của vịnh Tokyo (T.P. = Tokyo Peil), lấy làm 0 m. Độ cao trên khắp Nhật Bản được thống nhất theo giá trị này.","caption3":"","name4":"Ketinggian","summary4":"Ketinggian dari permukaan laut (TP)","detail4":"Ketinggian berdasarkan permukaan laut rata-rata Teluk Tokyo (T.P.=Tokyo Peil) sebagai standar (0m). Ketinggian di seluruh Jepang telah diseragamkan menggunakan nilai ini.","caption4":"","images":[]},{"rowNum":13,"id":"012","catCode":"CAT01","nameJa":"視準","readingJa":"しじゅん","summaryJa":"測量機器で目標点を正確に狙うこと","detailJa":"トランシットやレベルの望遠鏡を使い、ターゲット（標尺・プリズム等）に正確に照準を合わせる操作。測量精度の根本となる基本動作。","nameEn":"Sighting","summaryEn":"The act of accurately aiming a surveying instrument at a target point.","detailEn":"The operation of accurately aligning the telescope of a transit or level with a target (leveling rod, prism, etc.). This is the fundamental action that determines surveying accuracy.","image":"","captionJa":"","captionEn":"","published":"","name3":"Ngắm chuẩn","summary3":"Hành động nhắm chính xác thiết bị khảo sát vào điểm mục tiêu.","detail3":"Thao tác căn chỉnh chính xác kính thiên văn của máy kinh vĩ hoặc máy thủy bình vào mục tiêu (mia, lăng kính, v.v.). Đây là thao tác cơ bản quyết định độ chính xác của khảo sát.","caption3":"","name4":"Visiasi","summary4":"Membidik titik target secara akurat dengan instrumen survei","detail4":"Operasi membidik target (rambu ukur, prisma, dll.) secara tepat menggunakan teropong transit atau waterpass. Tindakan dasar yang menjadi fondasi akurasi pengukuran dalam survei.","caption4":"","images":[]},{"rowNum":14,"id":"013","catCode":"CAT01","nameJa":"平板測量","readingJa":"へいばんそくりょう","summaryJa":"現地で直接図面を描く測量法","detailJa":"測量板・アリダード・巻尺を使い、現地で直接図面を描く測量方法。小規模現場の平面図作成に用いられる。","nameEn":"Plane Table Survey","summaryEn":"A surveying method where drawings are made directly on-site.","detailEn":"A surveying method using a plane table, alidade, and tape measure to draw maps directly in the field. Used for creating plan drawings of small-scale sites.","image":"","captionJa":"","captionEn":"","published":"","name3":"Đo bàn phẳng","summary3":"Phương pháp khảo sát vẽ bản đồ trực tiếp tại công trường.","detail3":"Phương pháp khảo sát sử dụng bàn phẳng, thước ngắm và thước dây để vẽ bản đồ trực tiếp tại hiện trường. Dùng để tạo bản vẽ mặt bằng cho các công trường quy mô nhỏ.","caption3":"","name4":"Survei Topografi","summary4":"Metode survei yang menggambar gambar teknik secara langsung di lokasi","detail4":"Metode survei yang menggunakan papan survei, alidade, dan pita ukur untuk menggambar langsung gambar teknik di lapangan. Digunakan untuk pembuatan denah pada lokasi berskala kecil.","caption4":"","images":[]},{"rowNum":15,"id":"014","catCode":"CAT02","nameJa":"施工計画書","readingJa":"せこうけいかくしょ","summaryJa":"工事の手順・方法をまとめた文書","detailJa":"工事の施工方法・工程・安全対策・品質管理などを体系的にまとめた計画書。着工前に発注者へ提出・承認を得る重要書類。","nameEn":"Construction Plan","summaryEn":"A document systematically summarizing construction methods, schedules, and safety measures.","detailEn":"A planning document that systematically summarizes construction methods, schedules, safety measures, and quality control. An important document that must be submitted to the client and approved before work begins.","image":"","captionJa":"","captionEn":"","published":"","name3":"Kế hoạch thi công","summary3":"Tài liệu tóm tắt có hệ thống về phương pháp, tiến độ và biện pháp an toàn xây dựng.","detail3":"Tài liệu kế hoạch tóm tắt có hệ thống về phương pháp thi công, tiến độ, biện pháp an toàn và kiểm soát chất lượng. Tài liệu quan trọng phải nộp cho chủ đầu tư và được phê duyệt trước khi bắt đầu công việc.","caption3":"","name4":"Rencana Pelaksanaan Konstruksi","summary4":"Dokumen yang merangkum prosedur dan metode konstruksi","detail4":"Dokumen perencanaan yang menyusun secara sistematis metode pelaksanaan konstruksi, proses kerja, langkah-langkah keselamatan, dan pengendalian kualitas. Dokumen penting yang harus diserahkan kepada pemesan dan mendapat persetujuan sebelum memulai pekerjaan konstruksi.","caption4":"","images":[]},{"rowNum":16,"id":"015","catCode":"CAT02","nameJa":"工程表","readingJa":"こうていひょう","summaryJa":"工事のスケジュール一覧表","detailJa":"工事の各作業をいつ・どの順序で行うかを示した工程管理ツール。バーチャートやネットワーク工程表が一般的。","nameEn":"Construction Schedule","summaryEn":"A schedule chart showing when and in what order each construction task will be performed.","detailEn":"A construction management tool showing when and in what order each construction task will be performed. Bar charts and network diagrams are commonly used formats.","image":"","captionJa":"","captionEn":"","published":"","name3":"Biểu đồ tiến độ","summary3":"Biểu đồ lịch trình cho thấy thứ tự và thời điểm thực hiện từng công việc xây dựng.","detail3":"Công cụ quản lý tiến độ xây dựng cho thấy thứ tự và thời điểm thực hiện từng công việc xây dựng. Biểu đồ thanh và sơ đồ mạng lưới là các định dạng thường dùng.","caption3":"","name4":"Jadwal kerja","summary4":"Daftar Jadwal Pekerjaan Konstruksi","detail4":"Alat manajemen jadwal yang menunjukkan kapan dan dalam urutan apa setiap pekerjaan konstruksi dilakukan. Bar chart dan network schedule diagram adalah yang umum digunakan.","caption4":"","images":[]},{"rowNum":17,"id":"016","catCode":"CAT02","nameJa":"安全計画","readingJa":"あんぜんけいかく","summaryJa":"事故防止のための取り組み計画","detailJa":"工事中の労働災害・第三者災害を防止するための具体的な安全対策をまとめた計画書。KY活動・保護具使用・危険箇所の管理方法などを含む。","nameEn":"Safety Plan","summaryEn":"A plan outlining specific safety measures to prevent accidents during construction.","detailEn":"A planning document summarizing specific safety measures to prevent occupational accidents and third-party incidents during construction. Includes KY activities, protective equipment use, and methods for managing hazardous areas.","image":"","captionJa":"","captionEn":"","published":"","name3":"Kế hoạch an toàn","summary3":"Kế hoạch phác thảo các biện pháp an toàn cụ thể để phòng ngừa tai nạn trong quá trình xây dựng.","detail3":"Tài liệu kế hoạch tóm tắt các biện pháp an toàn cụ thể để phòng ngừa tai nạn lao động và tai nạn bên thứ ba trong quá trình xây dựng. Bao gồm hoạt động KY, sử dụng thiết bị bảo hộ và phương pháp quản lý khu vực nguy hiểm.","caption3":"","name4":"Rencana Keselamatan","summary4":"Rencana Upaya Pencegahan Kecelakaan","detail4":"Rencana yang merangkum langkah-langkah keselamatan konkret untuk mencegah kecelakaan kerja dan kecelakaan pihak ketiga selama pelaksanaan konstruksi. Termasuk kegiatan KY (Kiken Yochi), penggunaan alat pelindung diri, dan metode pengelolaan area berbahaya.","caption4":"","images":[]},{"rowNum":18,"id":"017","catCode":"CAT02","nameJa":"仮設","readingJa":"かせつ","summaryJa":"工事中だけ一時的に設ける設備・建物","detailJa":"工事の期間中だけ使用する一時的な施設の総称。仮設事務所・仮設トイレ・仮設電力・仮設水道などがある。工事完了後は撤去する。","nameEn":"Temporary Facilities","summaryEn":"Facilities and structures set up temporarily only during construction.","detailEn":"A general term for temporary facilities used only during the construction period. Includes temporary offices, portable toilets, temporary power supply, and temporary water supply. All are removed after construction is complete.","image":"","captionJa":"","captionEn":"","published":"","name3":"Công trình tạm","summary3":"Cơ sở hạ tầng và công trình được dựng lên tạm thời chỉ trong thời gian thi công.","detail3":"Thuật ngữ chung cho các cơ sở tạm thời chỉ sử dụng trong thời gian xây dựng. Bao gồm văn phòng tạm, nhà vệ sinh di động, nguồn điện tạm và cấp nước tạm. Tất cả được tháo dỡ sau khi hoàn thành công trình.","caption3":"","name4":"Sementara","summary4":"Fasilitas dan bangunan yang dipasang sementara hanya selama masa konstruksi","detail4":"Istilah umum untuk fasilitas sementara yang digunakan hanya selama periode konstruksi. Termasuk kantor sementara, toilet sementara, listrik sementara, air sementara, dan lain-lain. Fasilitas ini akan dibongkar setelah konstruksi selesai.","caption4":"","images":[]},{"rowNum":19,"id":"018","catCode":"CAT02","nameJa":"仮囲い","readingJa":"かりがこい","summaryJa":"工事現場を囲む仮の柵やパネル","detailJa":"工事現場の周囲を囲んで第三者の立入りを防ぎ、安全を確保する仮設の囲い。鋼板パネル・フェンス・ネットなどが使われる。","nameEn":"Temporary Fence","summaryEn":"A temporary enclosure surrounding a construction site to prevent unauthorized entry.","detailEn":"A temporary enclosure surrounding a construction site to prevent third parties from entering and to ensure safety. Steel panels, fences, and nets are commonly used materials.","image":"","captionJa":"","captionEn":"","published":"","name3":"Hàng rào tạm","summary3":"Rào chắn tạm thời bao quanh công trường để ngăn người không có phận sự vào.","detail3":"Rào chắn tạm thời bao quanh công trường để ngăn bên thứ ba xâm nhập và đảm bảo an toàn. Tấm thép, hàng rào và lưới là vật liệu thường dùng.","caption3":"","name4":"Pagar sementara","summary4":"Pagar sementara atau panel yang mengelilingi lokasi konstruksi","detail4":"Pagar sementara yang memagari sekeliling lokasi konstruksi untuk mencegah masuknya pihak ketiga dan memastikan keamanan. Digunakan panel pelat baja, pagar, jaring, dan sebagainya.","caption4":"","images":[]},{"rowNum":20,"id":"019","catCode":"CAT02","nameJa":"資材搬入","readingJa":"しざいはんにゅう","summaryJa":"工事に使う材料を現場に運び込むこと","detailJa":"コンクリート・鋼材・砕石・パイプ等の工事資材をトラックで運搬し、現場に搬入する作業。搬入計画を立て、安全に行う必要がある。","nameEn":"Material Delivery","summaryEn":"Transporting construction materials to the site by truck.","detailEn":"The work of transporting construction materials such as concrete, steel, crushed stone, and pipes by truck to the construction site. A delivery plan must be prepared and carried out safely.","image":"","captionJa":"","captionEn":"","published":"","name3":"Vận chuyển vật liệu","summary3":"Vận chuyển vật liệu xây dựng đến công trường bằng xe tải.","detail3":"Công việc vận chuyển vật liệu xây dựng như bê tông, thép, đá dăm và ống bằng xe tải đến công trường. Cần lập kế hoạch vận chuyển và thực hiện an toàn.","caption3":"","name4":"Pengangkutan material","summary4":"Mengangkut material yang digunakan untuk konstruksi ke lokasi proyek","detail4":"Pekerjaan mengangkut material konstruksi seperti beton, baja, batu pecah, pipa, dan lain-lain menggunakan truk dan memasukkannya ke lokasi kerja. Perlu membuat rencana pemasukan material dan melaksanakannya dengan aman.","caption4":"","images":[]},{"rowNum":21,"id":"020","catCode":"CAT02","nameJa":"重機手配","readingJa":"じゅうきてはい","summaryJa":"ショベルカーなど大型機械の手配","detailJa":"掘削・積込・締固め・吊上げ等の作業に必要なバックホウ・ダンプ・ローラー・クレーン等の建設機械を調達・配置すること。","nameEn":"Heavy Equipment Arrangement","summaryEn":"Procuring and positioning heavy construction machinery for site work.","detailEn":"Procuring and positioning construction machinery such as backhoes, dump trucks, rollers, and cranes needed for excavation, loading, compaction, and lifting operations.","image":"","captionJa":"","captionEn":"","published":"","name3":"Bố trí thiết bị hạng nặng","summary3":"Thu xếp và bố trí máy móc xây dựng hạng nặng cho công trường.","detail3":"Thu xếp và bố trí máy móc xây dựng như máy đào, xe ben, máy lu và cần cẩu cần thiết cho các hoạt động đào đất, bốc dỡ, đầm chặt và nâng hạ.","caption3":"","name4":"Pengadaan alat berat","summary4":"Penyediaan mesin besar seperti excavator","detail4":"Melakukan pengadaan dan penempatan mesin konstruksi seperti backhoe, dump truck, roller, crane, dan lainnya yang diperlukan untuk pekerjaan penggalian, pemuatan, pemadatan, pengangkatan, dan sebagainya.","caption4":"","images":[]},{"rowNum":22,"id":"021","catCode":"CAT02","nameJa":"試掘","readingJa":"しくつ","summaryJa":"地下埋設物を確認するための事前掘削","detailJa":"本掘削の前に、地下に埋設されている水道管・ガス管・電線管などの位置を確認するために行う小規模な試験的掘削。","nameEn":"Test Pit","summaryEn":"A small preliminary excavation to confirm the location of underground utilities.","detailEn":"A small-scale test excavation performed before main excavation to confirm the location of underground utilities such as water pipes, gas pipes, and conduits.","image":"","captionJa":"","captionEn":"","published":"","name3":"Hố thử","summary3":"Đào thử quy mô nhỏ để xác nhận vị trí của các công trình ngầm.","detail3":"Đào thử quy mô nhỏ trước khi đào chính để xác nhận vị trí của các công trình ngầm như ống nước, ống gas và ống điện.","caption3":"","name4":"Pengeboran eksplorasi","summary4":"Penggalian pendahuluan untuk mengonfirmasi benda terpendam bawah tanah","detail4":"Penggalian percobaan skala kecil yang dilakukan untuk mengonfirmasi posisi pipa air, pipa gas, pipa kabel listrik, dan lainnya yang terkubur di bawah tanah sebelum melakukan penggalian utama.","caption4":"","images":[]},{"rowNum":23,"id":"022","catCode":"CAT02","nameJa":"埋設物確認","readingJa":"まいせつぶつかくにん","summaryJa":"地中の水道管・ガス管などの位置確認","detailJa":"掘削工事前に、地中に埋まっている各種管路・ケーブルの位置・深さを図面・試掘・探査機器等で確認する作業。破損事故防止の重要作業。","nameEn":"Underground Utility Check","summaryEn":"Confirming the position of buried pipes and cables before excavation.","detailEn":"The work of confirming the position and depth of various buried pipes and cables before excavation work, using drawings, test pits, and detection equipment. An important task for preventing damage accidents.","image":"","captionJa":"","captionEn":"","published":"","name3":"Kiểm tra công trình ngầm","summary3":"Xác nhận vị trí của ống và cáp ngầm trước khi đào.","detail3":"Công việc xác nhận vị trí và độ sâu của các loại ống và cáp chôn ngầm trước khi đào, sử dụng bản vẽ, hố thử và thiết bị dò. Công việc quan trọng để phòng ngừa tai nạn hư hỏng.","caption3":"","name4":"Konfirmasi benda terkubur","summary4":"Konfirmasi posisi pipa air dan pipa gas di dalam tanah","detail4":"Pekerjaan konfirmasi posisi dan kedalaman berbagai jalur pipa dan kabel yang terkubur di dalam tanah melalui gambar teknik, penggalian percobaan, peralatan survei, dan lain-lain sebelum pelaksanaan pekerjaan penggalian. Merupakan pekerjaan penting untuk pencegahan kecelakaan kerusakan.","caption4":"","images":[]},{"rowNum":24,"id":"023","catCode":"CAT02","nameJa":"作業員名簿","readingJa":"さぎょういんめいぼ","summaryJa":"現場で働く人の一覧リスト","detailJa":"現場で作業するすべての作業員の氏名・所属・資格・緊急連絡先などを記載したリスト。安全管理・労務管理の基本書類。","nameEn":"Worker List","summaryEn":"A list of all workers at the site including name, affiliation, qualifications, and emergency contacts.","detailEn":"A list recording the name, affiliation, qualifications, and emergency contact of all workers at the construction site. A basic document for safety management and labor management.","image":"","captionJa":"","captionEn":"","published":"","name3":"Danh sách công nhân","summary3":"Danh sách tất cả công nhân tại công trường bao gồm tên, đơn vị, bằng cấp và liên hệ khẩn cấp.","detail3":"Danh sách ghi lại tên, đơn vị, bằng cấp và liên hệ khẩn cấp của tất cả công nhân tại công trường. Tài liệu cơ bản cho quản lý an toàn và quản lý lao động.","caption3":"","name4":"Daftar Nama Pekerja","summary4":"Daftar orang-orang yang bekerja di lapangan","detail4":"Daftar yang mencantumkan nama, afiliasi, kualifikasi, kontak darurat, dan sebagainya dari semua pekerja yang bekerja di lokasi. Dokumen dasar untuk manajemen keselamatan dan manajemen tenaga kerja.","caption4":"","images":[]},{"rowNum":25,"id":"024","catCode":"CAT02","nameJa":"KY活動","readingJa":"けーわいかつどう","summaryJa":"危険予知活動（毎朝の安全確認）","detailJa":"KYとは「危険予知」の略。作業開始前に作業員全員でその日の作業の危険ポイントを話し合い、対策を確認する安全活動。","nameEn":"KY Activity (Hazard Prediction)","summaryEn":"A safety activity where workers discuss potential hazards before starting work.","detailEn":"KY stands for 'Kiken Yochi' (hazard prediction). A safety activity conducted before work begins where all workers discuss the danger points of that day's work and confirm countermeasures.","image":"","captionJa":"","captionEn":"","published":"","name3":"Hoạt động KY (Dự đoán nguy hiểm)","summary3":"Hoạt động an toàn trong đó công nhân thảo luận về các mối nguy hiểm tiềm ẩn trước khi bắt đầu công việc.","detail3":"KY là viết tắt của 'Kiken Yochi' (dự đoán nguy hiểm). Hoạt động an toàn được thực hiện trước khi bắt đầu công việc, trong đó tất cả công nhân thảo luận về các điểm nguy hiểm của công việc trong ngày và xác nhận các biện pháp đối phó.","caption3":"","name4":"Kegiatan KY (Kiken Yochi)","summary4":"Kegiatan Prediksi Bahaya (Konfirmasi Keselamatan Setiap Pagi)","detail4":"KY adalah singkatan dari \"Kiken Yochi\" (prediksi bahaya). Kegiatan keselamatan di mana seluruh pekerja mendiskusikan titik-titik berbahaya dalam pekerjaan hari itu sebelum memulai kerja dan mengonfirmasi langkah-langkah pencegahannya.","caption4":"","images":[]},{"rowNum":26,"id":"025","catCode":"CAT02","nameJa":"朝礼","readingJa":"ちょうれい","summaryJa":"作業開始前の全員集合・安全確認","detailJa":"毎朝作業開始前に全作業員が集まり、当日の作業内容・安全注意事項・連絡事項を確認する場。KY活動もここで行う。","nameEn":"Morning Assembly","summaryEn":"A daily gathering of all workers before work to confirm the day's tasks and safety precautions.","detailEn":"A gathering of all workers every morning before work begins to confirm the day's work content, safety precautions, and announcements. KY activities are also conducted here.","image":"","captionJa":"","captionEn":"","published":"","name3":"Họp đầu ca","summary3":"Cuộc tập hợp hàng ngày của tất cả công nhân trước khi làm việc để xác nhận nhiệm vụ và lưu ý an toàn trong ngày.","detail3":"Cuộc tập hợp của tất cả công nhân mỗi sáng trước khi bắt đầu công việc để xác nhận nội dung công việc trong ngày, lưu ý an toàn và thông báo. Hoạt động KY cũng được thực hiện tại đây.","caption3":"","name4":"Apel pagi","summary4":"Berkumpul semua anggota sebelum memulai pekerjaan dan konfirmasi keselamatan","detail4":"Tempat berkumpulnya seluruh pekerja setiap pagi sebelum memulai pekerjaan untuk mengonfirmasi isi pekerjaan hari itu, hal-hal yang perlu diperhatikan dalam keselamatan kerja, dan hal-hal yang perlu dikomunikasikan. Kegiatan KY juga dilakukan di sini.","caption4":"","images":[]},{"rowNum":27,"id":"026","catCode":"CAT02","nameJa":"墨出し","readingJa":"すみだし","summaryJa":"施工位置を現地に線で示すこと","detailJa":"設計図の寸法・位置を現地の床・壁・地面に墨（墨汁）やチョークで線を引いて示す作業。型枠設置・配筋・仕上げの基準となる。","nameEn":"Layout Marking","summaryEn":"Drawing lines on the ground or structure to indicate the position and dimensions from design drawings.","detailEn":"The work of drawing lines on floors, walls, and the ground using ink or chalk to show the dimensions and positions from design drawings. Serves as the reference for formwork installation, reinforcement placement, and finishing.","image":"","captionJa":"","captionEn":"","published":"","name3":"Vạch mực","summary3":"Vẽ đường trên mặt đất hoặc công trình để chỉ vị trí và kích thước từ bản vẽ thiết kế.","detail3":"Công việc vẽ đường trên sàn, tường và mặt đất bằng mực hoặc phấn để thể hiện kích thước và vị trí từ bản vẽ thiết kế. Đóng vai trò tham chiếu cho việc lắp ván khuôn, đặt cốt thép và hoàn thiện.","caption3":"","name4":"Pengukuran dan penandaan","summary4":"Menunjukkan posisi pelaksanaan dengan garis di lokasi","detail4":"Pekerjaan menandai dimensi dan posisi dari gambar desain ke lantai, dinding, dan tanah di lokasi dengan menarik garis menggunakan tinta (sumi) atau kapur. Ini menjadi standar untuk pemasangan bekisting, pemasangan tulangan, dan penyelesaian akhir.","caption4":"","images":[]},{"rowNum":28,"id":"027","catCode":"CAT03","nameJa":"掘削","readingJa":"くっさく","summaryJa":"地面を掘ること","detailJa":"バックホウ等の重機で地面・地盤を掘り下げる作業。構造物の基礎・管路・水路などを設けるための基本作業。","nameEn":"Excavation","summaryEn":"The work of digging into the ground using heavy machinery.","detailEn":"The work of digging into the ground and subgrade using backhoes and other heavy machinery. A fundamental operation for creating foundations for structures, pipe trenches, and water channels.","image":"","captionJa":"","captionEn":"","published":"","name3":"Đào đất","summary3":"Công việc đào đất bằng máy móc hạng nặng.","detail3":"Công việc đào sâu vào lòng đất và nền đất bằng máy đào và các máy móc hạng nặng khác. Thao tác cơ bản để tạo móng cho công trình, rãnh ống và kênh nước.","caption3":"","name4":"Pengeboran","summary4":"Menggali tanah","detail4":"Pekerjaan penggalian tanah dan lapisan tanah menggunakan alat berat seperti backhoe. Pekerjaan dasar untuk membuat pondasi struktur, saluran pipa, dan saluran air.","caption4":"","images":[]},{"rowNum":29,"id":"028","catCode":"CAT03","nameJa":"床掘り","readingJa":"とこぼり","summaryJa":"構造物の基礎を作るための掘削","detailJa":"構造物（橋梁・水路・建物等）の基礎部分を設置するために地盤を所定の深さまで掘削する作業。正確な位置・深さで掘ることが重要。","nameEn":"Foundation Excavation","summaryEn":"Excavation to the required depth for installing structural foundations.","detailEn":"Excavation of the ground to a specified depth for installing the foundations of structures such as bridges, water channels, and buildings. It is important to excavate at the correct position and depth.","image":"","captionJa":"","captionEn":"","published":"","name3":"Đào móng","summary3":"Đào đến độ sâu cần thiết để lắp đặt móng kết cấu.","detail3":"Đào nền đất đến độ sâu quy định để lắp đặt móng của các kết cấu như cầu, kênh nước và công trình. Quan trọng là phải đào đúng vị trí và độ sâu.","caption3":"","name4":"Penggalian dasar","summary4":"Penggalian untuk membuat fondasi struktur","detail4":"Pekerjaan penggalian tanah hingga kedalaman yang ditentukan untuk memasang bagian fondasi struktur (jembatan, saluran air, bangunan, dll.). Penting untuk menggali pada posisi dan kedalaman yang akurat.","caption4":"","images":[]},{"rowNum":30,"id":"029","catCode":"CAT03","nameJa":"残土","readingJa":"ざんど","summaryJa":"掘削して出た余った土","detailJa":"掘削工事で発生した余剰土砂。盛土に利用できる場合もあるが、多くは産業廃棄物として適切に処分（残土処分場への搬出）が必要。","nameEn":"Surplus Soil","summaryEn":"Excess soil generated from excavation work.","detailEn":"Excess soil generated from excavation work. Sometimes it can be reused for embankment, but in many cases it must be properly disposed of as industrial waste (transported to a soil disposal site).","image":"","captionJa":"","captionEn":"","published":"","name3":"Đất thừa","summary3":"Đất thừa phát sinh từ công tác đào đất.","detail3":"Đất thừa phát sinh từ công tác đào đất. Đôi khi có thể tái sử dụng để đắp nền, nhưng trong nhiều trường hợp phải xử lý đúng cách như chất thải công nghiệp (vận chuyển đến bãi chứa đất).","caption3":"","name4":"Tanah sisa","summary4":"Tanah sisa hasil penggalian","detail4":"Tanah surplus yang dihasilkan dari pekerjaan penggalian. Meskipun kadang dapat dimanfaatkan untuk timbunan, sebagian besar perlu dibuang dengan tepat sebagai limbah industri (pengangkutan ke tempat pembuangan tanah sisa).","caption4":"","images":[]},{"rowNum":31,"id":"030","catCode":"CAT03","nameJa":"盛土","readingJa":"もりど","summaryJa":"土を積み上げて地面を高くすること","detailJa":"道路・堤防・宅地造成などで、土砂を運搬・積み上げて地盤を高くする工事。転圧・締固めを繰り返して安定した地盤を作る。","nameEn":"Embankment","summaryEn":"Raising the ground level by transporting and piling up soil.","detailEn":"Construction that raises the ground level by transporting and piling up soil for roads, embankments, and land development. Stable ground is created by repeating rolling and compaction.","image":"","captionJa":"","captionEn":"","published":"","name3":"Đắp nền","summary3":"Nâng cao mặt đất bằng cách vận chuyển và đổ đất.","detail3":"Xây dựng nâng cao mặt đất bằng cách vận chuyển và đổ đất cho đường, đê và phát triển đất. Nền đất ổn định được tạo ra bằng cách lặp lại việc lu lèn và đầm chặt.","caption3":"","name4":"Timbunan","summary4":"Menimbun tanah untuk meninggikan permukaan tanah","detail4":"Pekerjaan untuk meninggikan permukaan tanah dengan mengangkut dan menumpuk tanah untuk jalan, tanggul, dan pembangunan lahan perumahan. Membuat tanah dasar yang stabil dengan melakukan pemadatan dan kompaksi berulang kali.","caption4":"","images":[]},{"rowNum":32,"id":"031","catCode":"CAT03","nameJa":"切土","readingJa":"きりど","summaryJa":"地面・斜面を削ること","detailJa":"道路や宅地造成で、山や丘陵の斜面を機械で削り取って平坦にする工事。切取り面（法面）の安定処理が重要。","nameEn":"Cut","summaryEn":"Cutting into slopes or hillsides to create a flat surface.","detailEn":"Construction that uses machinery to cut into mountain or hillside slopes to create flat surfaces for roads and land development. Stabilization treatment of the cut face (slope) is important.","image":"","captionJa":"","captionEn":"","published":"","name3":"Đào cắt","summary3":"Cắt vào sườn dốc hoặc đồi để tạo mặt phẳng.","detail3":"Xây dựng sử dụng máy móc để cắt vào sườn núi hoặc đồi để tạo mặt phẳng cho đường và phát triển đất. Xử lý ổn định mặt cắt (mái dốc) là quan trọng.","caption3":"","name4":"Galian tanah","summary4":"Penggalian tanah dan lereng","detail4":"Pekerjaan pemotongan lereng gunung atau bukit dengan menggunakan mesin untuk meratakan tanah dalam pembangunan jalan atau perumahan. Penanganan stabilisasi permukaan galian (lereng buatan) sangat penting.","caption4":"","images":[]},{"rowNum":33,"id":"032","catCode":"CAT03","nameJa":"転圧","readingJa":"てんあつ","summaryJa":"ローラーで土・砕石を締め固めること","detailJa":"振動ローラーやタイヤローラーで盛土・路盤材料を繰り返し転がして締め固める作業。十分な締固め度を確保することが品質の要。","nameEn":"Rolling Compaction","summaryEn":"Compacting soil or crushed stone by repeatedly rolling with a compactor.","detailEn":"The work of compacting embankment and road base materials by repeatedly rolling with a vibratory roller or tire roller. Ensuring sufficient compaction density is the key to quality.","image":"","captionJa":"","captionEn":"","published":"","name3":"Lu lèn","summary3":"Đầm chặt đất hoặc đá dăm bằng cách lăn đi lăn lại với máy lu.","detail3":"Công việc đầm chặt vật liệu đắp nền và nền đường bằng cách lăn đi lăn lại với máy lu rung hoặc máy lu bánh lốp. Đảm bảo độ đầm chặt đủ là chìa khóa chất lượng.","caption3":"","name4":"Pemadatan","summary4":"Memadatkan tanah dan batu pecah dengan roller","detail4":"Pekerjaan pemadatan dengan menggelindingkan secara berulang material timbunan dan perkerasan jalan menggunakan roller bergetar atau roller ban. Kunci kualitas adalah memastikan tingkat pemadatan yang memadai.","caption4":"","images":[]},{"rowNum":34,"id":"033","catCode":"CAT03","nameJa":"締固め","readingJa":"しめかため","summaryJa":"土や砕石をよく叩いて密にすること","detailJa":"土・砕石・アスファルト等を機械で圧縮し、空隙を減らして強固な地盤・路盤を作ること。転圧と同義で使われることも多い。","nameEn":"Compaction","summaryEn":"Compressing soil and materials to reduce voids and create a solid base.","detailEn":"Compressing soil, crushed stone, asphalt, and other materials with machinery to reduce voids and create a strong foundation or road base. Often used synonymously with rolling compaction.","image":"","captionJa":"","captionEn":"","published":"","name3":"Đầm chặt","summary3":"Nén đất và vật liệu để giảm lỗ rỗng và tạo nền vững chắc.","detail3":"Nén đất, đá dăm, nhựa đường và các vật liệu khác bằng máy móc để giảm lỗ rỗng và tạo nền hoặc móng đường vững chắc. Thường được dùng đồng nghĩa với lu lèn.","caption3":"","name4":"Pemadatan","summary4":"Memadatkan tanah atau batu pecah dengan cara menumbuk hingga padat","detail4":"Proses memadatkan tanah, batu pecah, aspal, dan material lainnya menggunakan mesin untuk mengurangi rongga udara dan membuat fondasi serta perkerasan jalan yang kuat. Sering juga digunakan dengan makna yang sama dengan pemadatan (rolling).","caption4":"","images":[]},{"rowNum":35,"id":"034","catCode":"CAT03","nameJa":"路盤","readingJa":"ろばん","summaryJa":"舗装の下の砕石などの基盤層","detailJa":"アスファルト舗装やコンクリート舗装の直下にある砕石・砂利の層。交通荷重を分散させる重要な構造層。上層路盤・下層路盤に分けられる。","nameEn":"Road Base","summaryEn":"The layer of crushed stone or gravel directly below the pavement surface.","detailEn":"The layer of crushed stone or gravel directly beneath asphalt or concrete pavement. An important structural layer that distributes traffic loads. Divided into upper road base and lower road base.","image":"","captionJa":"","captionEn":"","published":"","name3":"Lớp móng đường","summary3":"Lớp đá dăm hoặc sỏi nằm ngay bên dưới mặt đường.","detail3":"Lớp đá dăm hoặc sỏi nằm ngay dưới mặt đường nhựa hoặc bê tông. Lớp kết cấu quan trọng phân phối tải trọng giao thông. Chia thành lớp móng trên và lớp móng dưới.","caption3":"","name4":"Perkerasan dasar","summary4":"Lapisan dasar seperti batu pecah di bawah perkerasan","detail4":"Lapisan batu pecah dan kerikil yang berada langsung di bawah perkerasan aspal atau perkerasan beton. Lapisan struktur penting yang berfungsi mendistribusikan beban lalu lintas. Dibagi menjadi lapis pondasi atas dan lapis pondasi bawah.","caption4":"","images":[]},{"rowNum":36,"id":"035","catCode":"CAT03","nameJa":"舗装","readingJa":"ほそう","summaryJa":"アスファルトやコンクリートで表面を覆うこと","detailJa":"アスファルト混合物やコンクリートで道路・駐車場・広場の表面を覆う工事。平坦性・耐久性・排水性が要求される。","nameEn":"Pavement","summaryEn":"Covering road or ground surfaces with asphalt or concrete.","detailEn":"Construction that covers road, parking lot, and plaza surfaces with asphalt mixture or concrete. Flatness, durability, and drainage are required qualities.","image":"","captionJa":"","captionEn":"","published":"","name3":"Mặt đường","summary3":"Phủ bề mặt đường hoặc mặt đất bằng nhựa đường hoặc bê tông.","detail3":"Xây dựng phủ bề mặt đường, bãi đỗ xe và quảng trường bằng hỗn hợp nhựa đường hoặc bê tông. Độ phẳng, độ bền và khả năng thoát nước là các yêu cầu chất lượng.","caption3":"","name4":"Perkerasan","summary4":"Menutup permukaan dengan aspal atau beton","detail4":"Pekerjaan melapisi permukaan jalan, tempat parkir, dan lapangan dengan campuran aspal atau beton. Diperlukan kerataan, daya tahan, dan kemampuan drainase.","caption4":"","images":[]},{"rowNum":37,"id":"036","catCode":"CAT03","nameJa":"アスファルト","readingJa":"あすふぁると","summaryJa":"黒い舗装材料（加熱して敷く）","detailJa":"石油を精製して得られる黒色粘性物質に砂利・砂を混合した舗装材料。加熱（160℃前後）して施工し、冷却後に固まる。","nameEn":"Asphalt","summaryEn":"A black paving material made by mixing bitumen with aggregates, applied hot.","detailEn":"A paving material made by mixing a black viscous substance obtained from petroleum refining with gravel and sand. It is applied hot (around 160°C) and hardens after cooling.","image":"","captionJa":"","captionEn":"","published":"","name3":"Nhựa đường","summary3":"Vật liệu lát đường màu đen làm bằng cách trộn bitumen với cốt liệu, thi công nóng.","detail3":"Vật liệu lát đường làm bằng cách trộn chất nhớt đen thu được từ việc lọc dầu mỏ với sỏi và cát. Thi công nóng (khoảng 160°C) và cứng lại sau khi nguội.","caption3":"","name4":"Aspal","summary4":"Bahan perkerasan hitam (dipanaskan untuk pemasangan)","detail4":"Bahan perkerasan yang terdiri dari campuran zat kental berwarna hitam yang diperoleh dari penyulingan minyak bumi dengan kerikil dan pasir. Dikerjakan dengan pemanasan (sekitar 160℃) dan mengeras setelah pendinginan.","caption4":"","images":[]},{"rowNum":38,"id":"037","catCode":"CAT03","nameJa":"コンクリート打設","readingJa":"こんくりーとだせつ","summaryJa":"型枠にコンクリートを流し込むこと","detailJa":"練り混ぜたコンクリート（生コン）を型枠内に流し込み、バイブレーターで締め固める作業。打設後の養生が品質を左右する。","nameEn":"Concrete Placement","summaryEn":"Pouring mixed concrete into formwork and compacting it with a vibrator.","detailEn":"The work of pouring mixed concrete (ready-mix) into formwork and compacting it with a vibrator. Curing after placement greatly affects quality.","image":"","captionJa":"","captionEn":"","published":"","name3":"Đổ bê tông","summary3":"Đổ bê tông đã trộn vào ván khuôn và đầm chặt bằng máy đầm dùi.","detail3":"Công việc đổ bê tông trộn (bê tông tươi) vào ván khuôn và đầm chặt bằng máy đầm dùi. Bảo dưỡng sau khi đổ ảnh hưởng lớn đến chất lượng.","caption3":"","name4":"Pengecoran beton","summary4":"Menuangkan beton ke dalam bekisting","detail4":"Pekerjaan menuangkan beton segar (beton siap pakai) yang telah diaduk ke dalam bekisting dan memadatkannya dengan vibrator. Perawatan (curing) setelah pengecoran menentukan kualitas.","caption4":"","images":[]},{"rowNum":39,"id":"038","catCode":"CAT03","nameJa":"型枠","readingJa":"かたわく","summaryJa":"コンクリートを流す木・鉄製の枠","detailJa":"コンクリートを所定の形状に成形するための木製または鋼製の枠。打設後、コンクリートが固まったら脱型（取り外し）する。","nameEn":"Formwork","summaryEn":"Wooden or steel molds used to shape concrete into the desired form.","detailEn":"Wooden or steel molds used to form concrete into the specified shape. After placement, the formwork is removed (stripped) once the concrete has hardened.","image":"","captionJa":"","captionEn":"","published":"","name3":"Ván khuôn","summary3":"Khuôn gỗ hoặc thép dùng để tạo hình bê tông theo hình dạng mong muốn.","detail3":"Khuôn gỗ hoặc thép dùng để tạo hình bê tông theo hình dạng quy định. Sau khi đổ, ván khuôn được tháo dỡ khi bê tông đã đóng rắn.","caption3":"","name4":"Bekisting","summary4":"Cetakan kayu dan besi untuk menuang beton","detail4":"Kerangka kayu atau baja untuk membentuk beton sesuai bentuk yang ditentukan. Setelah pengecoran, bekisting dibongkar (dilepas) ketika beton telah mengeras.","caption4":"","images":[]},{"rowNum":40,"id":"039","catCode":"CAT03","nameJa":"鉄筋","readingJa":"てっきん","summaryJa":"コンクリートの中に入れる鉄の棒","detailJa":"コンクリートの引張強度を補うために埋め込む鉄製の棒（異形棒鋼）。コンクリートと鉄筋の複合体を鉄筋コンクリート（RC）という。","nameEn":"Reinforcing Bar (Rebar)","summaryEn":"Steel bars embedded in concrete to improve its tensile strength.","detailEn":"Steel bars (deformed bars) embedded in concrete to supplement its tensile strength. The composite of concrete and steel bars is called reinforced concrete (RC).","image":"","captionJa":"","captionEn":"","published":"","name3":"Cốt thép","summary3":"Thanh thép chôn trong bê tông để cải thiện sức chịu kéo.","detail3":"Thanh thép (thép gân) chôn trong bê tông để bổ sung sức chịu kéo. Tổ hợp bê tông và thanh thép được gọi là bê tông cốt thép (BTCT).","caption3":"","name4":"Besi tulangan","summary4":"Batang besi yang dimasukkan ke dalam beton","detail4":"Batang besi (baja tulangan berulir) yang ditanamkan untuk melengkapi kekuatan tarik beton. Gabungan antara beton dan tulangan baja disebut beton bertulang (RC).","caption4":"","images":[]},{"rowNum":41,"id":"040","catCode":"CAT03","nameJa":"配筋","readingJa":"はいきん","summaryJa":"鉄筋を設計通りに配置・組み立てること","detailJa":"設計図に基づき鉄筋を切断・曲げ加工し、所定の間隔・位置に結束線で固定する作業。コンクリート打設前の重要工程。","nameEn":"Rebar Placement","summaryEn":"Cutting, bending, and fixing reinforcing bars in position according to design drawings.","detailEn":"Cutting, bending, and fixing reinforcing bars in position at specified intervals using binding wire, based on design drawings. An important process before concrete placement.","image":"","captionJa":"","captionEn":"","published":"","name3":"Bố trí cốt thép","summary3":"Cắt, uốn và cố định thanh thép vào vị trí theo bản vẽ thiết kế.","detail3":"Cắt, uốn và cố định thanh thép vào vị trí theo khoảng cách quy định bằng dây buộc, dựa trên bản vẽ thiết kế. Công đoạn quan trọng trước khi đổ bê tông.","caption3":"","name4":"Penulangan","summary4":"Menempatkan dan merakit tulangan besi sesuai dengan desain","detail4":"Pekerjaan memotong dan membengkokkan tulangan besi berdasarkan gambar rancangan, kemudian mengikatnya dengan kawat pengikat pada interval dan posisi yang ditentukan. Merupakan proses penting sebelum pengecoran beton.","caption4":"","images":[]},{"rowNum":42,"id":"041","catCode":"CAT03","nameJa":"養生","readingJa":"ようじょう","summaryJa":"コンクリートが固まるまで保護すること","detailJa":"打設直後のコンクリートを乾燥・急激な温度変化・衝撃から守り、十分に硬化させるための保護管理。シートで覆ったり散水したりする。","nameEn":"Curing","summaryEn":"Protecting freshly placed concrete to allow it to harden properly.","detailEn":"Protective management of freshly placed concrete to protect it from drying, sudden temperature changes, and impact, allowing it to harden sufficiently. Methods include covering with sheets and water sprinkling.","image":"","captionJa":"","captionEn":"","published":"","name3":"Bảo dưỡng bê tông","summary3":"Bảo vệ bê tông mới đổ để cho phép nó đóng rắn đúng cách.","detail3":"Quản lý bảo vệ bê tông mới đổ để tránh khô, thay đổi nhiệt độ đột ngột và va đập, cho phép nó đóng rắn đầy đủ. Các phương pháp bao gồm phủ tấm và tưới nước.","caption3":"","name4":"Perawatan","summary4":"Lindungi beton hingga mengeras","detail4":"Manajemen perlindungan untuk melindungi beton segera setelah pengecoran dari pengeringan, perubahan suhu yang drastis, dan benturan, serta memungkinkannya mengeras dengan baik. Dilakukan dengan menutup menggunakan lembaran atau penyiraman air.","caption4":"","images":[]},{"rowNum":43,"id":"042","catCode":"CAT03","nameJa":"排水工","readingJa":"はいすいこう","summaryJa":"水を流すための側溝・暗渠などの工事","detailJa":"雨水・地下水・湧水を適切に排除するための側溝・暗渠・排水管などの施設を設ける工事の総称。","nameEn":"Drainage Work","summaryEn":"Construction of drainage facilities such as ditches and culverts to remove water.","detailEn":"A general term for construction that installs facilities such as side ditches, culverts, and drainage pipes to properly remove rainwater, groundwater, and spring water.","image":"","captionJa":"","captionEn":"","published":"","name3":"Công tác thoát nước","summary3":"Xây dựng các công trình thoát nước như rãnh và cống để thoát nước.","detail3":"Thuật ngữ chung cho việc xây dựng lắp đặt các công trình như rãnh thoát nước bên, cống ngầm và ống thoát nước để thoát nước mưa, nước ngầm và nước ngầm một cách thích hợp.","caption3":"","name4":"Pekerjaan drainase","summary4":"Pekerjaan saluran samping dan saluran tertutup untuk mengalirkan air","detail4":"Istilah umum untuk pekerjaan pembangunan fasilitas seperti saluran samping, saluran tertutup, dan pipa drainase untuk membuang air hujan, air tanah, dan air mata air dengan tepat.","caption4":"","images":[]},{"rowNum":44,"id":"043","catCode":"CAT03","nameJa":"側溝","readingJa":"そっこう","summaryJa":"道路脇の水を流す溝（U字溝など）","detailJa":"道路の両端に設けるU字型や矩形の排水溝。路面の雨水を集めて排水する。コンクリート製プレキャスト製品が多く使われる。","nameEn":"Side Ditch","summaryEn":"A drainage channel along the side of a road to collect and drain rainwater.","detailEn":"A U-shaped or rectangular drainage channel installed along both sides of a road to collect and drain rainwater from the road surface. Precast concrete products are commonly used.","image":"","captionJa":"","captionEn":"","published":"","name3":"Rãnh thoát nước","summary3":"Kênh thoát nước dọc theo lề đường để thu gom và thoát nước mưa.","detail3":"Kênh thoát nước hình chữ U hoặc hình chữ nhật lắp đặt dọc cả hai bên đường để thu gom và thoát nước mưa từ mặt đường. Sản phẩm bê tông đúc sẵn thường được sử dụng.","caption3":"","name4":"Saluran drainase samping","summary4":"Saluran air di tepi jalan (seperti saluran U dan sebagainya)","detail4":"Saluran drainase berbentuk U atau persegi panjang yang dipasang di kedua sisi jalan. Berfungsi untuk mengumpulkan dan mengalirkan air hujan dari permukaan jalan. Sebagian besar menggunakan produk pracetak beton.","caption4":"","images":[]},{"rowNum":45,"id":"044","catCode":"CAT03","nameJa":"暗渠","readingJa":"あんきょ","summaryJa":"地中に埋設された排水管・水路","detailJa":"地表に露出せず地中に埋設された排水管・水路のこと。農地の排水改良や市街地の雨水排水に広く使われる。","nameEn":"Culvert / Underground Drain","summaryEn":"A drainage pipe or channel buried underground, not visible at the surface.","detailEn":"A drainage pipe or channel buried underground, not exposed at the surface. Widely used for agricultural land drainage improvement and urban stormwater drainage.","image":"","captionJa":"","captionEn":"","published":"","name3":"Cống ngầm","summary3":"Ống hoặc kênh thoát nước chôn ngầm dưới đất, không thấy được ở bề mặt.","detail3":"Ống hoặc kênh thoát nước chôn ngầm, không lộ ra ở bề mặt. Được sử dụng rộng rãi để cải thiện thoát nước đất nông nghiệp và thoát nước mưa đô thị.","caption3":"","name4":"Saluran tertutup","summary4":"Pipa drainase dan saluran air yang tertanam di dalam tanah","detail4":"Pipa drainase atau saluran air yang tidak terpapar di permukaan tanah melainkan terkubur di dalam tanah. Digunakan secara luas untuk perbaikan drainase lahan pertanian dan drainase air hujan di daerah perkotaan.","caption4":"","images":[]},{"rowNum":46,"id":"045","catCode":"CAT03","nameJa":"管渠","readingJa":"かんきょ","summaryJa":"パイプによる排水施設","detailJa":"コンクリート管・塩化ビニル管・鋼管などのパイプを地中に埋設して排水する施設。側溝（開渠）に対して管（閉渠）と呼ばれることもある。","nameEn":"Pipe Drain","summaryEn":"A drainage facility using buried pipes such as concrete or PVC pipes.","detailEn":"A facility that drains water by burying pipes such as concrete pipes, PVC pipes, and steel pipes underground. Sometimes called a closed channel as opposed to a side ditch (open channel).","image":"","captionJa":"","captionEn":"","published":"","name3":"Cống thoát nước","summary3":"Công trình thoát nước sử dụng ống chôn ngầm như ống bê tông hoặc ống PVC.","detail3":"Công trình thoát nước bằng cách chôn ống như ống bê tông, ống PVC và ống thép xuống đất. Đôi khi gọi là kênh kín trái với rãnh thoát nước (kênh hở).","caption3":"","name4":"Saluran perpipaan","summary4":"Fasilitas drainase dengan pipa","detail4":"Fasilitas drainase yang menggunakan pipa seperti pipa beton, pipa PVC, dan pipa baja yang ditanam di dalam tanah. Kadang-kadang disebut sebagai saluran tertutup (pipa) sebagai lawan dari saluran samping (saluran terbuka).","caption4":"","images":[]},{"rowNum":47,"id":"046","catCode":"CAT03","nameJa":"基礎工","readingJa":"きそこう","summaryJa":"構造物を支える地盤部分の工事","detailJa":"橋梁・建物・水路などの構造物を安全に支えるための地盤内の工事。直接基礎・杭基礎・ケーソン基礎などの種類がある。","nameEn":"Foundation Work","summaryEn":"Construction in the ground to safely support structures such as bridges and buildings.","detailEn":"Construction in the ground to safely support structures such as bridges, buildings, and water channels. Types include spread foundations, pile foundations, and caisson foundations.","image":"","captionJa":"","captionEn":"","published":"","name3":"Công tác móng","summary3":"Xây dựng trong lòng đất để đỡ an toàn các kết cấu như cầu và công trình.","detail3":"Xây dựng trong lòng đất để đỡ an toàn các kết cấu như cầu, công trình và kênh nước. Các loại bao gồm móng trực tiếp, móng cọc và móng hộp.","caption3":"","name4":"Pekerjaan fondasi","summary4":"Pekerjaan bagian tanah dasar yang menopang struktur bangunan","detail4":"Pekerjaan di dalam tanah untuk menopang struktur seperti jembatan, bangunan, dan saluran air dengan aman. Jenisnya meliputi pondasi langsung, pondasi tiang pancang, dan pondasi kaison.","caption4":"","images":[]},{"rowNum":48,"id":"047","catCode":"CAT03","nameJa":"ブロック積み","readingJa":"ぶろっくづみ","summaryJa":"コンクリートブロックを積んで壁を作ること","detailJa":"コンクリートブロックをモルタルで積み重ねて擁壁・護岸・境界壁などを構築する工法。石積みの代替として広く用いられる。","nameEn":"Block Masonry","summaryEn":"Stacking concrete blocks with mortar to construct retaining walls or revetments.","detailEn":"A construction method of stacking concrete blocks with mortar to build retaining walls, revetments, and boundary walls. Widely used as an alternative to stone masonry.","image":"","captionJa":"","captionEn":"","published":"","name3":"Xây khối","summary3":"Xếp các khối bê tông với vữa để xây tường chắn đất hoặc kè.","detail3":"Phương pháp xây dựng xếp các khối bê tông với vữa để xây tường chắn đất, kè và tường ranh giới. Được sử dụng rộng rãi như một lựa chọn thay thế cho xây đá.","caption3":"","name4":"Pemasangan blok","summary4":"Membangun dinding dengan menyusun blok beton","detail4":"Metode konstruksi untuk membangun dinding penahan tanah, perlindungan tepi sungai, dan dinding pembatas dengan cara menumpuk blok beton menggunakan mortar. Metode ini digunakan secara luas sebagai pengganti susunan batu.","caption4":"","images":[]},{"rowNum":49,"id":"048","catCode":"CAT03","nameJa":"法面","readingJa":"のりめん","summaryJa":"盛土・切土の斜面部分","detailJa":"道路・堤防の盛土や切取りによって生じる傾斜面のこと。崩壊を防ぐため法面保護工（植生・コンクリート吹付け等）が施される。","nameEn":"Slope Face","summaryEn":"The inclined surface created by embankment or cutting work.","detailEn":"The inclined surface created by embankment or cutting work on roads and embankments. Slope protection work (vegetation, concrete spraying, etc.) is applied to prevent collapse.","image":"","captionJa":"","captionEn":"","published":"","name3":"Mái dốc","summary3":"Bề mặt nghiêng được tạo ra bởi công tác đắp nền hoặc đào cắt.","detail3":"Bề mặt nghiêng được tạo ra bởi công tác đắp nền hoặc đào cắt trên đường và đê. Công tác bảo vệ mái dốc (trồng cây, phun bê tông, v.v.) được áp dụng để ngăn sụp đổ.","caption3":"","name4":"Lereng","summary4":"Bagian lereng timbunan dan galian","detail4":"Permukaan miring yang terbentuk akibat penimbunan atau penggalian tanah untuk jalan dan tanggul. Untuk mencegah keruntuhan, diterapkan pekerjaan perlindungan lereng (vegetasi, penyemprotan beton, dan lain-lain).","caption4":"","images":[]},{"rowNum":50,"id":"049","catCode":"CAT03","nameJa":"法面保護","readingJa":"のりめんほご","summaryJa":"斜面の崩れを防ぐ工法（植生・コンクリート等）","detailJa":"雨水浸食・風化・崩壊から法面を守る工法の総称。植生工（種子吹付け・芝張り）・コンクリート系工法（吹付け・張りコンクリート）・ロック系工法などがある。","nameEn":"Slope Protection","summaryEn":"Methods to protect slopes from erosion, weathering, and collapse.","detailEn":"A general term for methods to protect slopes from rainwater erosion, weathering, and collapse. Includes vegetation methods (seed spraying, sod laying), concrete methods (shotcrete, concrete lining), and rock methods.","image":"","captionJa":"","captionEn":"","published":"","name3":"Bảo vệ mái dốc","summary3":"Các phương pháp bảo vệ mái dốc khỏi xói mòn, phong hóa và sụp đổ.","detail3":"Thuật ngữ chung cho các phương pháp bảo vệ mái dốc khỏi xói mòn do nước mưa, phong hóa và sụp đổ. Bao gồm phương pháp thực vật (phun hạt giống, đặt cỏ), phương pháp bê tông (bê tông phun, lót bê tông) và phương pháp đá.","caption3":"","name4":"Perlindungan lereng","summary4":"Metode untuk mencegah keruntuhan lereng (vegetasi, beton, dll.)","detail4":"Istilah umum untuk metode konstruksi yang melindungi lereng dari erosi air hujan, pelapukan, dan keruntuhan. Terdapat metode vegetasi (penyemprotan benih, pemasangan rumput), metode berbasis beton (penyemprotan beton, pemasangan beton), metode berbasis batuan, dan lain-lain.","caption4":"","images":[]},{"rowNum":51,"id":"050","catCode":"CAT03","nameJa":"護岸","readingJa":"ごがん","summaryJa":"川岸・水路岸を守る構造物","detailJa":"河川・水路の岸を流水による侵食・崩壊から守るためのコンクリートブロック・捨石・矢板等による構造物。","nameEn":"Revetment","summaryEn":"A structure protecting riverbanks or channel banks from erosion by flowing water.","detailEn":"A structure using concrete blocks, rubble stones, and sheet piles to protect river and channel banks from erosion and collapse caused by flowing water.","image":"","captionJa":"","captionEn":"","published":"","name3":"Kè bảo vệ bờ","summary3":"Kết cấu bảo vệ bờ sông hoặc bờ kênh khỏi xói mòn do nước chảy.","detail3":"Kết cấu sử dụng khối bê tông, đá thả và cừ thép để bảo vệ bờ sông và kênh khỏi xói mòn và sụp đổ do nước chảy.","caption3":"","name4":"Perlindungan pantai","summary4":"Struktur pelindung tebing sungai dan tebing saluran air","detail4":"Struktur yang terdiri dari blok beton, batu lempar, sheet pile, dan sebagainya untuk melindungi tebing sungai dan saluran air dari erosi dan keruntuhan akibat aliran air.","caption4":"","images":[]},{"rowNum":52,"id":"051","catCode":"CAT04","nameJa":"品質管理","readingJa":"ひんしつかんり","summaryJa":"工事の出来栄えを基準通りに保つ管理","detailJa":"工事の材料・施工・完成品が設計基準・仕様書の品質を満たしているかを確認・管理する活動。試験・検査・写真記録が主な手段。","nameEn":"Quality Control","summaryEn":"Managing and verifying that construction materials and work meet specified quality standards.","detailEn":"Activities to verify and manage that construction materials, workmanship, and finished products meet the quality standards of design specifications. Testing, inspection, and photographic records are the main means.","image":"","captionJa":"","captionEn":"","published":"","name3":"Kiểm soát chất lượng","summary3":"Quản lý và xác minh vật liệu và công việc xây dựng đáp ứng các tiêu chuẩn chất lượng quy định.","detail3":"Các hoạt động xác minh và quản lý rằng vật liệu xây dựng, tay nghề và thành phẩm đáp ứng các tiêu chuẩn chất lượng của thông số kỹ thuật thiết kế. Thử nghiệm, kiểm tra và ghi lại ảnh là phương tiện chính.","caption3":"","name4":"Kontrol Kualitas","summary4":"Pengelolaan untuk mempertahankan kualitas hasil pekerjaan konstruksi sesuai dengan standar","detail4":"Kegiatan untuk mengonfirmasi dan mengelola apakah material konstruksi, pelaksanaan, dan produk jadi memenuhi kualitas standar desain dan spesifikasi. Pengujian, inspeksi, dan dokumentasi foto merupakan sarana utama.","caption4":"","images":[]},{"rowNum":53,"id":"052","catCode":"CAT04","nameJa":"工程管理","readingJa":"こうていかんり","summaryJa":"スケジュール通りに工事を進める管理","detailJa":"工程表に基づき工事の進捗を把握し、遅延が生じた場合は対策を講じて工期内完成を目指す管理活動。","nameEn":"Schedule Management","summaryEn":"Managing construction progress to ensure completion within the scheduled timeframe.","detailEn":"A management activity that tracks construction progress based on the schedule and takes countermeasures when delays occur, aiming for completion within the construction period.","image":"","captionJa":"","captionEn":"","published":"","name3":"Quản lý tiến độ","summary3":"Quản lý tiến độ xây dựng để đảm bảo hoàn thành trong khung thời gian đã lên kế hoạch.","detail3":"Hoạt động quản lý theo dõi tiến độ xây dựng dựa trên lịch trình và thực hiện các biện pháp đối phó khi xảy ra chậm trễ, nhằm mục tiêu hoàn thành trong thời hạn xây dựng.","caption3":"","name4":"Manajemen Proses","summary4":"Pengelolaan untuk memajukan konstruksi sesuai jadwal","detail4":"Kegiatan pengelolaan untuk memahami kemajuan konstruksi berdasarkan jadwal kerja, dan apabila terjadi keterlambatan, mengambil langkah-langkah perbaikan untuk mencapai penyelesaian dalam jangka waktu yang ditentukan.","caption4":"","images":[]},{"rowNum":54,"id":"053","catCode":"CAT04","nameJa":"安全管理","readingJa":"あんぜんかんり","summaryJa":"事故・災害を防ぐための管理","detailJa":"工事現場での労働災害・公衆災害を防止するための日常的な管理活動。点検・KY活動・教育・整理整頓・保護具管理などを含む。","nameEn":"Safety Management","summaryEn":"Daily management activities to prevent occupational and public accidents at construction sites.","detailEn":"Daily management activities to prevent occupational accidents and public accidents at construction sites. Includes inspections, KY activities, training, housekeeping, and protective equipment management.","image":"","captionJa":"","captionEn":"","published":"","name3":"Quản lý an toàn","summary3":"Các hoạt động quản lý hàng ngày để ngăn ngừa tai nạn lao động và tai nạn công cộng tại công trường.","detail3":"Các hoạt động quản lý hàng ngày để ngăn ngừa tai nạn lao động và tai nạn công cộng tại công trường xây dựng. Bao gồm kiểm tra, hoạt động KY, đào tạo, sắp xếp ngăn nắp và quản lý thiết bị bảo hộ.","caption3":"","name4":"Manajemen Keselamatan","summary4":"Manajemen untuk mencegah kecelakaan dan bencana","detail4":"Kegiatan manajemen harian untuk mencegah kecelakaan kerja dan kecelakaan publik di lokasi konstruksi. Mencakup inspeksi, kegiatan KY (Kiken Yochi/prediksi bahaya), pendidikan, penataan dan pembersihan, serta manajemen alat pelindung diri.","caption4":"","images":[]},{"rowNum":55,"id":"054","catCode":"CAT04","nameJa":"出来形管理","readingJa":"できがたかんり","summaryJa":"完成した構造物の寸法・形状の確認","detailJa":"施工が完了した構造物・工作物の寸法・高さ・勾配などを計測し、設計値との差異が規定の許容誤差内に収まっているか確認する管理。","nameEn":"As-Built Management","summaryEn":"Measuring completed structures to confirm dimensions are within allowable tolerances.","detailEn":"Measuring the dimensions, height, and gradient of completed structures and works to confirm that deviations from design values are within specified allowable tolerances.","image":"","captionJa":"","captionEn":"","published":"","name3":"Quản lý kích thước hoàn công","summary3":"Đo kết cấu hoàn thiện để xác nhận kích thước nằm trong sai số cho phép.","detail3":"Đo kích thước, chiều cao và độ dốc của kết cấu và công trình hoàn thiện để xác nhận rằng độ lệch so với giá trị thiết kế nằm trong sai số cho phép quy định.","caption3":"","name4":"Pengendalian hasil pekerjaan","summary4":"Konfirmasi dimensi dan bentuk struktur yang telah selesai","detail4":"Pengelolaan untuk mengukur dimensi, ketinggian, kemiringan, dan sebagainya dari struktur dan bangunan yang telah selesai dikerjakan, serta memastikan bahwa perbedaan dengan nilai desain berada dalam batas toleransi yang telah ditetapkan.","caption4":"","images":[]},{"rowNum":56,"id":"055","catCode":"CAT04","nameJa":"検査","readingJa":"けんさ","summaryJa":"工事の品質・出来形を確認すること","detailJa":"発注者側の監督員が工事の品質・出来形・写真記録などを確認し、合否を判定する公式チェック。中間検査・完成検査がある。","nameEn":"Inspection","summaryEn":"An official check by the client's supervisor to confirm construction quality and dimensions.","detailEn":"An official check by the client's supervisor to confirm construction quality, as-built dimensions, and photographic records, and to judge pass or fail. Includes intermediate inspections and final completion inspections.","image":"","captionJa":"","captionEn":"","published":"","name3":"Kiểm tra","summary3":"Kiểm tra chính thức của giám sát viên chủ đầu tư để xác nhận chất lượng và kích thước xây dựng.","detail3":"Kiểm tra chính thức của giám sát viên chủ đầu tư để xác nhận chất lượng xây dựng, kích thước hoàn công và hồ sơ ảnh, và đánh giá đạt hay không đạt. Bao gồm kiểm tra giữa chừng và kiểm tra nghiệm thu cuối cùng.","caption3":"","name4":"Pemeriksaan","summary4":"Mengonfirmasi kualitas dan hasil bentuk pekerjaan konstruksi","detail4":"Pemeriksaan resmi yang dilakukan oleh pengawas dari pihak pemesan untuk memverifikasi kualitas konstruksi, hasil bentuk, rekaman foto, dan lainnya serta menentukan kelulusan atau ketidaklulusan. Terdapat pemeriksaan antara dan pemeriksaan penyelesaian.","caption4":"","images":[]},{"rowNum":57,"id":"056","catCode":"CAT04","nameJa":"試験","readingJa":"しけん","summaryJa":"材料や施工の品質を数値で確認すること","detailJa":"コンクリートのスランプ・強度試験、土の締固め度試験など、材料や施工の品質を数値データで確認する作業。試験結果は管理帳票に記録する。","nameEn":"Testing","summaryEn":"Confirming the quality of materials and construction with numerical data.","detailEn":"Work to confirm the quality of materials and construction with numerical data, such as concrete slump and strength tests, and soil compaction tests. Test results are recorded in management forms.","image":"","captionJa":"","captionEn":"","published":"","name3":"Thử nghiệm","summary3":"Xác nhận chất lượng vật liệu và xây dựng bằng dữ liệu số.","detail3":"Công việc xác nhận chất lượng vật liệu và xây dựng bằng dữ liệu số, như thử nghiệm độ sụt và cường độ bê tông, và thử nghiệm độ đầm chặt của đất. Kết quả thử nghiệm được ghi vào mẫu quản lý.","caption3":"","name4":"Ujian","summary4":"Mengonfirmasi kualitas bahan dan pelaksanaan konstruksi dengan angka","detail4":"Pekerjaan untuk memastikan kualitas material dan pelaksanaan konstruksi dengan data numerik, seperti uji slump dan kekuatan beton, uji tingkat pemadatan tanah, dan sebagainya. Hasil pengujian dicatat dalam lembar pengelolaan.","caption4":"","images":[]},{"rowNum":58,"id":"057","catCode":"CAT04","nameJa":"密度試験","readingJa":"みつどしけん","summaryJa":"締固めた土の密度を確認する試験","detailJa":"盛土・路盤の締固め後、土の密度（乾燥密度）を現地で測定し、締固め度が基準値（90〜95%以上）を満たしているか確認する試験。","nameEn":"Density Test","summaryEn":"A field test to confirm that compacted soil meets the required density standard.","detailEn":"A test conducted after compacting embankment or road base to measure the dry density of soil in the field, confirming that the compaction ratio meets the standard value (90–95% or more).","image":"","captionJa":"","captionEn":"","published":"","name3":"Thử nghiệm mật độ","summary3":"Thử nghiệm hiện trường để xác nhận đất đầm chặt đạt tiêu chuẩn mật độ yêu cầu.","detail3":"Thử nghiệm được thực hiện sau khi đầm chặt nền đắp hoặc nền đường để đo mật độ khô của đất tại hiện trường, xác nhận tỷ lệ đầm chặt đạt giá trị tiêu chuẩn (90–95% hoặc hơn).","caption3":"","name4":"Uji kepadatan","summary4":"Uji untuk memverifikasi kepadatan tanah yang dipadatkan","detail4":"Pengujian untuk mengukur kepadatan tanah (kepadatan kering) di lapangan setelah pemadatan timbunan dan subgrade, dan memastikan bahwa tingkat pemadatan memenuhi nilai standar (90-95% atau lebih).","caption4":"","images":[]},{"rowNum":59,"id":"058","catCode":"CAT04","nameJa":"スランプ試験","readingJa":"すらんぷしけん","summaryJa":"コンクリートの軟らかさを確認する試験","detailJa":"生コンクリートをスランプコーンに詰め、抜いた後の沈下量（スランプ値）を測定する試験。コンクリートのワーカビリティ（施工性）を確認する。","nameEn":"Slump Test","summaryEn":"A test measuring the consistency of fresh concrete using a slump cone.","detailEn":"A test where fresh concrete is packed into a slump cone and the amount of subsidence (slump value) after the cone is removed is measured. Used to confirm the workability of concrete.","image":"","captionJa":"","captionEn":"","published":"","name3":"Thử nghiệm độ sụt","summary3":"Thử nghiệm đo độ đồng nhất của bê tông tươi bằng côn độ sụt.","detail3":"Thử nghiệm bê tông tươi được nhồi vào côn độ sụt và đo lượng lún xuống (giá trị độ sụt) sau khi tháo côn. Dùng để xác nhận tính công tác của bê tông.","caption3":"","name4":"Uji slump","summary4":"Tes untuk mengonfirmasi kelunakan beton","detail4":"Uji pengukuran jumlah penurunan (nilai slump) setelah mengisi beton segar ke dalam kerucut slump dan mencabutnya. Digunakan untuk memastikan workabilitas (kemudahan pengerjaan) beton.","caption4":"","images":[]},{"rowNum":60,"id":"059","catCode":"CAT04","nameJa":"写真管理","readingJa":"しゃしんかんり","summaryJa":"施工状況を写真で記録・整理すること","detailJa":"工事の各段階を写真で記録し、工事完成後も施工状況を確認できるよう整理・保管する管理活動。埋設物・鉄筋など完成後に見えなくなる部分の記録に特に重要。","nameEn":"Photo Documentation","summaryEn":"Recording and organizing construction progress with photographs.","detailEn":"A management activity of photographically recording each stage of construction and organizing and storing the photos so construction conditions can be confirmed even after completion. Particularly important for recording buried items and reinforcement that cannot be seen after completion.","image":"","captionJa":"","captionEn":"","published":"","name3":"Quản lý ảnh","summary3":"Ghi lại và sắp xếp tiến độ xây dựng bằng ảnh chụp.","detail3":"Hoạt động quản lý ghi lại từng giai đoạn xây dựng bằng ảnh và sắp xếp, lưu trữ ảnh để có thể xác
